---
rules:
  # These rules replace only p/default's seven-day cooldown checks. Keep this
  # local policy aligned with the one-day settings enforced by local QA.
  - id: local-qa-dependabot-one-day-cooldown
    pattern-either:
      - patterns:
          - pattern-inside: |
              updates:
                ...
          - pattern: |
              - package-ecosystem: $ECOSYSTEM
                ...
          - pattern-not: |
              - package-ecosystem: $ECOSYSTEM
                ...
                cooldown:
                  ...
                ...
      - patterns:
          - pattern-inside: |
              updates:
                ...
          - pattern-regex: '(?m)^[ \t]*(?:default-days|semver-(?:major|minor|patch)-days)[ \t]*:[ \t]*(?P<DAYS>\d+)'
          - metavariable-comparison:
              metavariable: $DAYS
              comparison: int($DAYS) < 1
          - focus-metavariable: $DAYS
      - patterns:
          - pattern-inside: |
              updates:
                ...
          - pattern-regex: '(?m)^[ \t]*(?:default-days|semver-(?:major|minor|patch)-days)[ \t]*:[ \t]*(?P<VAL>[^#\r\n]*?)[ \t]*(?:#.*)?$'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^(?!\d+$)'
          - focus-metavariable: $VAL
    message: >-
      This Dependabot configuration does not set a one-day cooldown. Add a
      `cooldown` block with `default-days: 1` to each `package-ecosystem` entry
      under `updates`.
      Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#cooldown
    languages:
      - yaml
    severity: MEDIUM
    paths:
      include:
        - "**/.github/dependabot.yml"
        - "**/.github/dependabot.yaml"
    metadata:
      category: security
      technology:
        - dependabot
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      owasp:
        - A08:2021 - Software and Data Integrity Failures
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      subcategory:
        - audit
      vulnerability_class:
        - Insecure Configuration
      references:
        - https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#cooldown
      replaces:
        - package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown

  - id: local-qa-renovate-one-day-release-age
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  { ..., "$schema": $SCHEMA, ... }
              - pattern: |
                  { ..., "extends": $EXTENDS, ... }
              - pattern: |
                  { ..., "packageRules": [...], ... }
              - pattern: |
                  { ..., "customManagers": [...], ... }
          - pattern-not: |
              { ..., "minimumReleaseAge": "$AGE", ... }
      - patterns:
          - pattern-regex: '"minimumReleaseAge"\s*:\s*"(?P<AGE>\d+) days?"'
          - metavariable-comparison:
              metavariable: $AGE
              comparison: int($AGE) < 1
          - focus-metavariable: $AGE
      - patterns:
          - pattern: |
              "minimumReleaseAge": "$AGE"
          - metavariable-regex:
              metavariable: $AGE
              regex: '^(?!\d+ days?$)'
          - focus-metavariable: $AGE
    message: >-
      This Renovate configuration does not enforce a one-day minimum release
      age. Set the root `"minimumReleaseAge"` to at least `"1 day"`; keep any
      `packageRules` override at one day or longer. A rule-level `false` remains
      an explicit exception.
      Reference: https://docs.renovatebot.com/configuration-options/#minimumreleaseage
    languages:
      - json
    severity: MEDIUM
    paths:
      include:
        - "**/renovate.json"
        - "**/renovate.json5"
        - "**/.renovaterc"
        - "**/.renovaterc.json"
        - "**/.renovaterc.json5"
    metadata:
      category: security
      technology:
        - renovate
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      owasp:
        - A08:2021 - Software and Data Integrity Failures
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      subcategory:
        - audit
      vulnerability_class:
        - Insecure Configuration
      references:
        - https://docs.renovatebot.com/configuration-options/#minimumreleaseage
      replaces:
        - package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age

  - id: local-qa-pnpm-one-day-release-age
    message: >-
      This pnpm workspace configuration does not set a one-day minimum release
      age. Add `minimumReleaseAge: 1440` (minutes) to wait at least one day
      before installing newly published package versions.
      Reference: https://pnpm.io/settings#minimumreleaseage
    languages:
      - yaml
    severity: MEDIUM
    paths:
      include:
        - "**/pnpm-workspace.yaml"
    pattern-either:
      - patterns:
          - pattern-regex: '(?ms)(?:\A|^---$\n)(?:(?!^minimumReleaseAge\s*:)(?!^---$)[\s\S])*?(?P<TARGET>^(?!minimumReleaseAge\s*:)[^\s#][^:\r\n]*:)(?:(?!^minimumReleaseAge\s*:)(?!^---$)[\s\S])*?(?=^---$|\z)'
          - focus-metavariable: $TARGET
      - patterns:
          - pattern-regex: '^\s*minimumReleaseAge\s*:\s*(?P<AGE>\d+)'
          - metavariable-comparison:
              metavariable: $AGE
              comparison: int($AGE) < 1440
          - focus-metavariable: $AGE
      - patterns:
          - pattern: |
              minimumReleaseAge: $AGE
          - metavariable-regex:
              metavariable: $AGE
              regex: '^\D'
          - focus-metavariable: $AGE
      - pattern-regex: '(?m)^\s*minimumReleaseAge\s*:\s*$'
    metadata:
      category: security
      technology:
        - pnpm
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      owasp:
        - A08:2021 - Software and Data Integrity Failures
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      subcategory:
        - audit
      vulnerability_class:
        - Insecure Configuration
      references:
        - https://pnpm.io/settings#minimumreleaseage
      replaces:
        - package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age

  - id: local-qa-uv-one-day-dependency-cooldown
    pattern-either:
      - patterns:
          - pattern-regex: '(?ms)^[ \t]*\[tool\.uv\][ \t]*(?:#.*)?(?:\r?\n|(?=\z))(?P<TARGET>(?:(?!^[ \t]*\[{1,2}[^\]\r\n]+\]{1,2}[ \t]*(?:#.*)?\r?$)[\s\S])*)'
          - metavariable-regex:
              metavariable: $TARGET
              regex: '(?m)^(?![\s\S]*^[ \t]*exclude-newer[ \t]*=)'
          - focus-metavariable: $TARGET
      - patterns:
          - pattern-regex: '(?ms)^[ \t]*\[tool\.uv\][^\r\n]*\r?\n(?:(?!^[ \t]*\[{1,2}[^\]\r\n]+\]{1,2}[ \t]*(?:#.*)?\r?$)[\s\S])*?^[ \t]*exclude-newer[ \t]*=[ \t]*"(?P<DAYS>\d+)\s*d(?:ays?)?"'
          - metavariable-comparison:
              metavariable: $DAYS
              comparison: int($DAYS) < 1
          - focus-metavariable: $DAYS
      - patterns:
          - pattern-regex: '(?ms)^[ \t]*\[tool\.uv\][^\r\n]*\r?\n(?:(?!^[ \t]*\[{1,2}[^\]\r\n]+\]{1,2}[ \t]*(?:#.*)?\r?$)[\s\S])*?^[ \t]*exclude-newer[ \t]*=[ \t]*"(?P<VAL>[^"\r\n]+)"'
          - metavariable-regex:
              metavariable: $VAL
              regex: '(?i)^(?!\d+\s*d(?:ays?)?\b)(?!\d+\s*(?:weeks?|wks?|w|months?|mos?|mo|years?|yrs?|y)\b)(?!P[^Tt]*[WMY])(?!P[1-9]\d*D\b)'
          - focus-metavariable: $VAL
    message: >-
      This pyproject.toml configures uv but does not set a one-day dependency
      cooldown. Add `exclude-newer = "1 day"` under `[tool.uv]` to wait one day
      before resolving newly published package versions.
      Reference: https://docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns
    languages:
      - generic
    severity: MEDIUM
    paths:
      include:
        - "**/pyproject.toml"
    metadata:
      category: security
      technology:
        - uv
        - python
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      owasp:
        - A08:2021 - Software and Data Integrity Failures
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      subcategory:
        - audit
      vulnerability_class:
        - Insecure Configuration
      references:
        - https://docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns
      replaces:
        - package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown

  - id: local-qa-uv-toml-one-day-dependency-cooldown
    pattern-either:
      - patterns:
          - pattern-regex: '(?ms)\A(?P<TARGET>(?:(?!^[ \t]*\[{1,2}[^\]\r\n]+\]{1,2}[ \t]*(?:#.*)?\r?$)[\s\S])*)'
          - metavariable-regex:
              metavariable: $TARGET
              regex: '(?m)^(?![\s\S]*^[ \t]*exclude-newer[ \t]*=)'
          - focus-metavariable: $TARGET
      - patterns:
          - pattern-regex: '(?ms)\A(?:(?!^[ \t]*\[{1,2}[^\]\r\n]+\]{1,2}[ \t]*(?:#.*)?\r?$)[\s\S])*?^[ \t]*exclude-newer[ \t]*=[ \t]*"(?P<DAYS>\d+)\s*d(?:ays?)?"'
          - metavariable-comparison:
              metavariable: $DAYS
              comparison: int($DAYS) < 1
          - focus-metavariable: $DAYS
      - patterns:
          - pattern-regex: '(?ms)\A(?:(?!^[ \t]*\[{1,2}[^\]\r\n]+\]{1,2}[ \t]*(?:#.*)?\r?$)[\s\S])*?^[ \t]*exclude-newer[ \t]*=[ \t]*"(?P<VAL>[^"\r\n]+)"'
          - metavariable-regex:
              metavariable: $VAL
              regex: '(?i)^(?!\d+\s*d(?:ays?)?\b)(?!\d+\s*(?:weeks?|wks?|w|months?|mos?|mo|years?|yrs?|y)\b)(?!P[^Tt]*[WMY])(?!P[1-9]\d*D\b)'
          - focus-metavariable: $VAL
    message: >-
      This uv.toml configures uv but does not set a one-day dependency
      cooldown. Add `exclude-newer = "1 day"` at the file root to wait one day
      before resolving newly published package versions.
      Reference: https://docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns
    languages:
      - generic
    severity: MEDIUM
    paths:
      include:
        - "**/uv.toml"
    metadata:
      category: security
      technology:
        - uv
        - python
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      owasp:
        - A08:2021 - Software and Data Integrity Failures
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      subcategory:
        - audit
      vulnerability_class:
        - Insecure Configuration
      references:
        - https://docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns
      replaces:
        - package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
