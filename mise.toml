[settings]
minimum_release_age = "1d"
use_versions_host_track = false

[tools]
actionlint = "latest"
go = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"github:securego/gosec" = "latest"
golangci-lint = "latest"
gomplate = "latest"
grype = "latest"
hcl2json = "latest"
pnpm = "latest"
scorecard = "latest"
shellcheck = "latest"
shfmt = "latest"
syft = "latest"
terraform = "latest"
terragrunt = "latest"
tflint = "latest"
trivy = "latest"
trufflehog = "latest"
uv = "latest"
yq = "latest"

[tools.osv-scanner]
version = "latest"
slsa_signer_identity = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0"
slsa_signer_issuer = "https://token.actions.githubusercontent.com"
