name: Weekly release operation
description: Plan or publish a validated weekly release of the caller repository
inputs:
  phase:
    description: Release phase (plan or publish)
    required: true
outputs:
  ready:
    description: Whether validation and publication are needed
    value: ${{ steps.execute.outputs.ready }}
  tag:
    description: Proposed SemVer tag
    value: ${{ steps.execute.outputs.tag }}
  sha:
    description: Release commit SHA
    value: ${{ steps.execute.outputs.sha }}
  published:
    description: Whether a release was published
    value: ${{ steps.execute.outputs.published }}
runs:
  using: composite
  steps:
    - id: execute
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
      run: bash "${GITHUB_ACTION_PATH}/weekly-release.sh" "${PHASE}"
