---
name: Mention bot using OpenCode
on:
  # issue_comment:
  #   types:
  #     - created
  # pull_request_review_comment:
  #   types:
  #     - created
  workflow_call:
    inputs:
      model:
        required: false
        type: string
        description: Model to use with opencode
        default: opencode-go/minimax-m3
      agent:
        required: false
        type: string
        description: Primary agent to use (falls back to default_agent or 'build')
        default: null
      share:
        required: false
        type: string
        description: Share the opencode session
        default: false
      prompt:
        required: false
        type: string
        description: Custom prompt to override the default prompt
        default: null
      use-github-token:
        required: false
        type: boolean
        description: Use GITHUB_TOKEN directly instead of OpenCode App token exchange
        default: false
      mentions:
        required: false
        type: string
        description: Comma-separated list of trigger phrases (case-insensitive)
        default: /opencode,/oc
      variant:
        required: false
        type: string
        description: Model variant for provider-specific reasoning effort (e.g., high, max, minimal)
        default: thinking
      oidc-base-url:
        required: false
        type: string
        description: Base URL for OIDC token exchange API
        default: null
      opencode-version:
        required: false
        type: string
        description: OpenCode version to install (e.g., v1.2.3)
        default: latest
      use-bundled-toolkit:
        required: false
        type: boolean
        description: Use the action's bundled .opencode/ agents, commands, skills, and supporting configuration
        default: true
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    secrets:
      OPENROUTER_API_KEY:
        required: false
        description: OpenRouter API key for opencode
      OPENCODE_API_KEY:
        required: false
        description: API key for opencode
      SAKURA_AI_ENGINE_API_KEY:
        required: false
        description: API key for Sakura AI Engine
      GH_TOKEN:
        required: false
        description: GitHub token for accessing the repository
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  opencode-bot:
    if: >
      (
        github.event_name != 'issue_comment'
        && github.event_name != 'pull_request_review_comment'
      ) || (
        github.event_name == 'issue_comment'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          persist-credentials: false
      - name: Run OpenCode
        uses: dceoy/opencode-action@e5fa6280c65275a5cd7b2251d235f752849ab4d4  # v0.6.5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          SAKURA_AI_ENGINE_API_KEY: ${{ secrets.SAKURA_AI_ENGINE_API_KEY }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
        with:
          model: ${{ inputs.model }}
          agent: ${{ inputs.agent }}
          share: ${{ inputs.share }}
          prompt: ${{ inputs.prompt }}
          use-github-token: ${{ inputs.use-github-token }}
          mentions: ${{ inputs.mentions }}
          variant: ${{ inputs.variant }}
          oidc-base-url: ${{ inputs.oidc-base-url }}
          opencode-version: ${{ inputs.opencode-version }}
          use-bundled-toolkit: ${{ inputs.use-bundled-toolkit }}
