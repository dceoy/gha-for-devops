---
name: Finalize a Python package release on GitHub
on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
        description: Existing draft GitHub Release tag
      release-branch:
        required: false
        type: string
        default: main
        description: Release branch whose tip must match the validated workflow SHA
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
env:
  GH_TELEMETRY: 'false'
jobs:
  finalize:
    if: inputs.release-tag != ''
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
    steps:
      - name: Verify source, tag, and draft assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid stable release tag: ${RELEASE_TAG}."
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/${RELEASE_BRANCH}" ]]; then
            echo "::error::Release must run on ${RELEASE_BRANCH}."
            exit 1
          fi
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_BRANCH}" --jq '.object.sha')"
          if [[ "${branch_sha}" != "${SOURCE_SHA}" ]]; then
            echo "::error::Release branch advanced past validated source ${SOURCE_SHA}."
            exit 1
          fi
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          if [[ "${tag_sha}" != "${SOURCE_SHA}" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} does not resolve to ${SOURCE_SHA}."
            exit 1
          fi
          release_json="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,assets)"
          if ! jq -e '.isDraft == true and ([.assets[].name] | any(endswith(".whl"))) and ([.assets[].name] | any(endswith(".tar.gz")))' <<< "${release_json}" >/dev/null; then
            echo "::error::Release must be a draft with a wheel and source distribution attached."
            exit 1
          fi
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
