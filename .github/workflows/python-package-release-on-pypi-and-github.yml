---
name: Python package release on PyPI and GitHub
on:
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        description: Release mode (tag-release, prepare, finalize)
        default: tag-release
      release-branch:
        required: false
        type: string
        description: Source branch for prepare and finalize
        default: main
      ci-workflow:
        required: false
        type: string
        description: Successful push CI required for prepare
        default: ci.yml
      release-tag:
        required: false
        type: string
        description: Prepared release tag required for finalize
        default: null
      project-name:
        required: false
        type: string
        description: Prepared project name required for finalize
        default: null
      package-path:
        required: false
        type: string
        description: Repository-relative package path (forward slashes only, no .. or glob characters)
        default: .
      create-github-release:
        required: false
        type: boolean
        description: Create a GitHub release
        default: true
      publish-to-pypi:
        required: false
        type: boolean
        description: Publish the distribution to PyPI
        default: true
      publish-to-testpypi-before-pypi:
        required: false
        type: boolean
        description: Publish to TestPyPI before PyPI when PyPI publishing is enabled
        default: false
      python-version:
        required: false
        type: string
        description: Python version to use (not applicable if uv.lock is present)
        default: 3.x
      uv-version:
        required: false
        type: string
        description: Version of uv to use
        default: latest
      enable-cache:
        required: false
        type: boolean
        description: Cache dependency downloads (never distributions or credentials)
        default: true
      cache-dependency-path:
        required: false
        type: string
        description: Dependency file used to scope the cache
        default: null
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust the uv cache
        default: null
      requirements-txt:
        required: false
        type: string
        description: Path to the requirements.txt file (not applicable if uv.lock is present)
        default: null
      distribution-artifact-name:
        required: false
        type: string
        description: Name of the artifact for the distribution packages
        default: python-package-distributions
      artifact-retention-days:
        required: false
        type: number
        description: Number of days to retain artifacts
        default: 1
      artifact-overwrite:
        required: false
        type: boolean
        description: Overwrite existing artifacts
        default: true
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
    outputs:
      release-tag:
        description: Prepared draft tag (empty if no release required)
        value: ${{ jobs.prepare-draft-release.outputs.release-tag }}
      project-name:
        description: Project name of the distribution
        value: ${{ jobs.python-release-build.outputs.project-name }}
      distribution-artifact-name:
        description: Name of the uploaded artifact
        value: ${{ inputs.distribution-artifact-name }}
    secrets:
      PYPI_API_TOKEN:
        required: false
        description: PyPI API token
      TEST_PYPI_API_TOKEN:
        required: false
        description: TestPyPI API token
      GH_TOKEN:
        required: false
        description: GitHub token
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
env:
  GH_TELEMETRY: 'false'
jobs:
  validate:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Validate release mode and required inputs
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          PROJECT_NAME: ${{ inputs.project-name }}
        run: |
          case "${MODE}" in
            tag-release|prepare) ;;
            finalize)
              if [[ -z "${RELEASE_TAG}" || -z "${PROJECT_NAME}" ]]; then
                echo '::error::finalize requires release-tag and project-name.'
                exit 1
              fi
              ;;
            *) echo "::error::Unknown release mode: ${MODE}."; exit 1 ;;
          esac
  python-release-build:
    name: Build the Python 🐍 distribution 📦
    needs:
      - validate
      - prepare-plan
    if: >-
      !cancelled()
      && needs.validate.result == 'success'
      && (inputs.mode == 'tag-release' || (inputs.mode == 'prepare'
          && needs.prepare-plan.result == 'success'
          && needs.prepare-plan.outputs.release-tag != ''))
    runs-on: ${{ inputs.runs-on }}
    env:
      UV_EXCLUDE_NEWER: 1 day
      UV_MALWARE_CHECK: "1"
      PACKAGE_PATH: ${{ inputs.package-path }}
    outputs:
      project-name: ${{ steps.read-project-name.outputs.project_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: ${{ inputs.enable-cache }}
          cache-dependency-glob: ${{ inputs.cache-dependency-path || format('{0}/uv.lock', inputs.package-path) }}
          cache-suffix: ${{ inputs.cache-salt }}
      - name: Set up Python
        if: hashFiles(format('{0}/uv.lock', inputs.package-path)) == ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Read the project name
        id: read-project-name
        working-directory: ${{ inputs.package-path }}
        shell: python {0}
        run: |
          import os
          import tomllib
          from pathlib import PurePosixPath, PureWindowsPath
          package_path = os.environ["PACKAGE_PATH"]
          if (PurePosixPath(package_path).is_absolute() or PureWindowsPath(package_path).drive
                  or ".." in PurePosixPath(package_path).parts or ".." in PureWindowsPath(package_path).parts
                  or "\\" in package_path or any(char in package_path for char in "*?[]{}!()+@|")):
              raise ValueError("package-path must be relative, use forward slashes, and contain no .. or glob characters")
          with open("pyproject.toml", "rb") as f:
              d = tomllib.load(f)
          if "project" in d and "name" in d["project"]:
              name = d["project"]["name"]
          else:
              raise ValueError(f"project name not found in pyproject.toml: {d}")
          print(f"project_name={name}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"project_name={name}", file=f)
      - name: Build a binary wheel and a source tarball
        env:
          REQUIREMENTS_TXT_PATH: ${{ inputs.requirements-txt }}
          HAS_UV_LOCK: ${{ hashFiles(format('{0}/uv.lock', inputs.package-path)) != '' }}
          STEPS_READ_PROJECT_NAME_OUTPUTS_PROJECT_NAME: ${{ steps.read-project-name.outputs.project_name }}
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ "${HAS_UV_LOCK}" != "true" && -n "${REQUIREMENTS_TXT_PATH}" ]]; then
            uv pip install --system -r "${REQUIREMENTS_TXT_PATH}"
          fi
          uv build
          mv dist "/tmp/${STEPS_READ_PROJECT_NAME_OUTPUTS_PROJECT_NAME}_dist"
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.distribution-artifact-name }}
          path: /tmp/${{ steps.read-project-name.outputs.project_name }}_dist/
          retention-days: ${{ inputs.artifact-retention-days }}
          overwrite: ${{ inputs.artifact-overwrite }}
  python-release-testpypi:
    name: Publish the Python 🐍 distribution 📦 to TestPyPI
    if: >
      inputs.mode == 'tag-release'
      && startsWith(github.ref, 'refs/tags/')
      && inputs.publish-to-pypi
      && inputs.publish-to-testpypi-before-pypi
    needs:
      - python-release-build
    runs-on: ${{ inputs.runs-on }}
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ needs.python-release-build.outputs.project-name }}
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.distribution-artifact-name }}
          path: dist/
      # NOTE: Without TEST_PYPI_API_TOKEN, this action falls back to OIDC
      # trusted publishing, which upstream does not yet support for an
      # externally defined reusable workflow (pypa/gh-action-pypi-publish#166).
      # Callers must set TEST_PYPI_API_TOKEN to publish successfully.
      - name: Check the TestPyPI API token is set
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [[ -z "${TEST_PYPI_API_TOKEN}" ]]; then
            echo "TEST_PYPI_API_TOKEN is required when publish-to-testpypi-before-pypi is enabled" \
              "because trusted publishing is not supported for this externally defined reusable" \
              "workflow (pypa/gh-action-pypi-publish#166). Set the TEST_PYPI_API_TOKEN secret." >&2
            exit 1
          fi
      - name: Publish distribution 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}  # zizmor: ignore[use-trusted-publishing] Optional API-token authentication.
          repository-url: https://test.pypi.org/legacy/
  python-release-github:
    name: Sign the Python 🐍 distribution 📦 with Sigstore and upload them to GitHub Release
    if: >
      inputs.mode == 'tag-release'
      && startsWith(github.ref, 'refs/tags/')
      && inputs.create-github-release
      && (! (failure() || cancelled()))
    needs:
      - python-release-build
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.distribution-artifact-name }}
          path: dist/
      - name: Validate the version-tag consistency
        env:
          TAG_NAME: ${{ github.ref_name }}
          NEEDS_BUILD_OUTPUTS_PROJECT_NAME: ${{ needs.python-release-build.outputs.project-name }}
        run: |
          distribution_name="$( \
            tr '[:upper:]' '[:lower:]' <<< "${NEEDS_BUILD_OUTPUTS_PROJECT_NAME}" \
              | sed -E 's/[-_.]+/_/g' \
          )"
          first_dist="$( \
            find dist -type f -name "${distribution_name}-*" -exec basename {} \; \
              | sort \
              | head -n 1 \
          )"
          if [[ -z "${first_dist}" ]]; then
            echo "No distribution file found for ${NEEDS_BUILD_OUTPUTS_PROJECT_NAME}." >&2
            exit 1
          fi
          v="${first_dist#"${distribution_name}"-}"
          v="${v%%-*}"
          v="${v%.tar.gz}"
          if [[ "${TAG_NAME}" != "${v}" ]] && [[ "${TAG_NAME}" != "v${v}" ]]; then
            echo "The tag (${TAG_NAME}) is inconsistent with the version (${v})." && exit 1
          fi
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: >-
            ./dist/*.whl
      - name: Create GitHub Release
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${REPOSITORY}" --generate-notes --verify-tag
      - name: Upload artifact signatures to GitHub Release
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
        # Upload to GitHub Release using the `gh` CLI.
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/** --repo "${REPOSITORY}" --clobber
  python-release-pypi:
    name: Publish the Python 🐍 distribution 📦 to PyPI
    if: >-
      !cancelled()
      && inputs.mode == 'tag-release'
      && startsWith(github.ref, 'refs/tags/')
      && inputs.publish-to-pypi
      && needs.python-release-build.result == 'success'
      && (needs.python-release-testpypi.result == 'success' || needs.python-release-testpypi.result == 'skipped')
      && (needs.python-release-github.result == 'success' || needs.python-release-github.result == 'skipped')
    needs:
      - python-release-build
      - python-release-testpypi
      - python-release-github
    runs-on: ${{ inputs.runs-on }}
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.python-release-build.outputs.project-name }}
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.distribution-artifact-name }}
          path: dist/
      # NOTE: Without PYPI_API_TOKEN, this action falls back to OIDC
      # trusted publishing, which upstream does not yet support for an
      # externally defined reusable workflow (pypa/gh-action-pypi-publish#166).
      # Callers must set PYPI_API_TOKEN to publish successfully.
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}   # zizmor: ignore[use-trusted-publishing] Optional API-token authentication.
          verbose: true
  prepare-plan:
    needs: validate
    if: inputs.mode == 'prepare' && github.ref == format('refs/heads/{0}', inputs.release-branch)
    runs-on: ${{ inputs.runs-on }}
    permissions:
      actions: read
      contents: read
    outputs:
      release-tag: ${{ steps.plan.outputs.tag }}
      source-sha: ${{ steps.plan.outputs.source-sha }}
    steps:
      - name: Checkout the workflow commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan release from project.version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          PACKAGE_PATH: ${{ inputs.package-path }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" || "${GITHUB_SHA}" != "${SOURCE_SHA}" ]]; then
            echo '::notice::Workflow SHA differs from the validated source; skipping.'
            exit 0
          fi
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_BRANCH}" --jq '.object.sha')"
          if [[ "${branch_sha}" != "${SOURCE_SHA}" ]]; then
            echo '::notice::Release branch advanced since validation; skipping stale release.'
            exit 0
          fi
          ci_runs="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${CI_WORKFLOW}" --commit "${SOURCE_SHA}" --event push --branch "${RELEASE_BRANCH}" --status success --json databaseId --jq 'length')"
          if [[ "${ci_runs}" == 0 ]]; then
            echo "::error::No successful ${CI_WORKFLOW} push run found for ${SOURCE_SHA}."
            exit 1
          fi
          version="$(python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path, PurePosixPath, PureWindowsPath

          package_path = os.environ["PACKAGE_PATH"]
          path = PurePosixPath(package_path)
          if (path.is_absolute() or PureWindowsPath(package_path).drive
                  or ".." in path.parts or "\\" in package_path
                  or any(char in package_path for char in "*?[]{}!()+@|")):
              raise SystemExit("Invalid package-path: expected a relative directory")
          with (Path(package_path) / "pyproject.toml").open("rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if not isinstance(version, str) or not re.fullmatch(
                  r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version
          ):
              raise SystemExit("project.version must be MAJOR.MINOR.PATCH")
          print(version)
          PY
          )"
          tag="v${version}"
          if git rev-parse --verify -q "refs/tags/${tag}^{commit}" > /dev/null; then
            tagged_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [[ "${tagged_sha}" != "${SOURCE_SHA}" ]]; then
              echo "::error::${tag} already points to another commit."
              exit 1
            fi
            if is_draft="$(gh release view "${tag}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
              if [[ "${is_draft}" == false ]]; then
                echo "::notice::${tag} is already published; skipping."
                exit 0
              fi
            fi
          fi
          latest="$(gh release list --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
          if [[ -n "${latest}" ]]; then
            if [[ ! "${latest}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Latest release tag is not stable SemVer: ${latest}"
              exit 1
            fi
            if ! python3 - "${version}" "${latest#v}" <<'PY'
          import sys
          current, previous = (tuple(map(int, value.split("."))) for value in sys.argv[1:])
          sys.exit(0 if current > previous else 1)
          PY
            then
              echo "::error::project.version must exceed the latest release (${latest})."
              exit 1
            fi
          fi
          {
            echo "tag=${tag}"
            echo "source-sha=${SOURCE_SHA}"
          } >> "${GITHUB_OUTPUT}"
  prepare-verify-source:
    needs:
      - prepare-plan
      - python-release-build
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      current: ${{ steps.verify.outputs.current }}
    steps:
      - name: Verify release branch and Git tag still match validated source
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare-plan.outputs.source-sha }}
          RELEASE_TAG: ${{ needs.prepare-plan.outputs.release-tag }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          if [[ -z "${SOURCE_SHA}" || ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ || ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Missing validated source SHA or release tag.'
            exit 1
          fi
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_BRANCH}" --jq '.object.sha')"
          if [[ "${branch_sha}" != "${SOURCE_SHA}" ]]; then
            echo '::notice::Release branch advanced during the build; skipping stale release.'
            echo 'current=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${RELEASE_TAG}" --jq '.[] | select(.ref == "refs/tags/'"${RELEASE_TAG}"'") | [.object.type, .object.sha] | @tsv')"
          if [[ -n "${tag_ref}" ]]; then
            read -r object_type tag_sha <<< "${tag_ref}"
            for ((depth=0; depth<8; depth++)); do
              [[ "${object_type}" == tag ]] || break
              read -r object_type tag_sha < <(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '[.object.type, .object.sha] | @tsv')
            done
            if [[ "${object_type}" != commit || "${tag_sha}" != "${SOURCE_SHA}" ]]; then
              echo "::error::${RELEASE_TAG} does not resolve to the validated source ${SOURCE_SHA}."
              exit 1
            fi
          fi
          echo 'current=true' >> "${GITHUB_OUTPUT}"
  prepare-draft-release:
    needs:
      - prepare-plan
      - python-release-build
      - prepare-verify-source
    if: needs.prepare-verify-source.outputs.current == 'true'
    permissions:
      contents: write
    uses: $/.github/workflows/github-release.yml
    with:
      tag-name: ${{ needs.prepare-plan.outputs.release-tag }}
      create-new-tag: true
      source-branch: ${{ inputs.release-branch }}
      draft: true
      runs-on: ${{ inputs.runs-on }}
  prepare-attach-assets:
    needs:
      - python-release-build
      - prepare-draft-release
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.distribution-artifact-name }}
          path: dist/
      - name: Check distribution names and version
        env:
          RELEASE_TAG: ${{ needs.prepare-draft-release.outputs.release-tag }}
          PROJECT_NAME: ${{ needs.python-release-build.outputs.project-name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          name = re.sub(r"[-_.]+", "_", os.environ["PROJECT_NAME"]).lower()
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) or not name:
              raise SystemExit("Invalid project or release version")
          version = tag[1:]
          dist = Path("dist")
          if not (dist / f"{name}-{version}.tar.gz").is_file():
              raise SystemExit(f"Missing source distribution for {name} {version}")
          if not list(dist.glob(f"{name}-{version}-*.whl")):
              raise SystemExit(f"Missing wheel for {name} {version}")
          PY
      - name: Sign wheels with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: ./dist/*.whl
      - name: Attach distributions and signatures
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-draft-release.outputs.release-tag }}
        run: |
          gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
  release-finalize:
    needs: validate
    if: inputs.mode == 'finalize'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
    steps:
      - name: Verify source, tag, and draft assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          SOURCE_SHA: ${{ github.sha }}
          PROJECT_NAME: ${{ inputs.project-name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid stable release tag: ${RELEASE_TAG}."
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/${RELEASE_BRANCH}" ]]; then
            echo "::error::Release must run on ${RELEASE_BRANCH}."
            exit 1
          fi
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_BRANCH}" --jq '.object.sha')"
          if [[ "${branch_sha}" != "${SOURCE_SHA}" ]]; then
            echo "::error::Release branch advanced past validated source ${SOURCE_SHA}."
            exit 1
          fi
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          if [[ "${tag_sha}" != "${SOURCE_SHA}" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} does not resolve to ${SOURCE_SHA}."
            exit 1
          fi
          if [[ ! "${PROJECT_NAME}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]; then
            echo '::error::Invalid project-name for finalization.'
            exit 1
          fi
          normalized_name="$(tr '[:upper:]' '[:lower:]' <<< "${PROJECT_NAME}" | sed -E 's/[-_.]+/_/g')"
          version="${RELEASE_TAG#v}"
          release_json="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,assets)"
          if ! jq -e --arg name "${normalized_name}" --arg version "${version}" '
            .isDraft == true
            and ([.assets[].name] | any(. == ($name + "-" + $version + ".tar.gz")))
            and ([.assets[].name] | any(startswith($name + "-" + $version + "-") and endswith(".whl")))
          ' <<< "${release_json}" >/dev/null; then
            echo "::error::Release must be a draft with matching wheel and source distribution assets."
            exit 1
          fi
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
