---
name: Python package release on PyPI and GitHub
on:
  workflow_call:
    inputs:
      package-path:
        required: false
        type: string
        description: Path to a Python package or project
        default: .
      create-github-release:
        required: false
        type: boolean
        description: Create a GitHub release
        default: true
      publish-to-pypi:
        required: false
        type: boolean
        description: Publish the distribution to PyPI
        default: true
      publish-to-testpypi-before-pypi:
        required: false
        type: boolean
        description: Publish to TestPyPI before PyPI when PyPI publishing is enabled
        default: false
      python-version:
        required: false
        type: string
        description: Python version to use (not applicable if uv.lock is present)
        default: 3.x
      uv-version:
        required: false
        type: string
        description: Version of uv to use
        default: latest
      enable-cache:
        required: false
        type: boolean
        description: Cache dependency downloads (never distributions or credentials)
        default: true
      cache-dependency-path:
        required: false
        type: string
        description: Dependency file used to scope the cache
        default: null
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust the uv cache
        default: null
      requirements-txt:
        required: false
        type: string
        description: Path to the requirements.txt file (not applicable if uv.lock is present)
        default: null
      distribution-artifact-name:
        required: false
        type: string
        description: Name of the artifact for the distribution packages
        default: python-package-distributions
      artifact-retention-days:
        required: false
        type: number
        description: Number of days to retain artifacts
        default: 1
      artifact-overwrite:
        required: false
        type: boolean
        description: Overwrite existing artifacts
        default: true
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
    outputs:
      project-name:
        description: Project name of the distribution
        value: ${{ jobs.build.outputs.project-name }}
      distribution-artifact-name:
        description: Name of the uploaded artifact
        value: ${{ inputs.distribution-artifact-name }}
    secrets:
      PYPI_API_TOKEN:
        required: false
        description: PyPI API token
      TEST_PYPI_API_TOKEN:
        required: false
        description: TestPyPI API token
      GH_TOKEN:
        required: false
        description: GitHub token
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  build:
    name: Build the Python 🐍 distribution 📦
    runs-on: ${{ inputs.runs-on }}
    env:
      UV_EXCLUDE_NEWER: 7 days
    outputs:
      project-name: ${{ steps.read-project-name.outputs.project_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Detect uv.lock or poetry.lock
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ -f uv.lock ]]; then
            echo "LOCK_FILE=uv.lock" >> "${GITHUB_ENV}"
          elif [[ -f poetry.lock ]]; then
            echo "LOCK_FILE=poetry.lock" >> "${GITHUB_ENV}"
          else
            echo "LOCK_FILE=" >> "${GITHUB_ENV}"
          fi
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: ${{ inputs.enable-cache }}
          cache-dependency-glob: ${{ inputs.cache-dependency-path || format('{0}/uv.lock', inputs.package-path) }}
          cache-suffix: ${{ inputs.cache-salt }}
      - name: Set up Python
        if: env.LOCK_FILE != 'uv.lock'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Read the project name
        id: read-project-name
        working-directory: ${{ inputs.package-path }}
        shell: python {0}
        run: |
          import os
          import tomllib
          with open("pyproject.toml", "rb") as f:
              d = tomllib.load(f)
          if "project" in d and "name" in d["project"]:
              name = d["project"]["name"]
          elif "tool" in d and "poetry" in d["tool"] and "name" in d["tool"]["poetry"]:
              name = d["tool"]["poetry"]["name"]
          else:
              raise ValueError(f"project name not found in pyproject.toml: {d}")
          print(f"project_name={name}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"project_name={name}", file=f)
      - name: Build a binary wheel and a source tarball
        env:
          REQUIREMENTS_TXT_PATH: ${{ inputs.requirements-txt }}
          STEPS_READ_PROJECT_NAME_OUTPUTS_PROJECT_NAME: ${{ steps.read-project-name.outputs.project_name }}
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ "${LOCK_FILE}" == "uv.lock" ]]; then
            uv build
          else
            if [[ -n "${REQUIREMENTS_TXT_PATH}" ]]; then
              uv pip install --system -r "${REQUIREMENTS_TXT_PATH}"
            fi
            if [[ "${LOCK_FILE}" == "poetry.lock" ]]; then
              uv pip install --system poetry
              poetry build --format=wheel --no-interaction
            else
              uv build
            fi
          fi
          mv dist "/tmp/${STEPS_READ_PROJECT_NAME_OUTPUTS_PROJECT_NAME}_dist"
      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.distribution-artifact-name }}
          path: /tmp/${{ steps.read-project-name.outputs.project_name }}_dist/
          retention-days: ${{ inputs.artifact-retention-days }}
          overwrite: ${{ inputs.artifact-overwrite }}
  publish-to-testpypi:
    name: Publish the Python 🐍 distribution 📦 to TestPyPI
    if: >
      startsWith(github.ref, 'refs/tags/')
      && inputs.publish-to-pypi
      && inputs.publish-to-testpypi-before-pypi
    needs:
      - build
    runs-on: ${{ inputs.runs-on }}
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ needs.build.outputs.project-name }}
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.distribution-artifact-name }}
          path: dist/
      # NOTE: Without TEST_PYPI_API_TOKEN, this action falls back to OIDC
      # trusted publishing, which upstream does not yet support for an
      # externally defined reusable workflow (pypa/gh-action-pypi-publish#166).
      # Callers must set TEST_PYPI_API_TOKEN to publish successfully.
      - name: Check the TestPyPI API token is set
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [[ -z "${TEST_PYPI_API_TOKEN}" ]]; then
            echo "TEST_PYPI_API_TOKEN is required when publish-to-testpypi-before-pypi is enabled" \
              "because trusted publishing is not supported for this externally defined reusable" \
              "workflow (pypa/gh-action-pypi-publish#166). Set the TEST_PYPI_API_TOKEN secret." >&2
            exit 1
          fi
      - name: Publish distribution 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}  # zizmor: ignore[use-trusted-publishing] Optional API-token authentication.
          repository-url: https://test.pypi.org/legacy/
  github-release:
    name: Sign the Python 🐍 distribution 📦 with Sigstore and upload them to GitHub Release
    if: >
      startsWith(github.ref, 'refs/tags/')
      && inputs.create-github-release
      && (! (failure() || cancelled()))
    needs:
      - build
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.distribution-artifact-name }}
          path: dist/
      - name: Validate the version-tag consistency
        env:
          TAG_NAME: ${{ github.ref_name }}
          NEEDS_BUILD_OUTPUTS_PROJECT_NAME: ${{ needs.build.outputs.project-name }}
        run: |
          distribution_name="$( \
            tr '[:upper:]' '[:lower:]' <<< "${NEEDS_BUILD_OUTPUTS_PROJECT_NAME}" \
              | sed -E 's/[-_.]+/_/g' \
          )"
          first_dist="$( \
            find dist -type f -name "${distribution_name}-*" -exec basename {} \; \
              | sort \
              | head -n 1 \
          )"
          if [[ -z "${first_dist}" ]]; then
            echo "No distribution file found for ${NEEDS_BUILD_OUTPUTS_PROJECT_NAME}." >&2
            exit 1
          fi
          v="${first_dist#"${distribution_name}"-}"
          v="${v%%-*}"
          v="${v%.tar.gz}"
          if [[ "${TAG_NAME}" != "${v}" ]] && [[ "${TAG_NAME}" != "v${v}" ]]; then
            echo "The tag (${TAG_NAME}) is inconsistent with the version (${v})." && exit 1
          fi
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: >-
            ./dist/*.whl
      - name: Create GitHub Release
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${REPOSITORY}" --generate-notes --verify-tag
      - name: Upload artifact signatures to GitHub Release
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
        # Upload to GitHub Release using the `gh` CLI.
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/** --repo "${REPOSITORY}" --clobber
  publish-to-pypi:
    name: Publish the Python 🐍 distribution 📦 to PyPI
    if: >
      startsWith(github.ref, 'refs/tags/')
      && inputs.publish-to-pypi
      && (! (failure() || cancelled()))
    needs:
      - build
      - publish-to-testpypi
      - github-release
    runs-on: ${{ inputs.runs-on }}
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.project-name }}
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.distribution-artifact-name }}
          path: dist/
      # NOTE: Without PYPI_API_TOKEN, this action falls back to OIDC
      # trusted publishing, which upstream does not yet support for an
      # externally defined reusable workflow (pypa/gh-action-pypi-publish#166).
      # Callers must set PYPI_API_TOKEN to publish successfully.
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}   # zizmor: ignore[use-trusted-publishing] Optional API-token authentication.
          verbose: true
