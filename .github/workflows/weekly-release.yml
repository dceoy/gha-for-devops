---
name: Weekly release
on:
  schedule:
    - cron: '15 0 * * 1'  # Mondays 09:15 JST (UTC+09:00)
  workflow_dispatch:
concurrency:
  group: weekly-release-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
env:
  GH_TELEMETRY: 'false'
  MISE_USE_VERSIONS_HOST_TRACK: 'false'
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: 2026.8.5
jobs:
  plan:
    runs-on: ubuntu-slim
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      sync-major: ${{ steps.plan.outputs.sync-major }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Check out the release candidate and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up YAML parser
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: yq
      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash .github/scripts/weekly-release.sh plan
  mise-lock-update:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/mise-lock-update.yml
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
  shell-lint:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    uses: $/.github/workflows/shell-lint.yml
    with:
      use-shfmt: true
  markdown-lint:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    uses: $/.github/workflows/markdown-lint.yml
  github-actions-lint-and-scan:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: $/.github/workflows/github-actions-lint-and-scan.yml
    with:
      search-path: .github/workflows
      zizmor-search-path: .github
      go-version: stable
      python-version: 3.x
      actions-lock-exclude-workflows: .github/workflows/python-package-release-on-pypi-and-github.yml
  bats-tests:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-slim
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: actionlint yq gomplate trivy
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Set up Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          github-token: ${{ github.token }}
      - name: Run Bats tests
        run: bats --print-output-on-failure .github/scripts/tests/*.bats
  publish:
    needs:
      - plan
      - shell-lint
      - markdown-lint
      - github-actions-lint-and-scan
      - bats-tests
      - mise-lock-update
    if: >-
      needs.plan.outputs.ready == 'true'
      && needs.shell-lint.result == 'success'
      && needs.markdown-lint.result == 'success'
      && needs.github-actions-lint-and-scan.result == 'success'
      && needs.bats-tests.result == 'success'
      && needs.mise-lock-update.result == 'success'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Check out validated release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish validated release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: bash .github/scripts/weekly-release.sh publish
  weekly-major-version-tag:
    needs: [plan, publish]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && (needs.publish.outputs.published == 'true' || needs.plan.outputs.sync-major == 'true')
    permissions:
      contents: write
    uses: $/.github/workflows/github-major-version-tag.yml
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
