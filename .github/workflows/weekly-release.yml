---
name: Weekly release
on:
  workflow_call:
concurrency:
  group: weekly-release-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  plan:
    runs-on: ubuntu-slim
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Check out the release candidate and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # Release only the main commit whose source is being validated by this run.
          : "${GITHUB_REPOSITORY:?}"
          : "${RELEASE_SHA:?}"
          if [[ "${GITHUB_REF:-}" != 'refs/heads/main' ]]; then
            echo '::error::Weekly releases must run on refs/heads/main.' >&2
            exit 1
          fi

          main_is_current() {
            local head_sha
            head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "${head_sha}" != "${RELEASE_SHA}" ]]; then
              echo '::notice::main advanced since this workflow started; skipping this release.'
              return 1
            fi
          }

          tag_is_absent() {
            local tag="$1"
            local remote
            if git show-ref --verify --quiet "refs/tags/${tag}"; then
              echo "::error::Tag ${tag} already exists locally." >&2
              return 1
            fi
            # An API error is fatal; an empty successful response means the tag is absent.
            remote="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" \
              --jq ".[] | select(.ref == \"refs/tags/${tag}\") | .ref")"
            if [[ -n "${remote}" ]]; then
              echo "::error::Tag ${tag} already exists remotely." >&2
              return 1
            fi
          }

          # Only workflow files with workflow_call are part of the release surface.
          # Inspect both revisions so removals of reusable workflows are included.
          is_reusable_workflow() {
            local ref="$1"
            local path="$2"
            git cat-file -e "${ref}:${path}" 2> /dev/null || return 1
            git show "${ref}:${path}" | awk '
              /^(on|"on"|\047on\047):[[:space:]]*(\[.*workflow_call|workflow_call)([[:space:],\]#]|$)/ { found=1; exit }
              /^(on|"on"|\047on\047):[[:space:]]*(#.*)?$/ { in_on=1; next }
              in_on && /^[^[:space:]#][^:]*:/ { in_on=0 }
              in_on && /^  workflow_call:[[:space:]]*/ { found=1; exit }
              END { exit(!found) }
            '
          }

          reusable_workflows_changed() {
            local path
            while IFS= read -r -d '' path; do
              [[ "${path}" =~ ^\.github/workflows/[^/]+\.ya?ml$ ]] || continue
              if is_reusable_workflow "${previous_tag}" "${path}" \
                || is_reusable_workflow "${RELEASE_SHA}" "${path}"; then
                return 0
              fi
            done < <(git diff --no-renames --name-only -z "${previous_tag}" "${RELEASE_SHA}" -- .github/workflows)
            return 1
          }

          if ! main_is_current; then
            exit 0
          fi

          previous_tag="$(gh release list --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
          if [[ ! "${previous_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Expected a latest stable SemVer release, got: ${previous_tag}" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if ! git merge-base --is-ancestor "${previous_tag}" "${RELEASE_SHA}"; then
            echo "::error::Release tag ${previous_tag} is not an ancestor of the release commit." >&2
            exit 1
          fi

          if ! reusable_workflows_changed; then
            echo '::notice::No changes to reusable workflows since the latest release.'
            exit 0
          fi

          messages="$(git log --first-parent --format=%B "${previous_tag}..${RELEASE_SHA}")"
          # Squash-merge bodies can prefix subjects with "* "; trailers can be indented.
          # Breaking changes intentionally use a minor bump for this workflow library.
          if grep -Eq '^[[:space:]]*(\*[[:space:]]*)?[[:alnum:]_-]+(\([^)]*\))?!:|^[[:space:]]*(\*[[:space:]]*)?BREAKING[ -]CHANGE:' <<< "${messages}" \
            || grep -Eq '^[[:space:]]*(\*[[:space:]]*)?feat(\([^)]*\))?:' <<< "${messages}"; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi
          tag="v${major}.${minor}.${patch}"
          tag_is_absent "${tag}"
          {
            echo 'ready=true'
            echo "tag=${tag}"
            echo "sha=${RELEASE_SHA}"
          } >> "${GITHUB_OUTPUT:?}"

  shell-lint:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    uses: $/.github/workflows/shell-lint.yml
    with:
      use-shfmt: true

  markdown-lint:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    uses: $/.github/workflows/markdown-lint.yml

  github-actions-lint-and-scan:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: $/.github/workflows/github-actions-lint-and-scan.yml
    with:
      search-path: .github/workflows
      zizmor-search-path: .github
      go-version: stable
      python-version: 3.x
      actions-lock-exclude-workflows: .github/workflows/python-package-release-on-pypi-and-github.yml

  bats-tests:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-slim
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          version: 2026.8.5
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Set up Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          github-token: ${{ github.token }}
      - name: Run tests when present
        run: |
          if compgen -G '.github/scripts/tests/*.bats' > /dev/null; then
            bats --print-output-on-failure .github/scripts/tests/*.bats
          else
            echo '::notice::Caller has no Bats test suite.'
          fi

  publish:
    needs:
      - plan
      - shell-lint
      - markdown-lint
      - github-actions-lint-and-scan
      - bats-tests
    if: >-
      needs.plan.outputs.ready == 'true'
      && needs.shell-lint.result == 'success'
      && needs.markdown-lint.result == 'success'
      && needs.github-actions-lint-and-scan.result == 'success'
      && needs.bats-tests.result == 'success'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Check out validated release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish validated release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # Release only the main commit whose source is being validated by this run.
          : "${GITHUB_REPOSITORY:?}"
          : "${RELEASE_SHA:?}"
          if [[ "${GITHUB_REF:-}" != 'refs/heads/main' ]]; then
            echo '::error::Weekly releases must run on refs/heads/main.' >&2
            exit 1
          fi

          main_is_current() {
            local head_sha
            head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "${head_sha}" != "${RELEASE_SHA}" ]]; then
              echo '::notice::main advanced since this workflow started; skipping this release.'
              return 1
            fi
          }

          tag_is_absent() {
            local tag="$1"
            local remote
            if git show-ref --verify --quiet "refs/tags/${tag}"; then
              echo "::error::Tag ${tag} already exists locally." >&2
              return 1
            fi
            # An API error is fatal; an empty successful response means the tag is absent.
            remote="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" \
              --jq ".[] | select(.ref == \"refs/tags/${tag}\") | .ref")"
            if [[ -n "${remote}" ]]; then
              echo "::error::Tag ${tag} already exists remotely." >&2
              return 1
            fi
          }

          : "${RELEASE_TAG:?}"
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if ! main_is_current; then
            exit 0
          fi
          tag_is_absent "${RELEASE_TAG}"
          # Creating the tag atomically first prevents --target from silently
          # publishing an existing tag that points to a different commit.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" --method POST \
            --field "ref=refs/tags/${RELEASE_TAG}" --field "sha=${RELEASE_SHA}" > /dev/null
          gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --verify-tag --title "${RELEASE_TAG}" --generate-notes
          echo 'published=true' >> "${GITHUB_OUTPUT:?}"

  weekly-major-version-tag:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: write
    uses: $/.github/workflows/github-major-version-tag.yml
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
