---
name: Renovate OSS (manual)
on:  # checkov:skip=CKV_GHA_7:manual mode selects read-only or write-capable Renovate
  workflow_dispatch:
    inputs:
      dry-run:
        description: Check updates without modifying the repository
        required: false
        type: boolean
        default: true
      renovate-version:
        description: Renovate image tag (latest or an explicit version)
        required: false
        type: string
        default: latest
permissions:
  contents: read
jobs:
  renovate-check:
    if: inputs.dry-run
    permissions:
      contents: read
    uses: $/.github/workflows/renovate.yml
    with:
      dry-run: true
      renovate-version: ${{ inputs.renovate-version }}
  renovate-update:
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    uses: $/.github/workflows/renovate.yml
    with:
      dry-run: false
      renovate-version: ${{ inputs.renovate-version }}
