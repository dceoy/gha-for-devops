---
name: Test for Bats
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for Bats test files
        default: .
      test-paths:
        required: false
        type: string
        description: Newline-separated Bats test file names or pathspecs passed to git ls-files
        default: |
          *.bats
      setup-run:
        required: false
        type: string
        description: Shell command to run after checkout, before installing Bats, to provision runtime dependencies the tests require
        default: ""
      enable-cache:
        required: false
        type: boolean
        description: Cache uv and pnpm downloads and Bats libraries
        default: true
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust uv and pnpm caches
        default: null
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
env:
  UV_EXCLUDE_NEWER: 7 days
  NPM_CONFIG_MIN_RELEASE_AGE: '1'
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: '10080'
jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run setup command
        if: inputs.setup-run != ''
        env:
          SETUP_RUN: ${{ inputs.setup-run }}
        run: |
          setup_script="$(mktemp)"
          printf '%s\n' "${SETUP_RUN}" > "${setup_script}"
          chmod +x "${setup_script}"
          "${setup_script}"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: latest
          enable-cache: ${{ inputs.enable-cache }}
          cache-suffix: ${{ inputs.cache-salt }}
      - name: Setup pnpm with Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024  # v3
        with:
          version: latest
          runtime: node@latest
          install: false
          cache: ${{ inputs.enable-cache && inputs.cache-salt == '' && hashFiles('**/pnpm-lock.yaml') != '' }}
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Setup Bats and Bats libraries
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          support-path: ${{ inputs.enable-cache && format('{0}/.cache/bats-support', github.workspace) || '' }}
          assert-path: ${{ inputs.enable-cache && format('{0}/.cache/bats-assert', github.workspace) || '' }}
          detik-path: ${{ inputs.enable-cache && format('{0}/.cache/bats-detik', github.workspace) || '' }}
          file-path: ${{ inputs.enable-cache && format('{0}/.cache/bats-file', github.workspace) || '' }}
      - name: Run Bats tests
        working-directory: ${{ inputs.search-path }}
        env:
          TEST_PATHS: ${{ inputs.test-paths }}
        run: |
          files=()
          while IFS= read -r f; do
            [[ -n "${f}" ]] && files+=("${f}")
          done <<< "${TEST_PATHS}"
          [[ ${#files[@]} -eq 0 ]] && { echo "::error::test-paths input produced no entries"; exit 1; }
          git ls-files -z -- "${files[@]}" | xargs -0 -r -t bats
