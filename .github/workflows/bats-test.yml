---
name: Test for Bats
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for Bats test files
        default: .
      test-paths:
        required: false
        type: string
        description: Newline-separated Bats test file names or pathspecs passed to git ls-files
        default: |
          *.bats
      setup-run:
        required: false
        type: string
        description: Shell command to run after checkout, before installing Bats, to provision runtime dependencies the tests require
        default: ""
      enable-cache:
        required: false
        type: boolean
        description: Cache uv and pnpm downloads and Bats libraries
        default: true
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust uv and pnpm caches
        default: null
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
env:
  UV_EXCLUDE_NEWER: 1 day
  NPM_CONFIG_MIN_RELEASE_AGE: '1'
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: '1440'
jobs:
  bats-test:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run setup command
        if: inputs.setup-run != ''
        env:
          SETUP_RUN: ${{ inputs.setup-run }}
        run: |
          setup_script="$(mktemp)"
          printf '%s\n' "${SETUP_RUN}" > "${setup_script}"
          chmod +x "${setup_script}"
          "${setup_script}"
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: latest
          enable-cache: ${{ inputs.enable-cache }}
          cache-suffix: ${{ inputs.cache-salt }}
      - name: Select Node.js version
        id: pnpm-config
        env:
          NODE_VERSION: latest
        run: |
          node_version=''
          if [[ -f package.json ]]; then
            node_version="$(jq -r '
              . as $manifest
              | (.devEngines.runtime // [])
              | if type == "array" then . else [.] end
              | map(select(.name == "node"))
              | if length > 1 then error("Multiple Node.js runtime declarations")
                elif length == 1 then
                  .[0].version | if type == "string" and length > 0 then .
                    else error("Node.js runtime.version must be a nonempty string") end
                else $manifest.engines.node // "" end
              | if type == "string" then . else error("engines.node must be a string") end
            ' package.json)"
          fi
          node_version="${node_version:-${NODE_VERSION}}"
          case "${node_version}" in
            node|stable|current|\*) node_version=latest ;;
            lts/\*) node_version=lts ;;
            lts/-*)
              offset="${node_version#lts/-}"
              if [[ ! "${offset}" =~ ^[0-9]+$ ]]; then
                echo "Invalid Node.js LTS offset: ${node_version}" >&2
                exit 1
              fi
              node_version="$(curl -fsSL https://nodejs.org/dist/index.json | jq -r --argjson offset "$((10#${offset}))" '[.[] | select(.lts) | .version | capture("^v(?<major>[0-9]+)\\.").major | tonumber] | unique | sort | reverse | .[$offset] // empty')"
              if [[ -z "${node_version}" ]]; then
                echo "Unable to resolve Node.js LTS selector: ${NODE_VERSION}" >&2
                exit 1
              fi
              ;;
            lts/*) node_version="${node_version#lts/}" ;;
          esac
          echo "node-version=${node_version}" >> "${GITHUB_OUTPUT}"
      - name: Setup pnpm with Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4  # v3.1.1
        with:
          version: latest
          runtime: node@${{ steps.pnpm-config.outputs.node-version }}
          working-directory: .
          install: false
          cache: ${{ inputs.enable-cache && inputs.cache-salt == '' && hashFiles('**/pnpm-lock.yaml') != '' }}
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Locate salted pnpm store
        id: pnpm-store
        if: inputs.enable-cache && inputs.cache-salt != ''
        run: |
          {
            echo "path=$(pnpm store path --silent)"
            echo "version=$(pnpm --version)"
            echo "node-version=$(node --version)"
          } >> "${GITHUB_OUTPUT}"
      - name: Cache salted pnpm store
        if: inputs.enable-cache && inputs.cache-salt != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-store.outputs.version }}-${{ steps.pnpm-store.outputs.node-version }}-${{ inputs.cache-salt }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-store.outputs.version }}-${{ steps.pnpm-store.outputs.node-version }}-${{ inputs.cache-salt }}-
      - name: Setup Bats and Bats libraries
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          support-path: ${{ inputs.enable-cache && format('{0}/.cache/bats-support', github.workspace) || '' }}
          assert-path: ${{ inputs.enable-cache && format('{0}/.cache/bats-assert', github.workspace) || '' }}
          detik-path: ${{ inputs.enable-cache && format('{0}/.cache/bats-detik', github.workspace) || '' }}
          file-path: ${{ inputs.enable-cache && format('{0}/.cache/bats-file', github.workspace) || '' }}
      - name: Run Bats tests
        working-directory: ${{ inputs.search-path }}
        env:
          TEST_PATHS: ${{ inputs.test-paths }}
        run: |
          files=()
          while IFS= read -r f; do
            [[ -n "${f}" ]] && files+=("${f}")
          done <<< "${TEST_PATHS}"
          [[ ${#files[@]} -eq 0 ]] && { echo "::error::test-paths input produced no entries"; exit 1; }
          git ls-files -z -- "${files[@]}" | xargs -0 -r -t bats
