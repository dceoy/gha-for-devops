---
name: Test for Bats
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for Bats test files
        default: .
      test-paths:
        required: false
        type: string
        description: Newline-separated Bats test file names or pathspecs passed to git ls-files
        default: |
          *.bats
      setup-run:
        required: false
        type: string
        description: Shell command to run after checkout, before installing Bats, to provision runtime dependencies the tests require
        default: ""
      enable-cache:
        required: false
        type: boolean
        description: Cache uv and pnpm downloads and Bats libraries
        default: true
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust uv and pnpm caches
        default: null
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
env:
  UV_EXCLUDE_NEWER: 7 days
  NPM_CONFIG_MIN_RELEASE_AGE: '1'
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: '10080'
jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run setup command
        if: inputs.setup-run != ''
        env:
          SETUP_RUN: ${{ inputs.setup-run }}
        run: |
          setup_script="$(mktemp)"
          printf '%s\n' "${SETUP_RUN}" > "${setup_script}"
          chmod +x "${setup_script}"
          "${setup_script}"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: latest
          enable-cache: ${{ inputs.enable-cache }}
          cache-suffix: ${{ inputs.cache-salt }}
      - name: Bootstrap Node.js on Intel macOS
        if: runner.os == 'macOS' && runner.arch == 'X64'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: latest
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: latest
          package_json_file: package.json
          standalone: ${{ runner.os != 'macOS' || runner.arch != 'X64' }}
      - name: Resolve pnpm runtime version and paths
        id: pnpm-cache
        env:
          NODE_VERSION: latest
        run: |
          pnpm_version="$(pnpm --version)"
          pnpm_major="${pnpm_version%%.*}"
          store_path="$(pnpm store path --silent)"
          node_version="${NODE_VERSION}"
          # The project manifest takes precedence over the workflow fallback.
          if [[ -f package.json ]]; then
            manifest_version="$(jq -r '
              . as $manifest
              | (.devEngines.runtime // [])
              | if type == "array" then . else [.] end
              | map(select(.name == "node"))
              | if length > 1 then error("Multiple Node.js runtime declarations")
                elif length == 1 then
                  .[0].version | if type == "string" and length > 0 then .
                    else error("Node.js runtime.version must be a nonempty string") end
                else $manifest.engines.node // "" end
              | if type == "string" then . else error("engines.node must be a string") end
            ' package.json)"
            node_version="${manifest_version:-${NODE_VERSION}}"
          fi
          case "${node_version}" in
            latest|current|node|stable|\*) node_version=latest ;;
            lts/*)
              node_version="${node_version#lts/}"
              case "${node_version}" in
                '*') node_version=lts ;;
                -*)
                  offset="${node_version#-}"
                  if [[ ! "${offset}" =~ ^[0-9]+$ ]]; then
                    echo "Invalid Node.js LTS offset: ${NODE_VERSION}" >&2
                    exit 1
                  fi
                  node_version="$(curl -fsSL https://nodejs.org/dist/index.json | jq -r --argjson offset "${offset}" '[.[] | select(.lts) | .version | capture("^v(?<major>[0-9]+)\\.").major | tonumber] | unique | sort | reverse | .[$offset] // empty')"
                  if [[ -z "${node_version}" ]]; then
                    echo "Unable to resolve Node.js LTS selector: ${NODE_VERSION}" >&2
                    exit 1
                  fi
                  ;;
                *) ;;
              esac
              ;;
          esac
          if [[ -n "${node_version}" ]]; then
            node_version="${node_version#v}"
            if [[ ! "${node_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              node_version="$(pnpm env list --remote "${node_version}" | tail -n 1)"
            fi
            if [[ ! "${node_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "Unable to resolve Node.js version selector: ${NODE_VERSION}" >&2
              exit 1
            fi
          fi
          node_path=''
          if (( pnpm_major < 11 )) && [[ -n "${node_version}" ]] && [[ "${RUNNER_OS}-${RUNNER_ARCH}" != macOS-X64 ]]; then
            if [[ -z "${PNPM_HOME:-}" ]]; then
              echo 'PNPM_HOME was not set by pnpm/action-setup.' >&2
              exit 1
            fi
            pnpm_home="$(cd "${PNPM_HOME}" && pwd -P)"
            node_path="${pnpm_home}/nodejs/${node_version}"
          fi
          {
            echo "pnpm-version=${pnpm_version}"
            echo "pnpm-major=${pnpm_major}"
            echo "store-path=${store_path}"
            echo "node-version=${node_version}"
            echo "node-path=${node_path}"
          } >> "${GITHUB_OUTPUT}"
      - name: Cache pnpm store
        if: inputs.enable-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store-path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-cache.outputs.pnpm-version }}-${{ inputs.cache-salt }}-${{ steps.pnpm-cache.outputs.node-version || 'none' }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-cache.outputs.pnpm-version }}-${{ inputs.cache-salt }}-${{ steps.pnpm-cache.outputs.node-version || 'none' }}-
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-cache.outputs.pnpm-version }}-${{ inputs.cache-salt }}-
      - name: Cache pnpm-managed Node.js
        if: inputs.enable-cache && steps.pnpm-cache.outputs.node-path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.node-path }}
          key: pnpm-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-cache.outputs.pnpm-version }}-${{ inputs.cache-salt }}-${{ steps.pnpm-cache.outputs.node-version }}
      # Use tools bundled with this exact Node.js version, not current npm/Corepack.
      # This also provides the runtime on Intel macOS, which cannot use standalone pnpm.
      - name: Preserve compatible Node.js bundled tools
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ steps.pnpm-cache.outputs.node-version }}
      - name: Setup Node.js with pnpm
        env:
          NODE_VERSION: ${{ steps.pnpm-cache.outputs.node-version }}
          PNPM_MAJOR: ${{ steps.pnpm-cache.outputs.pnpm-major }}
          PNPM_STORE_PATH: ${{ steps.pnpm-cache.outputs.store-path }}
        run: |
          if [[ -n "${NODE_VERSION}" && "${RUNNER_OS}-${RUNNER_ARCH}" != macOS-X64 ]]; then
            if (( PNPM_MAJOR >= 11 )); then
              pnpm_config_store_dir="${PNPM_STORE_PATH}" pnpm runtime set node "${NODE_VERSION}" --global
            else
              pnpm env use --global "${NODE_VERSION}"
            fi
          fi
          export PNPM_CONFIG_GLOBAL_SHIMS='{"node":false}'
          echo 'PNPM_CONFIG_GLOBAL_SHIMS={"node":false}' >> "${GITHUB_ENV}"
          if [[ "${RUNNER_OS}-${RUNNER_ARCH}" != macOS-X64 ]]; then
            pnpm_bin="$(pnpm bin --global)"
            export PATH="${pnpm_bin}:${PATH}"
            echo "${pnpm_bin}" >> "${GITHUB_PATH}"
          fi
          node --version
      - name: Setup Bats and Bats libraries
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          support-path: ${{ inputs.enable-cache && format('{0}/.cache/bats-support', github.workspace) || '' }}
          assert-path: ${{ inputs.enable-cache && format('{0}/.cache/bats-assert', github.workspace) || '' }}
          detik-path: ${{ inputs.enable-cache && format('{0}/.cache/bats-detik', github.workspace) || '' }}
          file-path: ${{ inputs.enable-cache && format('{0}/.cache/bats-file', github.workspace) || '' }}
      - name: Run Bats tests
        working-directory: ${{ inputs.search-path }}
        env:
          TEST_PATHS: ${{ inputs.test-paths }}
        run: |
          files=()
          while IFS= read -r f; do
            [[ -n "${f}" ]] && files+=("${f}")
          done <<< "${TEST_PATHS}"
          [[ ${#files[@]} -eq 0 ]] && { echo "::error::test-paths input produced no entries"; exit 1; }
          git ls-files -z -- "${files[@]}" | xargs -0 -r -t bats
