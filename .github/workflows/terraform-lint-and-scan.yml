---
name: Lint and security scan for Terraform
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for files
        default: .
      terraform-version:
        required: false
        type: string
        description: Terraform version to use
        default: latest
      terragrunt-version:
        required: false
        type: string
        description: Terragrunt version to use
        default: null
      terraform-validate:
        required: false
        type: boolean
        description: Validate Terraform code
        default: true
      terraform-lockfile-readonly:
        required: false
        type: boolean
        description: Require Terraform init to leave provider lockfiles unchanged
        default: false
      use-tflint:
        required: false
        type: boolean
        description: Use TFLint linter
        default: true
      use-trivy:
        required: false
        type: boolean
        description: Use Trivy vulnerability scanner
        default: true
      submit-dependencies:
        required: false
        type: boolean
        default: false
        description: Publish dependency snapshots from the existing Trivy scan on trusted default-branch events
      snapshot-correlator:
        required: false
        type: string
        default: source-root
      trivy-scanners:
        required: false
        type: string
        description: List of scanners to use
        default: vuln,secret,misconfig
      trivy-severity:
        required: false
        type: string
        description: Severity levels to fail the scan
        default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      trivy-ignore-unfixed:
        required: false
        type: boolean
        description: Ignore unpatched/unfixed vulnerabilities
        default: true
      trivy-exit-code:
        required: false
        type: number
        description: Exit code for pre-build scan
        default: 1
      trivy-config:
        required: false
        type: string
        description: Path to a Trivy config file
        default: null
      trivy-timeout:
        required: false
        type: string
        description: Timeout for the Trivy scan
        default: 5m0s
      trivy-report-artifact-name:
        required: false
        type: string
        description: Unique name for the Trivy report artifact; omit to skip the report upload
        default: null
      use-checkov:
        required: false
        type: boolean
        description: Use Checkov to scan Terraform files
        default: true
      checkov-framework:
        required: false
        type: string
        description: Checkov frameworks to scan
        default: terraform
      checkov-skip-framework:
        required: false
        type: string
        description: Checkov frameworks to skip
        default: null
      checkov-check:
        required: false
        type: string
        description: Checkov checks to include
        default: null
      checkov-skip-check:
        required: false
        type: string
        description: Checkov checks to skip
        default: null
      checkov-config-file:
        required: false
        type: string
        description: Path to a Checkov config file
        default: null
      checkov-output-format:
        required: false
        type: string
        description: Checkov output formats
        default: github_failed_only
      checkov-output-file-path:
        required: false
        type: string
        description: Checkov output file path(s)
        default: null
      checkov-soft-fail:
        required: false
        type: boolean
        description: Always return exit code 0 from Checkov
        default: false
      semgrep-exclude-cooldown-rules:
        type: boolean
        default: false
        description: Exclude Semgrep p/default dependency cooldown and minimum release age rules
      use-semgrep:
        required: false
        type: boolean
        description: Run Semgrep OSS SAST scan using p/default rules
        default: true
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
      security-runs-on:
        required: false
        type: string
        description: Runner for Docker-free source security scans (Trivy and Semgrep)
        default: ubuntu-slim
    secrets:
      GH_TOKEN:
        required: false
        description: Deprecated and unused; retained for caller compatibility
      BC_API_KEY:
        required: false
        description: Bridgecrew or Prisma Cloud API key
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
env:
  CHECKPOINT_DISABLE: '1'
permissions:
  contents: read
jobs:
  terraform-security-scan:
    permissions:
      contents: read
    if: inputs.use-semgrep || inputs.use-trivy || inputs.use-checkov
    uses: $/.github/workflows/source-security-scan.yml
    with:
      runs-on: ${{ inputs.security-runs-on }}
      use-osv-scanner: false
      use-semgrep: ${{ inputs.use-semgrep }}
      semgrep-exclude-cooldown-rules: ${{ inputs.semgrep-exclude-cooldown-rules }}
      package-path: ${{ inputs.search-path }}
      submit-dependencies: ${{ inputs.submit-dependencies }}
      snapshot-correlator: ${{ inputs.snapshot-correlator }}
      use-trivy: ${{ inputs.use-trivy }}
      trivy-scanners: ${{ inputs.trivy-scanners }}
      trivy-severity: ${{ inputs.trivy-severity }}
      trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      trivy-config: ${{ inputs.trivy-config }}
      trivy-exit-code: ${{ inputs.trivy-exit-code }}
      trivy-timeout: ${{ inputs.trivy-timeout }}
      trivy-report-artifact-name: ${{ inputs.trivy-report-artifact-name }}
      use-checkov: ${{ inputs.use-checkov }}
      checkov-framework: ${{ inputs.checkov-framework }}
      checkov-skip-framework: ${{ inputs.checkov-skip-framework }}
      checkov-check: ${{ inputs.checkov-check }}
      checkov-skip-check: ${{ inputs.checkov-skip-check }}
      checkov-config-file: ${{ inputs.checkov-config-file }}
      checkov-output-format: ${{ inputs.checkov-output-format }}
      checkov-output-file-path: ${{ inputs.checkov-output-file-path }}
      checkov-soft-fail: ${{ inputs.checkov-soft-fail }}
      semgrep-working-directory: ${{ inputs.search-path }}
      semgrep-includes: |
        *.tf
        *.hcl
    secrets:
      BC_API_KEY: ${{ secrets.BC_API_KEY }}
  terraform-lint-and-scan:
    permissions:
      contents: read
    runs-on: ${{ inputs.runs-on }}
    env:
      UV_EXCLUDE_NEWER: 1 day
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure Terraform plugin cache directory
        run: |
          mkdir -p "${RUNNER_TEMP}/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=${RUNNER_TEMP}/terraform-plugin-cache" >> "${GITHUB_ENV}"
      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-provider-cache-${{ runner.os }}-${{ inputs.terraform-version }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-provider-cache-${{ runner.os }}-${{ inputs.terraform-version }}-
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        with:
          tflint_version: latest
      - name: Install Terragrunt
        if: inputs.terragrunt-version != null
        uses: dceoy/setup-terragrunt@1cbef4029fa29d03260e3572cd1df1d45fd3f290  # v2.0.0
        with:
          terragrunt-version: ${{ inputs.terragrunt-version }}
      - name: Lint the code using terraform fmt
        working-directory: ${{ inputs.search-path }}
        run: |
          terraform fmt -recursive -check .
      - name: Check terragrunt HCL
        if: inputs.terragrunt-version != null
        working-directory: ${{ inputs.search-path }}
        run: >
          terragrunt hcl format --check --diff
      - name: Lint the code using tflint
        if: inputs.use-tflint
        working-directory: ${{ inputs.search-path }}
        run: |
          tflint --recursive --chdir=.
      - name: Validate the code using terraform validate
        if: inputs.terraform-validate
        working-directory: ${{ inputs.search-path }}
        env:
          LOCKFILE_READONLY: ${{ inputs.terraform-lockfile-readonly }}
        run: |
          if [[ "${LOCKFILE_READONLY}" == true ]]; then
            export TF_CLI_ARGS_init=-lockfile=readonly
          fi
          git ls-files -z -- '*.tf' \
            | xargs -0 dirname \
            | sort -u \
            | xargs -I{} -t bash -c \
              'cd "$1" && terraform init -backend=false && terraform validate' _ '{}'
