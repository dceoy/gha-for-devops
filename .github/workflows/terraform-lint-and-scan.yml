---
name: Lint and security scan for Terraform
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for files
        default: .
      terraform-version:
        required: false
        type: string
        description: Terraform version to use
        default: latest
      terragrunt-version:
        required: false
        type: string
        description: Terragrunt version to use
        default: null
      terraform-validate:
        required: false
        type: boolean
        description: Validate Terraform code
        default: true
      use-tflint:
        required: false
        type: boolean
        description: Use TFLint linter
        default: true
      use-trivy:
        required: false
        type: boolean
        description: Use Trivy vulnerability scanner
        default: true
      trivy-scanners:
        required: false
        type: string
        description: List of scanners to use
        default: vuln,secret,misconfig
      trivy-severity:
        required: false
        type: string
        description: Severity levels to fail the scan
        default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      trivy-ignore-unfixed:
        required: false
        type: boolean
        description: Ignore unpatched/unfixed vulnerabilities
        default: true
      trivy-exit-code:
        required: false
        type: number
        description: Exit code for pre-build scan
        default: 1
      trivy-config:
        required: false
        type: string
        description: Path to a Trivy config file
        default: null
      trivy-timeout:
        required: false
        type: string
        description: Timeout for the Trivy scan
        default: 5m0s
      trivy-report-artifact-name:
        required: false
        type: string
        description: Unique name for the Trivy report artifact; omit to skip the report upload
        default: null
      use-checkov:
        required: false
        type: boolean
        description: Use Checkov to scan Terraform files
        default: true
      checkov-framework:
        required: false
        type: string
        description: Checkov frameworks to scan
        default: terraform
      checkov-skip-framework:
        required: false
        type: string
        description: Checkov frameworks to skip
        default: null
      checkov-check:
        required: false
        type: string
        description: Checkov checks to include
        default: null
      checkov-skip-check:
        required: false
        type: string
        description: Checkov checks to skip
        default: null
      checkov-config-file:
        required: false
        type: string
        description: Path to a Checkov config file
        default: null
      checkov-output-format:
        required: false
        type: string
        description: Checkov output formats
        default: github_failed_only
      checkov-output-file-path:
        required: false
        type: string
        description: Checkov output file path(s)
        default: null
      checkov-soft-fail:
        required: false
        type: boolean
        description: Always return exit code 0 from Checkov
        default: false
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
    secrets:
      GH_TOKEN:
        required: false
        description: GitHub token
      BC_API_KEY:
        required: false
        description: Bridgecrew or Prisma Cloud API key
permissions:
  contents: write
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  lint-and-scan:
    runs-on: ${{ inputs.runs-on }}
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure Terraform plugin cache directory
        run: |
          mkdir -p "${RUNNER_TEMP}/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=${RUNNER_TEMP}/terraform-plugin-cache" >> "${GITHUB_ENV}"
      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-provider-cache-${{ runner.os }}-${{ inputs.terraform-version }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-provider-cache-${{ runner.os }}-${{ inputs.terraform-version }}-
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a  # v6.3.0
        with:
          tflint_version: latest
      - name: Install Terragrunt
        if: inputs.terragrunt-version != null
        uses: dceoy/setup-terragrunt@1cbef4029fa29d03260e3572cd1df1d45fd3f290  # v2.0.0
        with:
          terragrunt-version: ${{ inputs.terragrunt-version }}
      - name: Lint the code using terraform fmt
        working-directory: ${{ inputs.search-path }}
        run: |
          terraform fmt -recursive -check .
      - name: Check terragrunt HCL
        if: inputs.terragrunt-version != null
        working-directory: ${{ inputs.search-path }}
        run: >
          terragrunt hcl format --check --diff
      - name: Lint the code using tflint
        if: inputs.use-tflint
        working-directory: ${{ inputs.search-path }}
        run: |
          tflint --recursive --chdir=.
      - name: Validate the code using terraform validate
        if: inputs.terraform-validate
        working-directory: ${{ inputs.search-path }}
        run: |
          git ls-files -z -- '*.tf' \
            | xargs -0 dirname \
            | sort -u \
            | xargs -I{} -t bash -c \
              'cd {} && terraform init -backend=false && terraform validate'
      - name: Run Trivy in GitHub SBOM mode and submit results to Dependency Graph
        if: inputs.use-trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: filesystem
          scan-ref: ${{ inputs.search-path }}
          scanners: ${{ inputs.trivy-scanners }}
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          exit-code: 0
          trivy-config: ${{ inputs.trivy-config }}
          timeout: ${{ inputs.trivy-timeout }}
          format: github
          output: dependency-results.sbom.json
          github-pat: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
      - name: Run Trivy and generate a readable report
        if: inputs.use-trivy
        id: trivy-report
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: filesystem
          scan-ref: ${{ inputs.search-path }}
          scanners: ${{ inputs.trivy-scanners }}
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          exit-code: ${{ inputs.trivy-exit-code }}
          trivy-config: ${{ inputs.trivy-config }}
          timeout: ${{ inputs.trivy-timeout }}
          format: table
          output: trivy-results.txt
          skip-setup-trivy: true
        env:
          TRIVY_FORMAT: table
      - name: Upload complete Trivy report
        if: always() && inputs.use-trivy && inputs.trivy-report-artifact-name != null
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.trivy-report-artifact-name }}
          path: trivy-results.txt
          if-no-files-found: ignore
      - name: Add Trivy results to job summary
        if: always() && inputs.use-trivy
        env:
          TRIVY_SCAN_REF: ${{ inputs.search-path }}
          TRIVY_REPORT_ARTIFACT_NAME: ${{ inputs.trivy-report-artifact-name }}
        run: |
          {
            echo "## Trivy Terraform scan"
            echo
            echo "**Target:** \`${TRIVY_SCAN_REF}\`"
            echo
            echo "<details open>"
            echo "<summary>Scan results</summary>"
            echo
            echo '```text'
            if [[ -s trivy-results.txt ]]; then
              head -c 900000 trivy-results.txt
              if [[ $(wc -c < trivy-results.txt) -gt 900000 ]]; then
                echo
                if [[ -n "${TRIVY_REPORT_ARTIFACT_NAME}" ]]; then
                  echo "[Report truncated; download the complete report artifact.]"
                else
                  echo "[Report truncated; set trivy-report-artifact-name to upload the complete report.]"
                fi
              fi
            else
              echo "Trivy did not generate a report."
            fi
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Enforce Trivy scan result
        if: inputs.use-trivy && steps.trivy-report.outcome == 'failure'
        run: exit 1
      - name: Run Checkov
        if: inputs.use-checkov
        uses: bridgecrewio/checkov-action@3be6be7935e32c4c683b1d40622aa43a7c8bbcaa  # v12.3118.0
        with:
          directory: ${{ inputs.search-path }}
          framework: ${{ inputs.checkov-framework }}
          skip_framework: ${{ inputs.checkov-skip-framework }}
          check: ${{ inputs.checkov-check }}
          skip_check: ${{ inputs.checkov-skip-check }}
          config_file: ${{ inputs.checkov-config-file }}
          output_format: ${{ inputs.checkov-output-format }}
          output_file_path: ${{ inputs.checkov-output-file-path }}
          soft_fail: ${{ inputs.checkov-soft-fail }}
          api-key: ${{ secrets.BC_API_KEY }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
