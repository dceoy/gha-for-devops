---
name: Switcher to apply or destroy AWS resources using Terragrunt
on:
  workflow_call:
    inputs:
      terragrunt-target-ec2-directory:
        required: false
        type: string
        description: Terragrunt directory for the target EC2 instances to start or stop
        default: null
      terragrunt-target-resource-directories:
        required: false
        type: string
        description: Terragrunt directories for the target resources to apply or destroy
        default: vpce
      aws-iam-role-to-assume:
        required: false
        type: string
        description: IAM role ARN to assume; required for PR runs using profile ROLE_ARN. Restrict OIDC trust to trusted refs/environments
        default: null
      aws-region:
        required: false
        type: string
        description: AWS region (explicit input, then profile REGION, then us-east-1)
        default: null
      aws-profile-env-file:
        required: false
        type: string
        description: KEY=VALUE profile (ROLE_ARN, REGION); PRs require explicit role input; IAM OIDC trust policy remains authoritative
        default: null
      terragrunt-working-directory:
        required: false
        type: string
        description: Working directory for Terragrunt
        default: .
      start:
        required: false
        type: boolean
        description: Start AWS resources
        default: true
      terminate:
        required: false
        type: boolean
        description: Terminate EC2 instances
        default: false
      terraform-version:
        required: false
        type: string
        description: Terraform version to use
        default: latest
      terragrunt-version:
        required: false
        type: string
        description: Terragrunt version to use
        default: latest
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-slim
      timeout-minutes:
        required: false
        type: number
        description: Timeout in minutes for the job
        default: 360
permissions:
  contents: read    # This is required for actions/checkout
  id-token: write   # This is required for requesting the JWT
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  start-or-stop:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TG_NON_INTERACTIVE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure Terraform plugin cache directory
        run: |
          mkdir -p "${RUNNER_TEMP}/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=${RUNNER_TEMP}/terraform-plugin-cache" >> "${GITHUB_ENV}"
      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-provider-cache-${{ runner.os }}-${{ inputs.terraform-version }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-provider-cache-${{ runner.os }}-${{ inputs.terraform-version }}-
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: Install Terragrunt
        uses: dceoy/setup-terragrunt@1cbef4029fa29d03260e3572cd1df1d45fd3f290  # v2.0.0
        with:
          terragrunt-version: ${{ inputs.terragrunt-version }}
      - name: Read AWS profile environment file
        if: inputs.aws-profile-env-file != null
        id: aws-profile-env
        env:
          AWS_PROFILE_ENV_FILE: ${{ inputs.aws-profile-env-file }}
          AWS_IAM_ROLE_INPUT: ${{ inputs.aws-iam-role-to-assume }}
        run: |
          declare -A seen=()
          while IFS= read -r line || [[ -n "${line}" ]]; do
            line="${line%$'\r'}"
            [[ -z "${line}" || "${line}" == \#* ]] && continue
            if [[ "${line}" != *=* ]]; then
              echo "::error::Invalid AWS profile entry (expected KEY=VALUE)" >&2
              exit 1
            fi
            key="${line%%=*}"
            value="${line#*=}"
            case "${key}" in
              ROLE_ARN)
                if [[ "${GITHUB_EVENT_NAME:-}" == pull_request || "${GITHUB_EVENT_NAME:-}" == pull_request_target ]] \
                  && [[ -z "${AWS_IAM_ROLE_INPUT:-}" ]]; then
                  echo "::error::PR-triggered workflows must use an explicit aws-iam-role-to-assume instead of a profile ROLE_ARN" >&2
                  exit 1
                fi
                if [[ ! "${value}" =~ ^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
                  echo "::error::Invalid ROLE_ARN in AWS profile file" >&2
                  exit 1
                fi
                ;;
              REGION)
                if [[ ! "${value}" =~ ^[a-z]{2}(-[a-z0-9]+)+-[0-9]+$ ]]; then
                  echo "::error::Invalid REGION in AWS profile file" >&2
                  exit 1
                fi
                ;;
              *) continue ;;
            esac
            if [[ -n "${seen[${key}]+x}" ]]; then
              echo "::error::Duplicate ${key} in AWS profile file" >&2
              exit 1
            fi
            seen["${key}"]=1
            printf '%s=%s\n' "${key}" "${value}" >> "${GITHUB_OUTPUT}"
          done < "${AWS_PROFILE_ENV_FILE}"
      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ inputs.aws-iam-role-to-assume || steps.aws-profile-env.outputs.ROLE_ARN || null }}
          aws-region: ${{ inputs.aws-region || steps.aws-profile-env.outputs.REGION || 'us-east-1' }}
          role-session-name: github-actions-${{ github.run_id }}
          output-credentials: true
          output-env-credentials: false
      - name: Prepare working directories for Terraform
        working-directory: ${{ inputs.terragrunt-working-directory }}
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region || steps.aws-profile-env.outputs.REGION || 'us-east-1' }}
        run: |
          terragrunt run --all -- init
      - name: Start or stop EC2 instances
        if: inputs.terragrunt-target-ec2-directory != null
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region || steps.aws-profile-env.outputs.REGION || 'us-east-1' }}
          TERRAGRUNT_TARGET_EC2_DIRECTORY: ${{ inputs.terragrunt-target-ec2-directory }}
          START: ${{ inputs.start }}
          TERMINATE: ${{ inputs.terminate }}
        run: |
          if [[ "${START}" != "true" ]] && [[ "${TERMINATE}" == "true" ]]; then
            terragrunt destroy --working-dir="${TERRAGRUNT_TARGET_EC2_DIRECTORY}" -auto-approve
          else
            if [[ "${START}" == "true" ]]; then
              AWS_EC2_COMMAND=start-instances
            else
              AWS_EC2_COMMAND=stop-instances
            fi
            ec2_instance_ids_txt="$(mktemp)"
            {
              terragrunt output --working-dir="${TERRAGRUNT_TARGET_EC2_DIRECTORY}" \
                | grep -e '_ec2_instance_id = ' \
                | grep -oe 'i-[0-9a-z]\+' \
                || :
            } | tee "${ec2_instance_ids_txt}"
            if [[ -s "${ec2_instance_ids_txt}" ]]; then
              xargs -t aws ec2 "${AWS_EC2_COMMAND}" --instance-ids < "${ec2_instance_ids_txt}"
            elif [[ "${START}" == "true" ]]; then
              terragrunt apply --working-dir="${TERRAGRUNT_TARGET_EC2_DIRECTORY}" -auto-approve
            fi
          fi
      - name: Create or destroy target resources
        if: inputs.terragrunt-target-resource-directories != null
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region || steps.aws-profile-env.outputs.REGION || 'us-east-1' }}
          START: ${{ inputs.start }}
          TERRAGRUNT_TARGET_RESOURCE_DIRECTORIES: ${{ inputs.terragrunt-target-resource-directories }}
        run: |
          if [[ "${START}" == "true" ]]; then
            TERRAGRUNT_COMMAND=apply
          else
            TERRAGRUNT_COMMAND=destroy
          fi
          xargs -I{} -t terragrunt "${TERRAGRUNT_COMMAND}" --working-dir='{}' -auto-approve <<< "${TERRAGRUNT_TARGET_RESOURCE_DIRECTORIES}"
