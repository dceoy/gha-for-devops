---
name: Lint for Markdown
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for Markdown files
        default: .
      file-names:
        required: false
        type: string
        description: Newline-separated file names or pathspecs passed to git ls-files for Oxfmt and Biome
        default: |
          *.md
          *.markdown
          *.mdx
      markdownlint-file-names:
        required: false
        type: string
        description: Newline-separated file names or pathspecs passed to git ls-files for markdownlint-cli2
        default: |
          *.md
          *.markdown
      use-markdownlint-cli2:
        required: false
        type: boolean
        description: Use markdownlint-cli2 to lint Markdown files
        default: true
      markdownlint-config-data:
        required: false
        type: string
        description: JSON data for the markdownlint-cli2 base configuration
        default: '{"config":{"MD013":false,"MD033":false,"MD041":false}}'
      use-oxfmt:
        required: false
        type: boolean
        description: Use Oxfmt to check Markdown formatting
        default: true
      use-biome:
        required: false
        type: boolean
        description: Use Biome to check Markdown formatting when supported
        default: false
      node-version:
        required: false
        type: string
        description: Node.js version to use
        default: latest
      enable-cache:
        required: false
        type: boolean
        description: Cache pnpm downloads for Markdown lint tools
        default: true
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust the Markdown lint cache
        default: null
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  markdown-lint:
    runs-on: ${{ inputs.runs-on }}
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: '1440'
      # renovate: datasource=npm depName=markdownlint-cli2
      MARKDOWNLINT_CLI2_VERSION: 0.23.2
      # renovate: datasource=npm depName=oxfmt
      OXFMT_VERSION: 0.72.0
      # renovate: datasource=npm depName=@biomejs/biome
      BIOME_VERSION: 2.5.6
    steps:
      - name: Validate linter inputs
        if: (! inputs.use-markdownlint-cli2) && (! inputs.use-oxfmt) && (! inputs.use-biome)
        run: |
          echo '::error::At least one of use-markdownlint-cli2, use-oxfmt, or use-biome must be true'
          exit 1
      - name: Reject conflicting formatters
        if: inputs.use-oxfmt && inputs.use-biome
        run: |
          echo '::error::Enable only one Markdown formatter: Oxfmt or Biome.'
          exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup pnpm-managed Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e  # v3.1.2
        with:
          version: 12
          runtime: node@${{ inputs.node-version }}
          install: false
      - name: Locate pnpm store
        if: inputs.enable-cache
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Cache pnpm downloads
        if: inputs.enable-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: markdown-lint-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ env.MARKDOWNLINT_CLI2_VERSION }}-${{ env.OXFMT_VERSION }}-${{ env.BIOME_VERSION }}-${{ inputs.cache-salt }}
      - name: Create Markdown lint configuration
        if: inputs.use-markdownlint-cli2
        env:
          MARKDOWNLINT_CONFIG_DATA: ${{ inputs.markdownlint-config-data }}
        run: |
          config_file="${RUNNER_TEMP}/workflow.markdownlint-cli2.jsonc"
          jq -e . <<< "${MARKDOWNLINT_CONFIG_DATA}" > "${config_file}"
          echo "MARKDOWNLINT_CONFIG_FILE=${config_file}" >> "${GITHUB_ENV}"
      - name: Create Markdown file list
        if: inputs.use-oxfmt || inputs.use-biome
        working-directory: ${{ inputs.search-path }}
        env:
          FILE_NAMES: ${{ inputs.file-names }}
        run: |
          patterns=()
          while IFS= read -r pattern; do
            [[ -n "${pattern}" ]] && patterns+=("${pattern}")
          done <<< "${FILE_NAMES}"
          [[ ${#patterns[@]} -eq 0 ]] && { echo "::error::file-names input produced no entries"; exit 1; }
          while IFS= read -r -d '' file; do
            [[ -L "${file}" ]] || printf '%s\0' "${file}"
          done < <(git ls-files -z -- "${patterns[@]}") > "${RUNNER_TEMP}/markdown-files"
      - name: Create markdownlint-cli2 file list
        if: inputs.use-markdownlint-cli2
        working-directory: ${{ inputs.search-path }}
        env:
          FILE_NAMES: ${{ inputs.markdownlint-file-names }}
        run: |
          patterns=()
          while IFS= read -r pattern; do
            [[ -n "${pattern}" ]] && patterns+=("${pattern}")
          done <<< "${FILE_NAMES}"
          [[ ${#patterns[@]} -eq 0 ]] && { echo "::error::markdownlint-file-names input produced no entries"; exit 1; }
          while IFS= read -r -d '' file; do
            [[ -L "${file}" ]] || printf '%s\0' "${file}"
          done < <(git ls-files -z -- "${patterns[@]}") > "${RUNNER_TEMP}/markdownlint-files"
      - name: Execute markdownlint-cli2
        if: inputs.use-markdownlint-cli2
        working-directory: ${{ inputs.search-path }}
        run: >  # zizmor: ignore[adhoc-packages] runs pinned markdownlint-cli2 through pnpm dlx
          xargs -0 -r -t pnpm dlx "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}" --config "${MARKDOWNLINT_CONFIG_FILE}" -- < "${RUNNER_TEMP}/markdownlint-files"
      - name: Check Markdown formatting with Oxfmt
        if: inputs.use-oxfmt
        working-directory: ${{ inputs.search-path }}
        run: >  # zizmor: ignore[adhoc-packages] runs pinned Oxfmt through pnpm dlx
          xargs -0 -r -t pnpm dlx "oxfmt@${OXFMT_VERSION}" --check -- < "${RUNNER_TEMP}/markdown-files"
      - name: Check Markdown formatting with Biome
        if: inputs.use-biome
        working-directory: ${{ inputs.search-path }}
        run: >  # zizmor: ignore[adhoc-packages] runs pinned Biome through pnpm dlx
          xargs -0 -r -t pnpm dlx "@biomejs/biome@${BIOME_VERSION}" format --files-ignore-unknown=true -- < "${RUNNER_TEMP}/markdown-files"
