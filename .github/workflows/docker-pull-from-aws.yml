---
name: Docker image pull from AWS
on:
  workflow_call:
    inputs:
      image-names:
        required: false
        type: string
        description: Docker image names to pull (separated by spaces or returns)
        default: null
      tag-source-to-target-json:
        required: false
        type: string
        description: JSON object with source image names as keys and target image tags as values
        default: null
      aws-iam-role-to-assume:
        required: false
        type: string
        description: IAM role ARN to assume; required for PR runs using profile ROLE_ARN. Restrict OIDC trust to trusted refs/environments
        default: null
      aws-region:
        required: false
        type: string
        description: AWS region (explicit input, then profile REGION, then us-east-1)
        default: null
      aws-profile-env-file:
        required: false
        type: string
        description: KEY=VALUE profile (ROLE_ARN, REGION); PRs require explicit role input; IAM OIDC trust policy remains authoritative
        default: null
      image-artifact-name:
        required: false
        type: string
        description: Docker image tarball artifact name to download
        default: docker-image
      image-artifact-retention-days:
        required: false
        type: number
        description: Number of days to retain artifacts
        default: 1
      image-artifact-overwrite:
        required: false
        type: boolean
        description: Overwrite existing artifacts
        default: true
      scan-after-pull:
        required: false
        type: boolean
        description: Scan the image after pull
        default: true
      trivy-scanners:
        required: false
        type: string
        description: List of scanners to use
        default: vuln,secret,misconfig
      trivy-severity:
        required: false
        type: string
        description: Severity levels to fail the scan
        default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      trivy-ignore-unfixed:
        required: false
        type: boolean
        description: Ignore unpatched/unfixed vulnerabilities
        default: true
      trivy-exit-code:
        required: false
        type: number
        description: Exit code for pre-build scan
        default: 1
      trivy-config:
        required: false
        type: string
        description: Path to a Trivy config file
        default: null
      trivy-timeout:
        required: false
        type: string
        description: Timeout for the Trivy scan
        default: 5m0s
      trivy-report-artifact-name:
        required: false
        type: string
        description: Unique base name for Trivy report artifacts; omit to skip report uploads
        default: null
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
      timeout-minutes:
        required: false
        type: number
        description: Timeout in minutes for the job
        default: 360
    secrets:
      GH_TOKEN:
        required: false
        description: GitHub token
permissions:
  contents: read    # This is required for actions/checkout
  id-token: write   # This is required for requesting the JWT
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  pull-and-save:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      IMAGE_NAMES: ${{ inputs.image-names }}
      TAG_SOURCE_TO_TARGET_JSON: ${{ inputs.tag-source-to-target-json }}
      IMAGE_URI_LIST_TXT: /tmp/docker-registry-imageurls.${{ github.run_id }}.txt
      IMAGE_TAR: /tmp/${{ inputs.image-artifact-name }}.tar
    outputs:
      image-refs-json: ${{ steps.output-image-refs.outputs.image_refs_json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read AWS profile environment file
        if: inputs.aws-profile-env-file != null
        id: aws-profile-env
        env:
          AWS_PROFILE_ENV_FILE: ${{ inputs.aws-profile-env-file }}
          AWS_IAM_ROLE_INPUT: ${{ inputs.aws-iam-role-to-assume }}
        run: |
          declare -A seen=()
          while IFS= read -r line || [[ -n "${line}" ]]; do
            line="${line%$'\r'}"
            [[ -z "${line}" || "${line}" == \#* ]] && continue
            if [[ "${line}" != *=* ]]; then
              echo "::error::Invalid AWS profile entry (expected KEY=VALUE)" >&2
              exit 1
            fi
            key="${line%%=*}"
            value="${line#*=}"
            case "${key}" in
              ROLE_ARN)
                if [[ "${GITHUB_EVENT_NAME:-}" == pull_request || "${GITHUB_EVENT_NAME:-}" == pull_request_target ]] \
                  && [[ -z "${AWS_IAM_ROLE_INPUT:-}" ]]; then
                  echo "::error::PR-triggered workflows must use an explicit aws-iam-role-to-assume instead of a profile ROLE_ARN" >&2
                  exit 1
                fi
                if [[ ! "${value}" =~ ^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
                  echo "::error::Invalid ROLE_ARN in AWS profile file" >&2
                  exit 1
                fi
                ;;
              REGION)
                if [[ ! "${value}" =~ ^[a-z]{2}(-[a-z0-9]+)+-[0-9]+$ ]]; then
                  echo "::error::Invalid REGION in AWS profile file" >&2
                  exit 1
                fi
                ;;
              *) continue ;;
            esac
            if [[ -n "${seen[${key}]+x}" ]]; then
              echo "::error::Duplicate ${key} in AWS profile file" >&2
              exit 1
            fi
            seen["${key}"]=1
            printf '%s=%s\n' "${key}" "${value}" >> "${GITHUB_OUTPUT}"
          done < "${AWS_PROFILE_ENV_FILE}"
      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ inputs.aws-iam-role-to-assume || steps.aws-profile-env.outputs.ROLE_ARN || null }}
          aws-region: ${{ inputs.aws-region || steps.aws-profile-env.outputs.REGION || 'us-east-1' }}
          role-session-name: github-actions-${{ github.run_id }}
          output-credentials: true
          output-env-credentials: false
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region || steps.aws-profile-env.outputs.REGION || 'us-east-1' }}
      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
        with:
          registry-type: public
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: us-east-1
      - name: Pull the Docker images
        run: |
          {
            if [[ -n "${IMAGE_NAMES}" ]]; then
              tr ' ' '\n' <<< "${IMAGE_NAMES}"
            elif [[ -n "${TAG_SOURCE_TO_TARGET_JSON}" ]]; then
              jq -r 'keys[]' <<< "${TAG_SOURCE_TO_TARGET_JSON}"
            fi
          } | sort -u -o "${IMAGE_URI_LIST_TXT}"
          xargs -L1 -t docker pull < "${IMAGE_URI_LIST_TXT}"
      - name: Tag the Docker images
        if: inputs.tag-source-to-target-json != null
        run: |
          jq -r 'to_entries[] | [.key, .value] | @tsv' <<< "${TAG_SOURCE_TO_TARGET_JSON}" \
            | while IFS=$'\t' read -r src dst; do
                docker tag "${src}" "${dst}"
              done
          jq -r 'values[]' <<< "${TAG_SOURCE_TO_TARGET_JSON}" >> "${IMAGE_URI_LIST_TXT}"
          sort -u -o "${IMAGE_URI_LIST_TXT}" "${IMAGE_URI_LIST_TXT}"
      - name: Output the image references
        id: output-image-refs
        run: |
          jq -rRs 'split("\n")[:-1] | "image_refs_json=\(.)"' < "${IMAGE_URI_LIST_TXT}" \
            | tee -a "${GITHUB_OUTPUT}"
      - name: Save the Docker images to an image tarball
        run: |
          xargs -t docker save -o "${IMAGE_TAR}" < "${IMAGE_URI_LIST_TXT}"
      - name: Upload the image tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.image-artifact-name }}
          path: ${{ env.IMAGE_TAR }}
          retention-days: ${{ inputs.image-artifact-retention-days }}
          overwrite: ${{ inputs.image-artifact-overwrite }}
  postpull-scan:
    if: >
      inputs.scan-after-pull
    needs:
      - pull-and-save
    uses: ./.github/workflows/docker-image-scan.yml
    with:
      image-refs-json: ${{ needs.pull-and-save.outputs.image-refs-json }}
      image-artifact-name: ${{ inputs.image-artifact-name }}
      trivy-scanners: ${{ inputs.trivy-scanners }}
      trivy-severity: ${{ inputs.trivy-severity }}
      trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      trivy-exit-code: ${{ inputs.trivy-exit-code }}
      trivy-config: ${{ inputs.trivy-config }}
      trivy-timeout: ${{ inputs.trivy-timeout }}
      trivy-report-artifact-name: ${{ inputs.trivy-report-artifact-name }}
      runs-on: ${{ inputs.runs-on }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
