---
name: GitHub CodeQL Analysis
on:
  workflow_call:
    inputs:
      language:
        required: false
        type: string
        description: The language to analyze (JSON array)
        default: >
          ["python"]
      go-version:
        required: false
        type: string
        description: Go version to use
        default: stable
      queries:
        required: false
        type: string
        description: Additional CodeQL queries (prefix + preserves config-file queries)
        default: +security-extended
      config-file:
        required: false
        type: string
        description: Optional CodeQL config file relative to the caller repository
        default: ''
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
permissions:
  security-events: write  # required for all workflows
  actions: read           # only required for workflows in private repositories
  contents: read          # only required for workflows in private repositories
jobs:
  codeql-analysis:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.language) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}   # { actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, swift }
          build-mode: ${{ matrix.language == 'actions' && 'none' || '' }}
          queries: ${{ inputs.queries }}
          config-file: ${{ inputs.config-file }}
      - name: Autobuild   # Autobuild attempts to build any compiled languages (C/C++, C#, Go, Java, or Swift).
        if: contains(fromJSON('["c-cpp","csharp","go","java-kotlin","swift"]'), matrix.language)
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: /language:${{ matrix.language }}
