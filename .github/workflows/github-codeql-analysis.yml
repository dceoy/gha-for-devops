---
name: GitHub CodeQL analysis
on:
  workflow_call:
    inputs:
      language:
        required: false
        type: string
        description: The language to analyze (JSON array)
        default: >
          ["python"]
      go-version:
        required: false
        type: string
        description: Go version to use
        default: stable
      queries:
        required: false
        type: string
        description: Additional CodeQL queries (prefix + preserves config-file queries)
        default: +security-extended
      config-file:
        required: false
        type: string
        description: Optional CodeQL config file relative to the caller repository
        default: null
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
permissions: {}
jobs:
  github-codeql-analysis:
    permissions:
      security-events: write  # required for all workflows
      actions: read           # only required for workflows in private repositories
      contents: read          # only required for workflows in private repositories
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.language) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}   # { actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, swift }
          build-mode: ${{ contains(fromJSON('["c-cpp","csharp","go","java-kotlin","swift"]'), matrix.language) && 'autobuild' || 'none' }}
          queries: ${{ inputs.queries }}
          config-file: ${{ inputs.config-file || (hashFiles('.github/codeql/codeql-config.yml') != '' && './.github/codeql/codeql-config.yml') || '' }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:${{ matrix.language == 'javascript-typescript' && 'javascript' || matrix.language }}
