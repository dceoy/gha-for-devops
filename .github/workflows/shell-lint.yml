---
name: Lint for Shell
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for files
        default: .
      file-names:
        required: false
        type: string
        description: Newline-separated file names or pathspecs passed to git ls-files
        default: |
          *.sh
          *.bash
          *.bats
      enable-cache:
        required: false
        type: boolean
        description: Cache the pinned ShellCheck download when it is not preinstalled
        default: true
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust the ShellCheck cache
        default: null
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  lint:
    runs-on: ${{ inputs.runs-on }}
    env:
      # renovate: datasource=github-releases depName=koalaman/shellcheck
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Cache ShellCheck
        if: inputs.enable-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/bin/shellcheck
          key: shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ env.SHELLCHECK_VERSION }}-${{ inputs.cache-salt }}
      - name: Install ShellCheck when unavailable
        env:
          SHELLCHECK_VERSION: ${{ env.SHELLCHECK_VERSION }}
        run: |
          [[ "${SHELLCHECK_VERSION}" =~ ^v[0-9]+(\.[0-9]+)*([._+-][A-Za-z0-9]+)*$ ]] || { echo "invalid SHELLCHECK_VERSION"; exit 1; }
          if command -v shellcheck >/dev/null; then
            exit 0
          fi
          mkdir -p "${HOME}/.local/bin"
          if [[ ! -x "${HOME}/.local/bin/shellcheck" ]]; then
            arch=x86_64
            [[ "${RUNNER_ARCH}" == "ARM64" ]] && arch=aarch64
            curl --fail --location --silent --show-error \
              "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.${arch}.tar.xz" \
              | tar -xJ --strip-components=1 -C "${RUNNER_TEMP}" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
            install -m 0755 "${RUNNER_TEMP}/shellcheck" "${HOME}/.local/bin/shellcheck"
          fi
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Execute shellcheck
        working-directory: ${{ inputs.search-path }}
        env:
          FILE_NAMES: ${{ inputs.file-names }}
        run: |
          patterns=()
          while IFS= read -r pattern; do
            [[ -n "${pattern}" ]] && patterns+=("${pattern}")
          done <<< "${FILE_NAMES}"
          [[ ${#patterns[@]} -eq 0 ]] && { echo "::error::file-names input produced no entries"; exit 1; }

          declare -A selected=()
          while IFS= read -r -d '' file; do
            selected["${file}"]=1
          done < <(git ls-files -z -- "${patterns[@]}")

          shell_shebang='^#![[:space:]]*(/usr/bin/env[[:space:]]+([^[:space:]]+[[:space:]]+)*)?(/[^[:space:]]*/)?(busybox[[:space:]]+)?(sh|ash|dash|bash|ksh93|ksh88|ksh|oksh|bats)([[:space:]]|$)'
          while IFS= read -r -d '' entry; do
            mode=${entry%% *}
            [[ "${mode}" == '100644' || "${mode}" == '100755' ]] || continue
            file=${entry#*$'\t'}
            first_line=''
            IFS= read -r first_line < "${file}" || true
            [[ "${first_line}" =~ ${shell_shebang} ]] && selected["${file}"]=1
          done < <(git ls-files -z --stage)

          ((${#selected[@]} == 0)) || printf '%s\0' "${!selected[@]}" | xargs -0 -r -t shellcheck --external-sources
