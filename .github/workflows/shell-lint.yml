---
name: Lint for Shell
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for files
        default: .
      file-names:
        required: false
        type: string
        description: Newline-separated file names or pathspecs passed to git ls-files
        default: |
          *.sh
          *.bash
          *.bats
      use-shfmt:
        required: false
        type: boolean
        description: Check formatting with shfmt
        default: false
      shfmt-options:
        required: false
        type: string
        description: Additional space-separated formatting options for shfmt
        default: --indent=2 --binary-next-line --case-indent --space-redirects
      enable-cache:
        required: false
        type: boolean
        description: Cache pinned ShellCheck and shfmt downloads when they are not preinstalled
        default: true
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust the linter caches
        default: null
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  lint:
    runs-on: ${{ inputs.runs-on }}
    env:
      # renovate: datasource=github-releases depName=koalaman/shellcheck
      SHELLCHECK_VERSION: v0.11.0
      # renovate: datasource=github-releases depName=mvdan/sh
      SHFMT_VERSION: v3.13.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Cache ShellCheck
        if: inputs.enable-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/bin/shellcheck
          key: shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ env.SHELLCHECK_VERSION }}-${{ inputs.cache-salt }}
      - name: Cache shfmt
        if: inputs.use-shfmt && inputs.enable-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/bin/shfmt
          key: shfmt-${{ runner.os }}-${{ runner.arch }}-${{ env.SHFMT_VERSION }}-${{ inputs.cache-salt }}
      - name: Install ShellCheck when unavailable
        env:
          SHELLCHECK_VERSION: ${{ env.SHELLCHECK_VERSION }}
        run: |
          [[ "${SHELLCHECK_VERSION}" =~ ^v[0-9]+(\.[0-9]+)*([._+-][A-Za-z0-9]+)*$ ]] || { echo "invalid SHELLCHECK_VERSION"; exit 1; }
          if command -v shellcheck >/dev/null; then
            exit 0
          fi
          mkdir -p "${HOME}/.local/bin"
          if [[ ! -x "${HOME}/.local/bin/shellcheck" ]]; then
            arch=x86_64
            [[ "${RUNNER_ARCH}" == "ARM64" ]] && arch=aarch64
            curl --fail --location --silent --show-error \
              "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.${arch}.tar.xz" \
              | tar -xJ --strip-components=1 -C "${RUNNER_TEMP}" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
            install -m 0755 "${RUNNER_TEMP}/shellcheck" "${HOME}/.local/bin/shellcheck"
          fi
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Install shfmt when enabled and unavailable
        if: inputs.use-shfmt
        env:
          SHFMT_VERSION: ${{ env.SHFMT_VERSION }}
        run: |
          [[ "${SHFMT_VERSION}" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "invalid SHFMT_VERSION"; exit 1; }
          if command -v shfmt >/dev/null; then
            exit 0
          fi
          mkdir -p "${HOME}/.local/bin"
          if [[ ! -x "${HOME}/.local/bin/shfmt" ]]; then
            arch=amd64
            [[ "${RUNNER_ARCH}" == "ARM64" ]] && arch=arm64
            asset="shfmt_${SHFMT_VERSION}_linux_${arch}"
            curl --fail --location --silent --show-error \
              --output "${RUNNER_TEMP}/${asset}" \
              "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/${asset}"
            curl --fail --location --silent --show-error \
              "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/sha256sums.txt" \
              | grep -F "  ${asset}" \
              | (cd "${RUNNER_TEMP}" && sha256sum --check --strict -)
            install -m 0755 "${RUNNER_TEMP}/${asset}" "${HOME}/.local/bin/shfmt"
          fi
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Execute shell linters
        working-directory: ${{ inputs.search-path }}
        env:
          FILE_NAMES: ${{ inputs.file-names }}
          SHFMT_OPTIONS: ${{ inputs.shfmt-options }}
          USE_SHFMT: ${{ inputs.use-shfmt }}
        run: |
          files=()
          while IFS= read -r f; do
            [[ -n "${f}" ]] && files+=("${f}")
          done <<< "${FILE_NAMES}"
          [[ ${#files[@]} -eq 0 ]] && { echo "::error::file-names input produced no entries"; exit 1; }
          git ls-files -z -- "${files[@]}" | xargs -0 -r -t shellcheck --external-sources
          if [[ "${USE_SHFMT}" == "true" ]]; then
            shfmt_args=()
            [[ -n "${SHFMT_OPTIONS}" ]] && read -r -a shfmt_args <<< "${SHFMT_OPTIONS}"
            git ls-files -z -- "${files[@]}" \
              | xargs -0 -r -t shfmt --apply-ignore "${shfmt_args[@]}" -d
          fi
