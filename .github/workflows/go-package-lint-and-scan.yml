---
name: Lint and security scan for Go
on:
  workflow_call:
    inputs:
      package-path:
        required: false
        type: string
        description: Path to a Go package or project
        default: .
      go-version:
        required: false
        type: string
        description: Go version to use
        default: stable
      use-gosec:
        required: false
        type: boolean
        description: Use gosec for security scanning
        default: true
      use-govulncheck:
        required: false
        type: boolean
        description: Use govulncheck for vulnerability scanning
        default: true
      use-osv-scanner:
        required: false
        type: boolean
        description: Scan dependencies using OSV-Scanner
        default: true
      use-trivy:
        required: false
        type: boolean
        description: Scan dependencies, secrets, and misconfiguration using Trivy
        default: true
      trivy-report-artifact-name:
        required: false
        type: string
        description: Optional artifact name for the Trivy SARIF report
        default: ""
      semgrep-exclude-cooldown-rules:
        type: boolean
        default: false
        description: Exclude Semgrep p/default dependency cooldown and minimum release age rules
      use-semgrep:
        required: false
        type: boolean
        description: Run Semgrep OSS SAST scan using p/default rules
        default: true
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-slim
      security-runs-on:
        required: false
        type: string
        description: Runner for Docker-free source security scans (Trivy and Semgrep)
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  go-security-scan:
    if: inputs.use-osv-scanner || inputs.use-trivy || inputs.use-semgrep
    uses: $/.github/workflows/source-security-scan.yml
    with:
      runs-on: ${{ inputs.security-runs-on }}
      package-path: ${{ inputs.package-path }}
      use-osv-scanner: ${{ inputs.use-osv-scanner }}
      use-trivy: ${{ inputs.use-trivy }}
      trivy-report-artifact-name: ${{ inputs.trivy-report-artifact-name }}
      use-semgrep: ${{ inputs.use-semgrep }}
      semgrep-exclude-cooldown-rules: ${{ inputs.semgrep-exclude-cooldown-rules }}
      semgrep-working-directory: ${{ inputs.package-path }}
      semgrep-includes: |
        *.go
  go-package-lint-and-scan:
    permissions:
      contents: read
      security-events: write
    runs-on: ${{ inputs.runs-on }}
    env:
      UV_EXCLUDE_NEWER: 1 day
      # renovate: datasource=github-releases depName=golangci/golangci-lint
      GOLANGCI_LINT_VERSION: v2.15.0
      # renovate: datasource=github-releases depName=securego/gosec
      GOSEC_VERSION: v2.30.0
      # renovate: datasource=go depName=golang.org/x/vuln
      GOVULNCHECK_VERSION: v1.9.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: ${{ hashFiles(format('{0}/go.sum', inputs.package-path)) != '' }}
          cache-dependency-path: ${{ inputs.package-path }}/go.sum
      - name: Cache Go projects without checksum files
        if: hashFiles(format('{0}/go.sum', inputs.package-path)) == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-no-sum-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles(format('{0}/go.mod', inputs.package-path)) }}
          restore-keys: |
            go-no-sum-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-
      - name: Cache Go tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/golangci-lint
            ~/go/bin
          key: go-tools-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ env.GOSEC_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-${{ hashFiles(format('{0}/go.sum', inputs.package-path)) }}
          restore-keys: go-tools-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ env.GOSEC_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-
      - name: Verify Go installation
        working-directory: ${{ inputs.package-path }}
        run: |
          go version
          if [[ -f go.mod ]]; then
            echo "Found go.mod file"
            go mod download
            go mod verify
          else
            echo "No go.mod file found"
          fi
      - name: Install golangci-lint
        run: |
          if [[ ! -x "$(go env GOPATH)/bin/golangci-lint" ]]; then
            go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          fi
      - name: Install gosec
        if: inputs.use-gosec
        run: |
          if [[ ! -x "$(go env GOPATH)/bin/gosec" ]]; then
            go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          fi
      - name: Install govulncheck
        if: inputs.use-govulncheck
        run: |
          if [[ ! -x "$(go env GOPATH)/bin/govulncheck" ]]; then
            go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          fi
      - name: Run golangci-lint
        working-directory: ${{ inputs.package-path }}
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: Run go mod tidy check
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ -f go.mod ]]; then
            go mod tidy
            if [[ -n "$(git status --porcelain go.mod go.sum)" ]]; then
              echo "go.mod or go.sum is not tidy:"
              git diff go.mod go.sum
              exit 1
            fi
          fi
      - name: Run govulncheck
        if: inputs.use-govulncheck
        working-directory: ${{ inputs.package-path }}
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Run additional security scan with gosec
        if: inputs.use-gosec
        working-directory: ${{ inputs.package-path }}
        run: |
          "$(go env GOPATH)/bin/gosec" -fmt sarif -out gosec-results.sarif ./...
      - name: Upload gosec results to GitHub Security tab
        if: inputs.use-gosec
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: ${{ inputs.package-path }}/gosec-results.sarif
