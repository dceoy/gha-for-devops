---
name: Lint and security scan for Go
on:
  workflow_call:
    inputs:
      package-path:
        required: false
        type: string
        description: Path to a Go package or project
        default: .
      go-version:
        required: false
        type: string
        description: Go version to use
        default: stable
      use-gosec:
        required: false
        type: boolean
        description: Use gosec for security scanning
        default: true
      use-govulncheck:
        required: false
        type: boolean
        description: Use govulncheck for vulnerability scanning
        default: true
      use-osv-scanner:
        required: false
        type: boolean
        description: Scan dependencies using OSV-Scanner
        default: true
      use-semgrep:
        required: false
        type: boolean
        description: Run Semgrep OSS SAST scan using p/default rules
        default: true
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-slim
permissions:
  contents: read
  security-events: write
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  lint-and-scan:
    runs-on: ${{ inputs.runs-on }}
    env:
      UV_EXCLUDE_NEWER: 7 days
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.package-path }}/go.sum
      - name: Scan dependencies using OSV-Scanner
        if: inputs.use-osv-scanner
        env:
          SCAN_PATH: ${{ inputs.package-path }}
          OSV_SCANNER_VERSION: v2.6.0
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) platform=linux_amd64 ;;
            Linux-ARM64) platform=linux_arm64 ;;
            macOS-X64) platform=darwin_amd64 ;;
            macOS-ARM64) platform=darwin_arm64 ;;
            Windows-X64) platform=windows_amd64 ;;
            Windows-ARM64) platform=windows_arm64 ;;
            *) echo "::error::Unsupported OSV-Scanner platform"; exit 1 ;;
          esac
          asset="osv-scanner_${platform}"
          [[ "${RUNNER_OS}" != Windows ]] || asset+=".exe"
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "${scan_dir}"' EXIT
          base_url="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
          curl -fsSL --retry 3 "${base_url}/${asset}" -o "${scan_dir}/${asset}"
          curl -fsSL --retry 3 "${base_url}/osv-scanner_SHA256SUMS" -o "${scan_dir}/SHA256SUMS"
          checksum_cmd=(shasum -a 256 --check)
          if command -v sha256sum >/dev/null 2>&1; then checksum_cmd=(sha256sum --check); fi
          (
            cd "${scan_dir}"
            grep -E "^[[:xdigit:]]{64} [ *]${asset}$" SHA256SUMS | "${checksum_cmd[@]}" -
          )
          chmod +x "${scan_dir}/${asset}"
          scan_args=(scan source --recursive --include-git-root)
          status=0
          "${scan_dir}/${asset}" "${scan_args[@]}" "${SCAN_PATH}" || status=$?
          if [[ "${status}" -eq 128 ]]; then
            echo "::notice::OSV-Scanner found no extractable dependencies."
          elif [[ "${status}" -ne 0 ]]; then
            exit "${status}"
          fi
      - name: Cache Go tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/bin
          key: go-tools-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles(format('{0}/go.sum', inputs.package-path)) }}
          restore-keys: go-tools-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      - name: Verify Go installation
        working-directory: ${{ inputs.package-path }}
        run: |
          go version
          if [[ -f go.mod ]]; then
            echo "Found go.mod file"
            go mod download
            go mod verify
          else
            echo "No go.mod file found"
          fi
      - name: Install golangci-lint
        run: |
          golangci-lint --version || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Install gosec
        if: inputs.use-gosec
        run: |
          gosec --version || go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Install govulncheck
        if: inputs.use-govulncheck
        run: |
          govulncheck --version || go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run golangci-lint
        working-directory: ${{ inputs.package-path }}
        run: |
          golangci-lint run ./...
      - name: Run go mod tidy check
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ -f go.mod ]]; then
            go mod tidy
            if [[ -n "$(git status --porcelain go.mod go.sum)" ]]; then
              echo "go.mod or go.sum is not tidy:"
              git diff go.mod go.sum
              exit 1
            fi
          fi
      - name: Run govulncheck
        if: inputs.use-govulncheck
        working-directory: ${{ inputs.package-path }}
        run: |
          govulncheck ./...
      - name: Run additional security scan with gosec
        if: inputs.use-gosec
        working-directory: ${{ inputs.package-path }}
        run: |
          gosec -fmt sarif -out gosec-results.sarif ./...
      - name: Upload gosec results to GitHub Security tab
        if: inputs.use-gosec
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: ${{ inputs.package-path }}/gosec-results.sarif
      - name: Set up uv for Semgrep
        if: inputs.use-semgrep
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: auto
      - name: Run Semgrep SAST scan
        if: inputs.use-semgrep
        working-directory: ${{ inputs.package-path }}
        run: | # zizmor: ignore[adhoc-packages] runs Semgrep via uvx
          uvx semgrep scan \
            --config p/default --metrics off --error \
            --include '*.go' .
