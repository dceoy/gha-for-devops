---
name: Update mise.lock and create a pull request
on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        description: Directory containing mise.toml and mise.lock
        default: .
      mise-version:
        required: false
        type: string
        description: Version of mise to use
        # renovate: datasource=github-releases depName=jdx/mise
        default: 2026.8.5
      bump:
        required: false
        type: boolean
        description: Re-resolve floating tool versions within their configured constraints
        default: true
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
    secrets:
      GH_TOKEN:
        required: false
        description: Optional GitHub token for creating PRs and triggering their checks
permissions:
  contents: write
  pull-requests: write
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
env:
  MISE_USE_VERSIONS_HOST_TRACK: 'false'
jobs:
  mise-lock-update:
    if: >
      startsWith(github.ref, 'refs/heads/')
      && !startsWith(github.ref, 'refs/heads/github-actions/mise-lock-update/')
      && github.event_name != 'pull_request'
      && github.event_name != 'pull_request_target'
    runs-on: ${{ inputs.runs-on }}
    env:
      MISE_SAFE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up mise without installing project tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
        with:
          version: ${{ inputs.mise-version }}
          install: false
          cache: false
      - name: Refresh mise.lock
        working-directory: ${{ inputs.working-directory }}
        env:
          BUMP: ${{ inputs.bump }}
          MISE_GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! -f mise.toml ]]; then
            echo '::error::mise.toml does not exist in the working directory'
            exit 1
          fi
          if [[ "${BUMP}" == 'true' ]]; then
            mise lock --bump
          else
            mise lock
          fi
      - name: Create update branch name
        id: parameters
        env:
          PR_BASE: ${{ github.ref_name }}
          TARGET_PATH: ${{ inputs.working-directory }}
        run: |
          target_hash=$(printf '%s' "${TARGET_PATH}" | sha256sum | cut -c1-12)
          printf 'branch=github-actions/mise-lock-update/%s/%s\n' "${PR_BASE}" "${target_hash}" >> "${GITHUB_OUTPUT}"
      - name: Create a pull request if the lockfile changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          commit-message: Update mise.lock
          title: Update mise.lock
          branch: ${{ steps.parameters.outputs.branch }}
          base: ${{ github.ref_name }}
          body: |
            Refresh the mise lockfile using `mise lock`.

            - Re-resolve floating tool version requests when `bump` is enabled.
            - Preserve exact version pins in `mise.toml`.
            - Include generated lockfile dependency sidecars, if any.

            Generated by [${{ github.workflow_ref }}](https://github.com/${{ github.repository }}/).
          delete-branch: true
          draft: false
