---
name: Lint and security scan for Python
on:
  workflow_call:
    inputs:
      package-path:
        required: false
        type: string
        description: Repository-relative package path (forward slashes only, no .. or glob characters)
        default: .
      python-version:
        required: false
        type: string
        description: Python version to use (not applicable if uv.lock is present)
        default: 3.x
      uv-version:
        required: false
        type: string
        description: Version of uv to use
        default: latest
      enable-cache:
        required: false
        type: boolean
        description: Cache Python dependency downloads
        default: true
      cache-dependency-path:
        required: false
        type: string
        description: Dependency file used to scope the cache
        default: null
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust the dependency cache
        default: null
      use-pyright:
        required: false
        type: boolean
        description: Use pyright to check types
        default: true
      use-ty:
        required: false
        type: boolean
        description: Use ty to check types
        default: false
      use-ruff-format:
        required: false
        type: boolean
        description: Use ruff format to check code
        default: true
      audit:
        required: false
        type: boolean
        description: Run security audit on locked dependencies (applicable only if uv.lock is present)
        default: true
      additional-python-packages:
        required: false
        type: string
        description: Additional Python packages to install
        default: null
      requirements-txt:
        required: false
        type: string
        description: Path to the requirements.txt file (not applicable if uv.lock is present)
        default: null
      use-osv-scanner:
        required: false
        type: boolean
        description: Scan dependencies using OSV-Scanner
        default: true
      use-trivy:
        required: false
        type: boolean
        description: Scan dependencies, secrets, and misconfiguration using Trivy
        default: true
      trivy-report-artifact-name:
        required: false
        type: string
        description: Optional artifact name for the Trivy SARIF report
        default: ""
      semgrep-exclude-cooldown-rules:
        type: boolean
        default: false
        description: Exclude Semgrep p/default dependency cooldown and minimum release age rules
      use-semgrep:
        required: false
        type: boolean
        description: Run Semgrep OSS SAST scan using p/default rules
        default: true
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-slim
      security-runs-on:
        required: false
        type: string
        description: Runner for Docker-free source security scans (Trivy and Semgrep)
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  python-security-scan:
    if: inputs.use-osv-scanner || inputs.use-trivy || inputs.use-semgrep
    uses: $/.github/workflows/source-security-scan.yml
    with:
      runs-on: ${{ inputs.security-runs-on }}
      package-path: ${{ inputs.package-path }}
      requirements-txt: ${{ inputs.requirements-txt }}
      use-osv-scanner: ${{ inputs.use-osv-scanner }}
      use-trivy: ${{ inputs.use-trivy }}
      trivy-report-artifact-name: ${{ inputs.trivy-report-artifact-name }}
      use-semgrep: ${{ inputs.use-semgrep }}
      semgrep-exclude-cooldown-rules: ${{ inputs.semgrep-exclude-cooldown-rules }}
      semgrep-working-directory: ${{ inputs.package-path }}
      semgrep-includes: |
        *.py
  python-package-lint-and-scan:
    runs-on: ${{ inputs.runs-on }}
    env:
      UV_EXCLUDE_NEWER: 1 day
      UV_MALWARE_CHECK: "1"
      PACKAGE_PATH: ${{ inputs.package-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: ${{ inputs.enable-cache }}
          cache-dependency-glob: ${{ inputs.cache-dependency-path || format('{0}/uv.lock', inputs.package-path) }}
          cache-suffix: ${{ inputs.cache-salt }}
      - name: Install packages using uv
        if: hashFiles(format('{0}/uv.lock', inputs.package-path)) != ''
        working-directory: ${{ inputs.package-path }}
        env:
          INPUTS_ADDITIONAL_PYTHON_PACKAGES: ${{ inputs.additional-python-packages }}
          INPUTS_AUDIT: ${{ inputs.audit }}
          USE_PYRIGHT: ${{ inputs.use-pyright }}
          USE_TY: ${{ inputs.use-ty }}
        run: |
          if [[ "${PACKAGE_PATH}" == /* || "${PACKAGE_PATH}" == [A-Za-z]:* || "${PACKAGE_PATH}" == *\\* || "/${PACKAGE_PATH}/" == *"/../"* || "${PACKAGE_PATH}" == *[\?\*\[\]\!\{\}\(\)\+\@\|]* ]]; then
            echo "::error::package-path must be relative, use forward slashes, and contain no .. or glob characters" >&2
            exit 1
          fi
          uv sync --all-groups
          if [[ "${INPUTS_AUDIT}" == "true" ]]; then
            uv audit --locked
          fi
          packages=(ruff)
          [[ "${USE_PYRIGHT}" == "true" ]] && packages+=(pyright)
          [[ "${USE_TY}" == "true" ]] && packages+=(ty)
          uv add --dev "${packages[@]}"
          for p in $(tr ' ' '\n' <<< "${INPUTS_ADDITIONAL_PYTHON_PACKAGES}"); do
            if [[ -n "${p}" ]]; then
              uv add --dev "${p}"
            fi
          done
          echo "EXECUTOR_KIND=uv" >> "${GITHUB_ENV}"
      - name: Set up Python
        if: hashFiles(format('{0}/uv.lock', inputs.package-path)) == ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install packages using uv pip
        if: hashFiles(format('{0}/uv.lock', inputs.package-path)) == ''
        env:
          ADDITIONAL_PYTHON_PACKAGES: ${{ inputs.additional-python-packages }}
          REQUIREMENTS_TXT_PATH: ${{ inputs.requirements-txt }}
          USE_PYRIGHT: ${{ inputs.use-pyright }}
          USE_TY: ${{ inputs.use-ty }}
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ "${PACKAGE_PATH}" == /* || "${PACKAGE_PATH}" == [A-Za-z]:* || "${PACKAGE_PATH}" == *\\* || "/${PACKAGE_PATH}/" == *"/../"* || "${PACKAGE_PATH}" == *[\?\*\[\]\!\{\}\(\)\+\@\|]* ]]; then
            echo "::error::package-path must be relative, use forward slashes, and contain no .. or glob characters" >&2
            exit 1
          fi
          if [[ -n "${REQUIREMENTS_TXT_PATH}" ]]; then
            uv pip install --system -r "${REQUIREMENTS_TXT_PATH}"
          fi
          packages=(ruff)
          [[ "${USE_PYRIGHT}" == "true" ]] && packages+=(pyright)
          [[ "${USE_TY}" == "true" ]] && packages+=(ty)
          uv pip install --system "${packages[@]}"
          for p in $(tr ' ' '\n' <<< "${ADDITIONAL_PYTHON_PACKAGES}"); do
            if [[ -n "${p}" ]]; then
              uv pip install --system "${p}"
            fi
          done
          echo "EXECUTOR_KIND=none" >> "${GITHUB_ENV}"
      - name: Lint the code using ruff check
        working-directory: ${{ inputs.package-path }}
        run: |
          case "${EXECUTOR_KIND}" in
            uv)     uv run ruff check --output-format=github . ;;
            *)      ruff check --output-format=github . ;;
          esac
      - name: Check the code using ruff format
        if: inputs.use-ruff-format
        working-directory: ${{ inputs.package-path }}
        run: |
          case "${EXECUTOR_KIND}" in
            uv)     uv run ruff format --check . ;;
            *)      ruff format --check . ;;
          esac
      - name: Check types using pyright
        if: inputs.use-pyright
        working-directory: ${{ inputs.package-path }}
        run: |
          case "${EXECUTOR_KIND}" in
            uv)     uv run pyright --threads=0 . ;;
            *)      pyright --threads=0 . ;;
          esac
      - name: Check types using ty
        if: inputs.use-ty
        working-directory: ${{ inputs.package-path }}
        run: |
          case "${EXECUTOR_KIND}" in
            uv)     uv run ty check . ;;
            *)      ty check . ;;
          esac
