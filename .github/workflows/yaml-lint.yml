---
name: Lint for YAML
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for files
        default: .
      python-version:
        required: false
        type: string
        description: Python version to use
        default: 3.x
      enable-cache:
        required: false
        type: boolean
        description: Cache pinned yamllint downloads
        default: true
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust the yamllint cache
        default: null
      yamllint-config-data:
        required: false
        type: string
        description: Configuration data for yamllint
        default: '{"extends": "relaxed", "rules": {"line-length": "disable"}}'
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  lint:
    runs-on: ${{ inputs.runs-on }}
    env:
      # renovate: datasource=pypi depName=yamllint versioning=pep440
      YAMLLINT_VERSION: 1.38.0
    steps:
      - name: Disable pip cache
        if: '! inputs.enable-cache'
        run: echo 'PIP_NO_CACHE_DIR=true' >> "${GITHUB_ENV}"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Cache yamllint
        if: inputs.enable-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: yamllint-${{ runner.os }}-${{ inputs.python-version }}-${{ env.YAMLLINT_VERSION }}-${{ inputs.cache-salt }}
      - name: Install yamllint
        env:
          YAMLLINT_VERSION: ${{ env.YAMLLINT_VERSION }}
        run: |
          [[ "${YAMLLINT_VERSION}" =~ ^[0-9]+(\.[0-9]+)*([._+-][A-Za-z0-9]+)*$ ]] || { echo "invalid YAMLLINT_VERSION"; exit 1; }
          pip install "yamllint==${YAMLLINT_VERSION}"
      - name: Execute yamllint
        env:
          YAMLLINT_CONFIG_DATA: ${{ inputs.yamllint-config-data }}
        working-directory: ${{ inputs.search-path }}
        run: >
          git ls-files -z -- '*.yml' '*.yaml'
          | xargs -0 -t yamllint --config-data="${YAMLLINT_CONFIG_DATA}"
