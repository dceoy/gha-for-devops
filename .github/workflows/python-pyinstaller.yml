---
name: Build using PyInstaller
on:
  workflow_call:
    inputs:
      app-script-path:
        required: true
        type: string
        description: Path to a Python script
      python-version:
        required: false
        type: string
        description: Python version to use (not applicable if uv.lock is present)
        default: 3.x
      uv-version:
        required: false
        type: string
        description: Version of uv to use (applicable only if uv.lock is present)
        default: latest
      enable-cache:
        required: false
        type: boolean
        description: Cache dependency downloads (never built executables)
        default: true
      cache-dependency-path:
        required: false
        type: string
        description: Dependency file used to scope the cache
        default: null
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust the uv cache
        default: null
      requirements-txt:
        required: false
        type: string
        description: Path to the requirements.txt file (not applicable if uv.lock is present)
        default: null
      artifact-name:
        required: false
        type: string
        description: Name of the artifact
        default: dist
      artifact-path:
        required: false
        type: string
        description: Path to the artifact
        default: dist
      artifact-retention-days:
        required: false
        type: number
        description: Number of days to retain artifacts
        default: 1
      artifact-overwrite:
        required: false
        type: boolean
        description: Overwrite existing artifacts
        default: true
      runs-on:
        required: false
        type: string
        description: Type of machine to run the job on
        default: windows-latest
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  python-pyinstaller:
    runs-on: ${{ inputs.runs-on }}
    env:
      UV_EXCLUDE_NEWER: 1 day
      UV_MALWARE_CHECK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: ${{ inputs.enable-cache }}
          cache-dependency-glob: ${{ inputs.cache-dependency-path || 'uv.lock' }}
          cache-suffix: ${{ inputs.cache-salt }}
      - name: Install packages using uv
        if: hashFiles('uv.lock') != ''
        run: |
          uv sync --all-groups
          uv add --dev PyInstaller
          echo "EXECUTOR_KIND=uv" >> "${GITHUB_ENV}"
      - name: Set up Python
        if: hashFiles('uv.lock') == ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install packages
        if: hashFiles('uv.lock') == ''
        env:
          REQUIREMENTS_TXT_PATH: ${{ inputs.requirements-txt }}
        run: |
          if [[ -n "${REQUIREMENTS_TXT_PATH}" ]]; then
            uv pip install --system -r "${REQUIREMENTS_TXT_PATH}"
          fi
          uv pip install --system PyInstaller
          echo "EXECUTOR_KIND=none" >> "${GITHUB_ENV}"
      - name: Build an executable file
        env:
          APP_SCRIPT_PATH: ${{ inputs.app-script-path }}
        run: |
          case "${EXECUTOR_KIND}" in
            uv)     uv run PyInstaller --clean --noconsole --onefile "${APP_SCRIPT_PATH}" ;;
            # Bare pip installs may not expose PyInstaller on PATH; preserve prior `python -m` behavior.
            *)      python -m PyInstaller --clean --noconsole --onefile "${APP_SCRIPT_PATH}" ;;
          esac
      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: ${{ inputs.artifact-retention-days }}
          overwrite: ${{ inputs.artifact-overwrite }}
