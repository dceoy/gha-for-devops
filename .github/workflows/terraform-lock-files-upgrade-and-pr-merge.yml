---
name: Upgrade of Terraform lock files and pull request merge
on:
  workflow_call:
    inputs:
      terraform-working-directories:
        required: false
        type: string
        description: Terraform working directories (separated by spaces or returns)
        default: .
      terraform-working-directory-to-version-tf-json:
        required: false
        type: string
        description: JSON object with Terraform working directories as keys and Terraform version files as values
        default: null
      terragrunt-working-directories:
        required: false
        type: string
        description: Terragrunt working directories (separated by spaces or returns)
        default: null
      terraform-version:
        required: false
        type: string
        description: Terraform version to use
        default: latest
      terragrunt-version:
        required: false
        type: string
        description: Terragrunt version to use
        default: latest
      merged-pr-branch-prefix:
        required: false
        type: string
        description: Deprecated compatibility input; PR aggregation is no longer performed
        default: null
      merge-pr-head-branch-prefix:
        required: false
        type: string
        description: Prefix required for dependency PR branches before lock-file upgrade or merge
        default: dependabot/terraform/
      merge-pr-author-allowlist:
        required: false
        type: string
        description: Comma-separated trusted PR authors allowed for lock-file upgrade or merge
        default: dependabot[bot]
      search-path-for-lint-and-scan:
        required: false
        type: string
        description: Path to search for files to lint and scan
        default: .
      use-tflint:
        required: false
        type: boolean
        description: Use TFLint linter
        default: true
      use-trivy:
        required: false
        type: boolean
        description: Use Trivy vulnerability scanner
        default: true
      trivy-scanners:
        required: false
        type: string
        description: List of scanners to use
        default: vuln,secret,misconfig
      trivy-severity:
        required: false
        type: string
        description: Severity levels to fail the scan
        default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      trivy-ignore-unfixed:
        required: false
        type: boolean
        description: Ignore unpatched/unfixed vulnerabilities
        default: true
      trivy-exit-code:
        required: false
        type: number
        description: Exit code for pre-build scan
        default: 1
      trivy-config:
        required: false
        type: string
        description: Path to a Trivy config file
        default: null
      trivy-timeout:
        required: false
        type: string
        description: Timeout for the Trivy scan
        default: 5m0s
      trivy-report-artifact-name:
        required: false
        type: string
        description: Unique name for the Trivy report artifact; omit to skip the report upload
        default: null
      merge-pr:
        required: false
        type: boolean
        description: Whether to merge the pull request
        default: true
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
    secrets:
      GH_TOKEN:
        required: false
        description: >-
          GitHub token. Use a dedicated PAT or GitHub App token if branch
          protection requires PR approval; the default GITHUB_TOKEN cannot
          approve PRs created by the same token.
permissions:
  contents: read
  pull-requests: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
env:
  GH_TELEMETRY: 'false'
jobs:
  terraform-lock-pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update-type: ${{ steps.dependabot-metadata.outputs.update-type }}
      lockfile-only: ${{ steps.validate-changes.outputs.lockfile-only }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      EXPECTED_HEAD_BRANCH_PREFIX: ${{ inputs.merge-pr-head-branch-prefix }}
      MERGE_PR_AUTHOR_ALLOWLIST: ${{ inputs.merge-pr-author-allowlist }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
    steps:
      - name: Verify the dependency pull request identity
        run: |
          if [[ -z "${EXPECTED_HEAD_BRANCH_PREFIX}" || "${PR_HEAD_REF}" != "${EXPECTED_HEAD_BRANCH_PREFIX}"* ]]; then
            echo "::error::Unexpected dependency PR branch: ${PR_HEAD_REF}"
            exit 1
          fi
          if [[ "${PR_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "::error::Cross-repository dependency PRs are not supported"
            exit 1
          fi
          allowed=false
          IFS=',' read -r -a authors <<< "${MERGE_PR_AUTHOR_ALLOWLIST}"
          for author in "${authors[@]}"; do
            author="${author#"${author%%[![:space:]]*}"}"
            author="${author%"${author##*[![:space:]]}"}"
            if [[ -n "${author}" && "${PR_AUTHOR}" == "${author}" ]]; then
              allowed=true
              break
            fi
          done
          if [[ "${allowed}" != true ]]; then
            echo "::error::Untrusted dependency PR author: ${PR_AUTHOR}"
            exit 1
          fi
      - name: Read the trusted base branch Dependabot configuration
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .github
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/dependabot.yml?ref=${PR_BASE_SHA}" \
            --jq '.content' | base64 --decode > .github/dependabot.yml
      - name: Fetch Dependabot metadata
        if: env.PR_AUTHOR == 'dependabot[bot]'
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ env.GH_TOKEN }}
          skip-verification: true
      - name: Validate the configured Terraform dependency update
        id: validate-changes
        env:
          PACKAGE_ECOSYSTEM: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
          DEPENDABOT_DIRECTORY: ${{ steps.dependabot-metadata.outputs.directory }}
          TERRAFORM_WORKING_DIRECTORIES: ${{ inputs.terraform-working-directories }}
          TERRAGRUNT_WORKING_DIRECTORIES: ${{ inputs.terragrunt-working-directories }}
          TERRAFORM_VERSION_MAP: ${{ inputs.terraform-working-directory-to-version-tf-json }}
        run: |
          if [[ "${PR_AUTHOR}" == 'dependabot[bot]' && "${PACKAGE_ECOSYSTEM}" != terraform ]]; then
            echo "::error::This Dependabot PR is not a Terraform dependency update"
            exit 1
          fi
          changed_files="$(mktemp)"
          gh pr diff "${PR_URL}" --name-only > "${changed_files}"
          if [[ ! -s "${changed_files}" ]]; then
            echo "::error::Dependency PR diff is empty"
            exit 1
          fi
          ruby -ryaml -rjson -e '
            def directory(path)
              File.expand_path(path.sub(%r{\A/}, ""), Dir.pwd)
            end
            def inside?(path, root)
              path == root || path.start_with?("#{root}/")
            end
            abort "Missing .github/dependabot.yml" unless File.file?(".github/dependabot.yml")
            config = YAML.safe_load_file(".github/dependabot.yml")
            updates = config.fetch("updates", []).select { |entry| entry["package-ecosystem"] == "terraform" }
            abort "No Terraform ecosystem configured in dependabot.yml" if updates.empty?
            managed_dirs = updates.flat_map { |entry| entry["directories"] || [entry["directory"]] }.compact
            abort "No Terraform directories configured in dependabot.yml" if managed_dirs.empty?
            managed_manifest = lambda do |path|
              parts = File.dirname(path).split("/")
              ancestors = (0..parts.length).map { |n| parts.take(n).join("/") }
              managed_dirs.any? do |pattern|
                ancestors.any? do |dir|
                  File.fnmatch?(pattern.sub(%r{\A/}, "").sub(%r{/+\z}, ""), dir, File::FNM_PATHNAME)
                end
              end
            end
            requested_dir = ENV.fetch("DEPENDABOT_DIRECTORY", "")
            if ENV.fetch("PR_AUTHOR") == "dependabot[bot]" && !requested_dir.empty?
              match = managed_dirs.any? { |d| File.fnmatch?(d.sub(%r{/+\z}, ""), requested_dir.sub(%r{/+\z}, ""), File::FNM_PATHNAME) }
              abort "Dependabot directory is not configured for Terraform: #{requested_dir}" unless match
            end
            lock_roots = if !ENV.fetch("TERRAFORM_VERSION_MAP", "").empty?
              JSON.parse(ENV.fetch("TERRAFORM_VERSION_MAP")).keys
            elsif !ENV.fetch("TERRAGRUNT_WORKING_DIRECTORIES", "").empty?
              ENV.fetch("TERRAGRUNT_WORKING_DIRECTORIES").split
            else
              ENV.fetch("TERRAFORM_WORKING_DIRECTORIES").split
            end
            lock_roots = lock_roots.map { |d| directory(d) }
            abort "No lockfile directories configured" if lock_roots.empty?
            paths = File.readlines(ARGV.fetch(0), chomp: true)
            paths.each do |path|
              full_path = directory(path)
              abort "Unsafe path: #{path}" unless inside?(full_path, Dir.pwd)
              if File.basename(path) == ".terraform.lock.hcl"
                valid = lock_roots.any? { |root| inside?(full_path, root) } || managed_manifest.call(path)
              elsif path.end_with?(".tf") || path.end_with?(".tf.json") || File.basename(path) == "terragrunt.hcl"
                valid = managed_manifest.call(path)
              else
                valid = false
              end
              abort "Unexpected Terraform dependency PR file: #{path}" unless valid
            end
            puts "Validated #{paths.length} dependency PR files against dependabot.yml"
          ' "${changed_files}"
          if grep -qvE '(^|/)\.terraform\.lock\.hcl$' "${changed_files}"; then
            echo "lockfile-only=false" >> "${GITHUB_OUTPUT}"
          else
            echo "lockfile-only=true" >> "${GITHUB_OUTPUT}"
          fi
          rm -f "${changed_files}"
  terraform-lock-pr-upgrade:
    if: >
      always() && (github.event_name != 'pull_request'
      || needs.terraform-lock-pr-check.result == 'success')
    needs:
      - terraform-lock-pr-check
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/terraform-lock-files-upgrade.yml
    with:
      terraform-working-directories: ${{ inputs.terraform-working-directories }}
      terraform-working-directory-to-version-tf-json: ${{ inputs.terraform-working-directory-to-version-tf-json }}
      terragrunt-working-directories: ${{ inputs.terragrunt-working-directories }}
      terraform-version: ${{ inputs.terraform-version }}
      terragrunt-version: ${{ inputs.terragrunt-version }}
      create-pr: false
      upgrade-providers: ${{ github.event_name != 'pull_request' || needs.terraform-lock-pr-check.outputs.lockfile-only != 'true' }}
      runs-on: ${{ inputs.runs-on }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
  terraform-lock-pr-lint:
    needs:
      - terraform-lock-pr-upgrade
    permissions:
      contents: write
      actions: read
      security-events: write
    uses: $/.github/workflows/terraform-lint-and-scan.yml
    with:
      search-path: ${{ inputs.search-path-for-lint-and-scan }}
      terraform-version: ${{ inputs.terraform-version }}
      terragrunt-version: ${{ inputs.terragrunt-version }}
      terraform-validate: false
      use-tflint: ${{ inputs.use-tflint }}
      use-trivy: ${{ inputs.use-trivy }}
      trivy-scanners: ${{ inputs.trivy-scanners }}
      trivy-severity: ${{ inputs.trivy-severity }}
      trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      trivy-exit-code: ${{ inputs.trivy-exit-code }}
      trivy-config: ${{ inputs.trivy-config }}
      trivy-timeout: ${{ inputs.trivy-timeout }}
      trivy-report-artifact-name: ${{ inputs.trivy-report-artifact-name }}
      runs-on: ${{ inputs.runs-on }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
  terraform-lock-pr-merge:
    if: >
      github.event_name == 'pull_request'
      && inputs.merge-pr
      && inputs.merge-pr-author-allowlist != null
      && inputs.merge-pr-author-allowlist != ''
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.pull_request.user.login != 'dependabot[bot]'
      || needs.terraform-lock-pr-check.outputs.update-type == 'version-update:semver-patch'
      || needs.terraform-lock-pr-check.outputs.update-type == 'version-update:semver-minor')
    needs:
      - terraform-lock-pr-check
      - terraform-lock-pr-lint
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-slim
    env:
      EXPECTED_HEAD_BRANCH_PREFIX: ${{ inputs.merge-pr-head-branch-prefix }}
      MERGE_PR_AUTHOR_ALLOWLIST: ${{ inputs.merge-pr-author-allowlist }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
    steps:
      - name: Validate automation pull request
        run: |
          if [[ -z "${EXPECTED_HEAD_BRANCH_PREFIX}" ]]; then
            echo "::error::merge-pr-head-branch-prefix must not be empty"
            exit 1
          elif [[ "${PR_HEAD_REF}" != "${EXPECTED_HEAD_BRANCH_PREFIX}"* ]]; then
            echo "::error::Pull request branch '${PR_HEAD_REF}' does not match '${EXPECTED_HEAD_BRANCH_PREFIX}'"
            exit 1
          elif [[ "${PR_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "::error::Pull request head repository '${PR_HEAD_REPOSITORY}' is not '${GITHUB_REPOSITORY}'"
            exit 1
          elif [[ -z "${MERGE_PR_AUTHOR_ALLOWLIST}" ]]; then
            echo "::error::merge-pr-author-allowlist must not be empty when merge-pr is true"
            exit 1
          fi

          allowed=false
          IFS=',' read -r -a allowed_authors <<< "${MERGE_PR_AUTHOR_ALLOWLIST}"
          for author in "${allowed_authors[@]}"; do
            author="${author#"${author%%[![:space:]]*}"}"
            author="${author%"${author##*[![:space:]]}"}"
            if [[ "${PR_AUTHOR}" == "${author}" ]]; then
              allowed=true
              break
            fi
          done
          if [[ "${allowed}" != true ]]; then
            echo "::error::Pull request author '${PR_AUTHOR}' is not in merge-pr-author-allowlist"
            exit 1
          fi
      - name: Verify the current pull request and checks
        run: |
          current="$(gh pr view "${PR_URL}" --json author,headRefName,headRefOid,isDraft,mergeStateStatus,state)"
          jq -e --arg author "${PR_AUTHOR}" --arg ref "${PR_HEAD_REF}" \
            '.state == "OPEN" and .isDraft == false and .author.login == $author and .headRefName == $ref' \
            <<< "${current}" > /dev/null
          if [[ "$(jq -r '.mergeStateStatus' <<< "${current}")" == DIRTY ]]; then
            echo "::error::Pull request has merge conflicts"
            exit 1
          fi
          changed_files="$(mktemp)"
          gh pr diff "${PR_URL}" --name-only > "${changed_files}"
          if [[ ! -s "${changed_files}" ]]; then
            echo "::error::Pull request diff is empty"
            exit 1
          fi
          while IFS= read -r path; do
            if [[ "${path}" != *.tf && "${path}" != *.tf.json && "${path}" != terragrunt.hcl && "${path}" != */terragrunt.hcl && "${path}" != .terraform.lock.hcl && "${path}" != */.terraform.lock.hcl ]]; then
              echo "::error::Unexpected dependency PR file: ${path}"
              exit 1
            fi
          done < "${changed_files}"
          echo "EXPECTED_HEAD_SHA=$(jq -r '.headRefOid' <<< "${current}")" >> "${GITHUB_ENV}"
      - name: Approve the pull request when the token can approve
        continue-on-error: true
        run: >
          gh pr review --approve "${PR_URL}"
      - name: Enable auto-merge after required checks and reviews
        run: >
          gh pr merge --auto --merge --delete-branch
          --match-head-commit "${EXPECTED_HEAD_SHA}" "${PR_URL}"
