---
# Deployment-time Cosign verification of an immutable image digest.
#
# Typical flow: build and sign with docker-build-and-push.yml (`push: true`, `cosign: true`, caller
# `permissions: id-token: write, packages: write, contents: write`), pass its `build-push-digest` output
# on to this workflow as image-ref `registry/name@sha256:...`, and only then deploy.
#
# Keyless signatures made by docker-build-and-push.yml carry the identity of that reusable workflow
# (not the caller's workflow) and the GitHub Actions OIDC issuer:
#   certificate-identity-regexp: ^https://github\.com/dceoy/gha-for-devops/\.github/workflows/docker-build-and-push\.yml@(refs/.+|[0-9a-f]{40})$
#   certificate-oidc-issuer:     https://token.actions.githubusercontent.com
# Identity and issuer are mandatory policy inputs: unsigned images and signatures from any other signer fail.
# Cosign signatures and BuildKit `provenance` do not by themselves establish SLSA compliance; see the
# trusted SLSA build/verification work tracked in #884, #885, #887, and #888.
name: Docker image signature verification
on:
  workflow_call:
    inputs:
      image-ref:
        type: string
        required: true
        description: Image reference pinned by digest (name@sha256:...); tags are rejected
      certificate-identity:
        type: string
        default: ""
        description: Exact expected signer identity (mutually exclusive with certificate-identity-regexp)
      certificate-identity-regexp:
        type: string
        default: ""
        description: Anchored regular expression for the expected signer identity
      certificate-oidc-issuer:
        type: string
        default: https://token.actions.githubusercontent.com
        description: Expected OIDC issuer of the signing certificate
      registry:
        type: string
        default: ""
        description: Registry to log in to before verification (private images)
      registry-user:
        type: string
        default: ${{ github.repository_owner }}
        description: Registry username
    secrets:
      DOCKER_TOKEN:
        required: false
        description: Registry token for private images
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate verification policy
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          IDENTITY: ${{ inputs.certificate-identity }}
          IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
          ISSUER: ${{ inputs.certificate-oidc-issuer }}
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ "${IMAGE_REF}" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]] || fail "image-ref must be pinned by digest (name@sha256:<64 hex>)."
          if [[ -n "${IDENTITY}" && -n "${IDENTITY_REGEXP}" ]]; then
            fail "Set only one of certificate-identity and certificate-identity-regexp."
          fi
          [[ -n "${IDENTITY}" || -n "${IDENTITY_REGEXP}" ]] || fail "An expected signer identity is required."
          if [[ -n "${IDENTITY_REGEXP}" ]]; then
            [[ "${IDENTITY_REGEXP}" =~ ^\^.*\$$ ]] || fail "certificate-identity-regexp must be anchored with ^ and \$."
          fi
          [[ "${ISSUER}" =~ ^https://[^[:space:]]+$ ]] || fail "certificate-oidc-issuer must be an https URL."
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Login to the Docker registry
        if: inputs.registry != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-user }}
          password: ${{ secrets.DOCKER_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
      - name: Verify the image signature
        id: cosign
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          IDENTITY: ${{ inputs.certificate-identity }}
          IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
          ISSUER: ${{ inputs.certificate-oidc-issuer }}
        shell: bash
        run: |
          set -euo pipefail
          args=(verify --certificate-oidc-issuer "${ISSUER}")
          if [[ -n "${IDENTITY}" ]]; then
            args+=(--certificate-identity "${IDENTITY}")
          else
            args+=(--certificate-identity-regexp "${IDENTITY_REGEXP}")
          fi
          cosign "${args[@]}" "${IMAGE_REF}"
          echo "Verified ${IMAGE_REF}" >> "${GITHUB_STEP_SUMMARY}"
