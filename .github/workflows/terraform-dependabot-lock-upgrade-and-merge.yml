---
name: Terraform Dependabot lockfile upgrade and merge
on:
  workflow_call:
    inputs:
      terraform-working-directories:
        required: false
        type: string
        description: Terraform working directories (separated by spaces or returns)
        default: .
      terraform-working-directory-to-version-tf-json:
        required: false
        type: string
        description: JSON object with Terraform working directories as keys and Terraform version files as values
        default: null
      terragrunt-working-directories:
        required: false
        type: string
        description: Terragrunt working directories (separated by spaces or returns)
        default: null
      terraform-version:
        required: false
        type: string
        description: Terraform version to use
        default: latest
      terragrunt-version:
        required: false
        type: string
        description: Terragrunt version to use
        default: latest
      search-path-for-lint-and-scan:
        required: false
        type: string
        description: Path to search for files to lint and scan
        default: .
      use-tflint:
        required: false
        type: boolean
        description: Use TFLint linter
        default: true
      use-trivy:
        required: false
        type: boolean
        description: Use Trivy vulnerability scanner
        default: true
      trivy-scanners:
        required: false
        type: string
        description: List of scanners to use
        default: vuln,secret,misconfig
      trivy-severity:
        required: false
        type: string
        description: Severity levels to fail the scan
        default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      trivy-ignore-unfixed:
        required: false
        type: boolean
        description: Ignore unpatched/unfixed vulnerabilities
        default: true
      trivy-exit-code:
        required: false
        type: number
        description: Exit code for pre-build scan
        default: 1
      trivy-config:
        required: false
        type: string
        description: Path to a Trivy config file
        default: null
      trivy-timeout:
        required: false
        type: string
        description: Timeout for the Trivy scan
        default: 5m0s
      trivy-report-artifact-name:
        required: false
        type: string
        description: Unique name for the Trivy report artifact; omit to skip the report upload
        default: null
      merge-pr:
        required: false
        type: boolean
        description: Whether to merge the pull request
        default: true
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
    secrets:
      GH_TOKEN:
        required: false
        description: >-
          GitHub token. Use a dedicated PAT or GitHub App token if branch
          protection requires PR approval; the default GITHUB_TOKEN cannot
          approve PRs created by the same token.
permissions:
  contents: read
  pull-requests: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
env:
  GH_TELEMETRY: 'false'
jobs:
  terraform-lock-pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update-type: ${{ steps.dependabot-metadata.outputs.update-type }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
    steps:
      - name: Verify the Dependabot Terraform pull request
        run: |
          if [[ "${PR_AUTHOR}" != 'dependabot[bot]' || "${PR_HEAD_REF}" != dependabot/terraform/* ]]; then
            echo "::error::Expected a Terraform pull request authored by Dependabot"
            exit 1
          fi
          if [[ "${PR_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "::error::Cross-repository Dependabot PRs are not supported"
            exit 1
          fi
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ env.GH_TOKEN }}
      - name: Verify Terraform dependency PR files
        env:
          PACKAGE_ECOSYSTEM: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
        run: |
          if [[ "${PACKAGE_ECOSYSTEM}" != terraform ]]; then
            echo "::error::Not a Terraform dependency update"
            exit 1
          fi
          changed_files="$(gh pr diff "${PR_URL}" --name-only)"
          if [[ -z "${changed_files}" ]] || grep -vE '(^|/)([^/]+\.tf(\.json)?|terragrunt\.hcl|\.terraform\.lock\.hcl)$' <<< "${changed_files}"; then
            echo "::error::Unexpected or empty Terraform dependency diff"
            exit 1
          fi
  terraform-lock-pr-upgrade:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/terraform-lock-files-upgrade.yml
    with:
      terraform-working-directories: ${{ inputs.terraform-working-directories }}
      terraform-working-directory-to-version-tf-json: ${{ inputs.terraform-working-directory-to-version-tf-json }}
      terragrunt-working-directories: ${{ inputs.terragrunt-working-directories }}
      terraform-version: ${{ inputs.terraform-version }}
      terragrunt-version: ${{ inputs.terragrunt-version }}
      create-pr: false
      runs-on: ${{ inputs.runs-on }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
  terraform-lock-pr-lint:
    if: >-
      always() && ((github.event_name == 'pull_request'
      && needs.terraform-lock-pr-check.result == 'success')
      || (github.event_name != 'pull_request'
      && needs.terraform-lock-pr-upgrade.result == 'success'))
    needs:
      - terraform-lock-pr-check
      - terraform-lock-pr-upgrade
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: $/.github/workflows/terraform-lint-and-scan.yml
    with:
      search-path: ${{ inputs.search-path-for-lint-and-scan }}
      terraform-version: ${{ inputs.terraform-version }}
      terragrunt-version: ${{ inputs.terragrunt-version }}
      terraform-lockfile-readonly: ${{ github.event_name == 'pull_request' }}
      use-tflint: ${{ inputs.use-tflint }}
      use-trivy: ${{ inputs.use-trivy }}
      trivy-scanners: ${{ inputs.trivy-scanners }}
      trivy-severity: ${{ inputs.trivy-severity }}
      trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      trivy-exit-code: ${{ inputs.trivy-exit-code }}
      trivy-config: ${{ inputs.trivy-config }}
      trivy-timeout: ${{ inputs.trivy-timeout }}
      trivy-report-artifact-name: ${{ inputs.trivy-report-artifact-name }}
      runs-on: ${{ inputs.runs-on }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
  terraform-lock-pr-merge:
    if: >
      github.event_name == 'pull_request'
      && inputs.merge-pr
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && startsWith(github.event.pull_request.head.ref, 'dependabot/terraform/')
      && github.event.pull_request.head.repo.full_name == github.repository
      && (needs.terraform-lock-pr-check.outputs.update-type == 'version-update:semver-patch'
      || needs.terraform-lock-pr-check.outputs.update-type == 'version-update:semver-minor')
    needs:
      - terraform-lock-pr-check
      - terraform-lock-pr-lint
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-slim
    env:
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
    steps:
      - name: Verify the current pull request and checks
        run: |
          current="$(gh pr view "${PR_URL}" --json author,headRefName,headRefOid,isDraft,mergeStateStatus,state)"
          jq -e --arg author "${PR_AUTHOR}" --arg ref "${PR_HEAD_REF}" \
            '.state == "OPEN" and .isDraft == false and .author.login == $author and .headRefName == $ref' \
            <<< "${current}" > /dev/null
          if [[ "$(jq -r '.headRefOid' <<< "${current}")" != "${PR_HEAD_SHA}" ]]; then
            echo "::notice::PR head changed; wait for CI on the new commit"
            exit 0
          fi
          if [[ "$(jq -r '.mergeStateStatus' <<< "${current}")" == DIRTY ]]; then
            echo "::error::Pull request has merge conflicts"
            exit 1
          fi
          echo "EXPECTED_HEAD_SHA=${PR_HEAD_SHA}" >> "${GITHUB_ENV}"
      - name: Approve the pull request when the token can approve
        continue-on-error: true
        run: >
          gh pr review --approve "${PR_URL}"
      - name: Enable auto-merge after required checks and reviews
        run: >
          gh pr merge --auto --merge --delete-branch
          --match-head-commit "${EXPECTED_HEAD_SHA}" "${PR_URL}"
