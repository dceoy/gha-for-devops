---
# Explicit trusted-event publication; ordinary security scans remain read-only.
name: Submit dependencies to GitHub Dependency Graph
on:
  workflow_call:
    inputs:
      scan-type:
        type: string
        default: filesystem
        description: Dependency inventory target (filesystem or image)
      scan-ref:
        type: string
        default: .
        description: Directory to inventory in filesystem mode
      image-ref:
        type: string
        default: ""
        description: Image to inventory in image mode
      image-artifact-name:
        type: string
        default: ""
        description: Optional current-run artifact containing <name>.tar
      registry:
        type: string
        default: ""
      registry-user:
        type: string
        default: ${{ github.repository_owner }}
      snapshot-correlator:
        type: string
        required: true
        description: Stable unique key per inventory target; do not include changing digests
    secrets:
      DOCKER_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  submit:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Validate publication request
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCAN_TYPE: ${{ inputs.scan-type }}
          IMAGE_REF: ${{ inputs.image-ref }}
          IMAGE_ARTIFACT_NAME: ${{ inputs.image-artifact-name }}
          SNAPSHOT_CORRELATOR: ${{ inputs.snapshot-correlator }}
        shell: bash
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            push | schedule | workflow_dispatch) ;;
            *) echo '::error::Dependency submission requires a trusted push, schedule, or workflow_dispatch event.'; exit 1 ;;
          esac
          case "${SCAN_TYPE}" in
            filesystem) ;;
            image) [[ -n "${IMAGE_REF}" ]] || { echo '::error::image-ref is required.'; exit 1; } ;;
            *) echo '::error::scan-type must be filesystem or image.'; exit 1 ;;
          esac
          if [[ -n "${IMAGE_ARTIFACT_NAME}" ]]; then
            [[ "${SCAN_TYPE}" == image && "${IMAGE_ARTIFACT_NAME}" =~ ^[a-zA-Z0-9_-][a-zA-Z0-9_.-]*$ ]] || {
              echo '::error::Image artifacts require image mode and a simple artifact name.'
              exit 1
            }
          fi
          [[ -n "${SNAPSHOT_CORRELATOR}" ]] || { echo '::error::snapshot-correlator is required.'; exit 1; }
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download image tarball
        if: inputs.image-artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.image-artifact-name }}
          path: ${{ runner.temp }}/dependency-image
      - name: Load image tarball
        if: inputs.image-artifact-name != ''
        env:
          IMAGE_TAR: ${{ runner.temp }}/dependency-image/${{ inputs.image-artifact-name }}.tar
        shell: bash
        run: docker load -i "${IMAGE_TAR}"
      - name: Login to image registry
        if: inputs.scan-type == 'image' && inputs.registry != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-user }}
          password: ${{ secrets.DOCKER_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
      - name: Generate dependency snapshot
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: 'true'
          TRIVY_SKIP_VERSION_CHECK: 'true'
        with:
          scan-type: ${{ inputs.scan-type }}
          scan-ref: ${{ inputs.scan-ref }}
          image-ref: ${{ inputs.image-ref }}
          scanners: vuln
          format: github
          list-all-pkgs: true
          exit-code: 0
          output: ${{ runner.temp }}/dependency-snapshot.json
      - name: Submit dependency snapshot
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_FILE: ${{ runner.temp }}/dependency-snapshot.json
          SNAPSHOT_CORRELATOR: ${{ inputs.snapshot-correlator }}
        shell: bash
        run: |
          set -euo pipefail
          jq --arg correlator "${SNAPSHOT_CORRELATOR}" '.job.correlator = $correlator' \
            "${SNAPSHOT_FILE}" > "${SNAPSHOT_FILE}.submit"
          curl --fail --silent --show-error --output /dev/null \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "@${SNAPSHOT_FILE}.submit" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots"
          echo 'Dependency snapshot submitted successfully.' >> "${GITHUB_STEP_SUMMARY}"
