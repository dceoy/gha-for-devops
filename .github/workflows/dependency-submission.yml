---
# Publish an already-generated dependency snapshot. Never rescan under write permissions.
name: Submit dependencies to GitHub Dependency Graph
on:
  workflow_call:
    inputs:
      snapshot-artifact-name:
        type: string
        required: true
permissions:
  contents: read
jobs:
  submit:
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download dependency snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.snapshot-artifact-name }}
          path: ${{ runner.temp }}/dependency-snapshot
      - name: Validate and submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ runner.temp }}/dependency-snapshot/dependency-snapshot.json
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.version == 0 and (.detector.name | type == "string") and
            (.job.correlator | type == "string" and length > 0) and
            (.manifests | type == "object")' "$SNAPSHOT" > /dev/null
          curl --fail-with-body --silent --show-error --retry 3 --output /dev/null \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "@$SNAPSHOT" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/snapshots"
          echo 'Dependency snapshot submitted successfully.' >> "$GITHUB_STEP_SUMMARY"
