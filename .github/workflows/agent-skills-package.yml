---
name: Package agent skills
on:
  workflow_call:
    inputs:
      skills-directory:
        required: false
        type: string
        description: Directory containing one subdirectory per skill
        default: skills
      release-tag:
        required: false
        type: string
        description: GitHub Release tag to attach skill archives to (defaults to release event tag)
        default: ''
      artifact-name:
        required: false
        type: string
        description: Prefix for individually uploaded skill ZIP artifacts
        default: agent-skills
      artifact-retention-days:
        required: false
        type: number
        description: Number of days to retain the artifacts
        default: 1
      artifact-overwrite:
        required: false
        type: boolean
        description: Overwrite existing per-skill artifacts with the same names
        default: true
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    outputs:
      artifact-names:
        description: JSON array of the per-skill Actions artifact names
        value: ${{ jobs.discover.outputs.artifact-names }}
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  discover:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      skills: ${{ steps.list.outputs.skills }}
      artifact-names: ${{ steps.list.outputs.artifact-names }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.release-tag || github.sha }}
          persist-credentials: false
      - name: Discover skills
        id: list
        env:
          SKILLS_DIRECTORY: ${{ inputs.skills-directory }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          workspace_abs="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          skills_abs="$(realpath -e -- "${SKILLS_DIRECTORY}")" || {
            echo "::error::skills-directory does not exist: ${SKILLS_DIRECTORY}"
            exit 1
          }

          case "${skills_abs}" in
            "${workspace_abs}" | "${workspace_abs}"/*) ;;
            *)
              echo "::error::skills-directory must resolve inside GITHUB_WORKSPACE"
              exit 1
              ;;
          esac

          if [[ ! -d "${skills_abs}" ]]; then
            echo "::error::skills-directory is not a directory: ${SKILLS_DIRECTORY}"
            exit 1
          fi

          shopt -s nullglob
          skill_files=("${skills_abs}"/*/SKILL.md)
          if (("${#skill_files[@]}" == 0)); then
            echo "::error::no skills found at ${SKILLS_DIRECTORY}/*/SKILL.md"
            exit 1
          fi

          skill_names=()
          for skill_file in "${skill_files[@]}"; do
            skill_name="$(basename -- "$(dirname -- "${skill_file}")")"
            if [[ ! "${skill_name}" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "::error::skill name is not artifact-safe: ${skill_name}"
              exit 1
            fi
            skill_names+=("${skill_name}")
          done

          skills_json="$(printf '%s\n' "${skill_names[@]}" | jq -Rsc 'split("\n")[:-1]')"
          artifact_names_json="$(printf '%s\n' "${skill_names[@]}" | jq -Rsc --arg prefix "${ARTIFACT_NAME}" 'split("\n")[:-1] | map("\($$prefix)-\(.)")')"
          printf 'skills=%s\n' "${skills_json}" >> "${GITHUB_OUTPUT}"
          printf 'artifact-names=%s\n' "${artifact_names_json}" >> "${GITHUB_OUTPUT}"
  package:
    needs: discover
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.discover.outputs.skills) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.release-tag || github.sha }}
          persist-credentials: false
      - name: Package skill
        env:
          SKILLS_DIRECTORY: ${{ inputs.skills-directory }}
          SKILL_NAME: ${{ matrix.skill }}
        run: |
          workspace_abs="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          skills_abs="$(realpath -e -- "${SKILLS_DIRECTORY}")" || {
            echo "::error::skills-directory does not exist: ${SKILLS_DIRECTORY}"
            exit 1
          }

          case "${skills_abs}" in
            "${workspace_abs}" | "${workspace_abs}"/*) ;;
            *)
              echo "::error::skills-directory must resolve inside GITHUB_WORKSPACE"
              exit 1
              ;;
          esac

          skill_dir="${skills_abs}/${SKILL_NAME}"
          skill_file="${skill_dir}/SKILL.md"
          if [[ ! -f "${skill_file}" || -L "${skill_dir}" ]]; then
            echo "::error::skill directory or SKILL.md not found: ${skill_dir}"
            exit 1
          fi

          dist_dir="${RUNNER_TEMP}/agent-skill-packages"
          mkdir -p -- "${dist_dir}"
          archive="${dist_dir}/${SKILL_NAME}.zip"

          symlink="$(find "${skill_dir}" -type l -print -quit)"
          if [[ -n "${symlink}" ]]; then
            echo "::error::skill contains a symbolic link, which is not portable: ${symlink}"
            exit 1
          fi

          (
            cd "${skills_abs}"
            zip -q -r -X "${archive}" -- "${SKILL_NAME}"
          )

          mapfile -t entries < <(unzip -Z1 "${archive}")
          if (("${#entries[@]}" == 0)); then
            echo "::error::empty archive generated for skill: ${SKILL_NAME}"
            exit 1
          fi

          has_skill_file=false
          for entry in "${entries[@]}"; do
            case "${entry}" in
              "${SKILL_NAME}/"*) ;;
              *)
                echo "::error::archive ${archive} contains entry outside ${SKILL_NAME}/: ${entry}"
                exit 1
                ;;
            esac
            if [[ "${entry}" == "${SKILL_NAME}/SKILL.md" ]]; then
              has_skill_file=true
            fi
          done

          if [[ "${has_skill_file}" != true ]]; then
            echo "::error::archive ${archive} does not contain ${SKILL_NAME}/SKILL.md"
            exit 1
          fi

          printf 'Packaged %s into %s\n' "${SKILL_NAME}" "${archive}"
      - name: Upload skill ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ format('{0}-{1}', inputs.artifact-name, matrix.skill) }}
          path: ${{ runner.temp }}/agent-skill-packages/${{ matrix.skill }}.zip
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
          overwrite: ${{ inputs.artifact-overwrite }}
          compression-level: 0
  attach-to-release:
    if: github.event_name == 'release' || inputs.release-tag != ''
    needs:
      - discover
      - package
    permissions:
      contents: write
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Download packaged skills
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: ${{ format('{0}-*', inputs.artifact-name) }}
          merge-multiple: true
          path: ${{ runner.temp }}/agent-skill-release-assets
      - name: Attach packaged skills to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          assets=("${RUNNER_TEMP}/agent-skill-release-assets"/*.zip)
          if (("${#assets[@]}" == 0)); then
            echo "::error::no packaged skill ZIPs found for release attachment"
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${REPOSITORY}" --clobber
