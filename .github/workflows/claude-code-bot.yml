---
name: Mention bot using Claude Code
on:
  # issue_comment:
  #   types:
  #     - created
  # pull_request_review_comment:
  #   types:
  #     - created
  # pull_request_review:
  #   types:
  #     - submitted
  # issues:
  #   types:
  #     - opened
  #     - assigned
  workflow_call:
    inputs:
      claude-args:
        required: false
        type: string
        description: Additional arguments to pass directly to Claude Code Action
        default: >-
          --allowedTools="Skill,Agent,Task,Read,Glob,Grep,WebFetch,WebSearch,Bash(git:*),Bash(gh:*),mcp__github_inline_comment__create_inline_comment"
          --model=opusplan
          --advisor=opus
      aws-role-to-assume:
        required: false
        type: string
        description: IAM role ARN to assume via GitHub OIDC for Amazon Bedrock access
        default: null
      aws-region:
        required: false
        type: string
        description: AWS region for Bedrock and OIDC credential configuration
        default: us-east-1
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
        description: OAuth token for Claude Code
      GH_TOKEN:
        required: false
        description: GitHub token for accessing the repository
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read  # Required for Claude to read CI results on PRs
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  authorize:
    if: >
      (
        github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
      ) || (
        github.event_name == 'issues'
        && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
      )
    permissions:
      contents: read
    runs-on: ${{ inputs.runs-on }}
    outputs:
      authorized: ${{ steps.permission.outputs.authorized }}
    steps:
      - name: Verify trigger author has repository write access
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_AUTHOR: ${{ github.event.comment.user.login || github.event.review.user.login || github.event.issue.user.login }}
        run: |
          response="${RUNNER_TEMP}/trigger-author-permission.json"
          status="$(
            curl --silent --show-error \
              --output "${response}" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/collaborators/${TRIGGER_AUTHOR}/permission"
          )"
          case "${status}" in
            200)
              permission="$(jq -er '.permission' "${response}")"
              ;;
            404)
              permission=none
              ;;
            *)
              echo "::error::Failed to determine repository permission for ${TRIGGER_AUTHOR}: HTTP ${status}." >&2
              exit 1
              ;;
          esac
          case "${permission}" in
            admin|write)
              echo 'authorized=true' >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo 'authorized=false' >> "${GITHUB_OUTPUT}"
              echo "::notice::Ignoring @claude request from ${TRIGGER_AUTHOR}: repository permission is ${permission}."
              ;;
          esac
  claude-code-bot:
    needs:
      - authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Set repository remote HEAD
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >
          git remote set-head origin "${DEFAULT_BRANCH}"
      - name: Prepare pinned Claude plugin marketplace
        env:
          CLAUDE_PLUGINS_REF: 340e33aef211d95769d252324854497af871dafe
        run: |
          marketplace="${RUNNER_TEMP}/claude-plugins-official"
          rm -rf "${marketplace}"
          git init --quiet "${marketplace}"
          git -C "${marketplace}" remote add origin https://github.com/anthropics/claude-plugins-official.git
          git -C "${marketplace}" fetch --depth=1 origin "${CLAUDE_PLUGINS_REF}"
          git -C "${marketplace}" checkout --quiet --detach "${CLAUDE_PLUGINS_REF}"
          test "$(git -C "${marketplace}" rev-parse HEAD)" = "${CLAUDE_PLUGINS_REF}"
      - name: Configure AWS credentials
        if: inputs.aws-role-to-assume != null
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: github-actions-${{ github.run_id }}
          output-credentials: true
          output-env-credentials: false
      - name: Run Claude Code
        uses: anthropics/claude-code-action@e2a4b761cd77a1138a5b41410eda9b28581f9bcd  # v1.0.196
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region }}
          CLAUDE_CODE_DISABLE_ADVISOR_TOOL: ${{ inputs.aws-role-to-assume != null && '1' || '' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_bedrock: ${{ inputs.aws-role-to-assume != null }}
          # Allow Claude to read CI results on PRs.
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'
          claude_args: ${{ inputs.aws-role-to-assume == null && format('{0} --permission-mode=auto', inputs.claude-args) || inputs.claude-args }}
          plugins: pr-review-toolkit@claude-plugins-official
          plugin_marketplaces: ${{ runner.temp }}/claude-plugins-official
