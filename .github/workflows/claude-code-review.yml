---
name: Pull request review using Claude Code
on:
  # pull_request:
  #   types:
  #     - opened
  #     - ready_for_review
  workflow_call:
    inputs:
      claude-args:
        required: false
        type: string
        description: Additional arguments to pass directly to Claude Code Action
        default: >-
          --allowedTools="Skill,Agent,Task,Read,Glob,Grep,WebFetch,WebSearch,Bash(git:*),Bash(gh:*),mcp__github_inline_comment__create_inline_comment"
          --model=opusplan
          --advisor=opus
      aws-role-to-assume:
        required: false
        type: string
        description: IAM role ARN to assume via GitHub OIDC for Amazon Bedrock access
        default: null
      aws-region:
        required: false
        type: string
        description: AWS region for Bedrock and OIDC credential configuration
        default: us-east-1
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
        description: OAuth token for Claude Code
      GH_TOKEN:
        required: false
        description: Optional GitHub token for checkout
permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  claude-code-review:
    if: >
      github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Prepare pinned Claude plugin marketplace
        env:
          CLAUDE_PLUGINS_REF: 340e33aef211d95769d252324854497af871dafe
        run: |
          marketplace="${RUNNER_TEMP}/pinned-pr-review-toolkit"
          rm -rf "${marketplace}"
          git init --quiet "${marketplace}"
          git -C "${marketplace}" remote add origin https://github.com/anthropics/claude-plugins-official.git
          git -C "${marketplace}" fetch --depth=1 origin "${CLAUDE_PLUGINS_REF}"
          git -C "${marketplace}" checkout --quiet --detach "${CLAUDE_PLUGINS_REF}"
          test "$(git -C "${marketplace}" rev-parse HEAD)" = "${CLAUDE_PLUGINS_REF}"
          manifest="${marketplace}/.claude-plugin/marketplace.json"
          jq '.name = "pinned-pr-review-toolkit"' "${manifest}" > "${manifest}.tmp"
          mv "${manifest}.tmp" "${manifest}"
      - name: Configure AWS credentials
        if: inputs.aws-role-to-assume != null
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: github-actions-${{ github.run_id }}
          output-credentials: true
          output-env-credentials: false
      - name: Run comprehensive PR review
        id: claude-review
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10  # v1.0.210
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region }}
          CLAUDE_CODE_DISABLE_ADVISOR_TOOL: ${{ inputs.aws-role-to-assume != null && '1' || '' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_bedrock: ${{ inputs.aws-role-to-assume != null }}
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: read
            actions: read
          prompt: |
            Review ${{ github.repository }} pull request #${{ github.event.pull_request.number }} comprehensively. Use `gh pr diff ${{ github.event.pull_request.number }}` as the authoritative PR diff instead of working-tree `git diff`.

            Run both review passes:
            - `pr-review-toolkit:review-pr` with `code comments tests errors types parallel`.
            - Claude Code's built-in `security-review`.

            Consolidate and deduplicate the results. Verify every finding against the current PR diff and relevant surrounding code. Report only actionable issues introduced by or materially affected by this PR; omit style-only, speculative, or already-fixed findings. Do not run code-simplifier or modify repository files.

            Publishing the review is a required part of this task, not an optional follow-up. After completing all analysis, publish line-specific findings as inline PR review comments using `mcp__github_inline_comment__create_inline_comment`, then publish exactly one concise top-level COMMENT review with the overall result using `gh pr review ${{ github.event.pull_request.number }} --comment`. If there are no findings, still publish a concise no-findings COMMENT review. Never approve, request changes, or use issue comments.

            Before returning your final response, verify the top-level review was actually created with `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews` and confirm the newest review has state `COMMENTED` and the expected review body. If the review is missing, publish it and verify again. Do not return a final response until publication is verified; if publication or verification fails, report the command failure rather than claiming the review succeeded.
          claude_args: ${{ inputs.aws-role-to-assume == null && format('{0} --permission-mode=auto', inputs.claude-args) || inputs.claude-args }}
          plugins: pr-review-toolkit@pinned-pr-review-toolkit
          plugin_marketplaces: ${{ runner.temp }}/pinned-pr-review-toolkit
      - name: Diagnose Claude Code failure
        if: always()
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          CLAUDE_REVIEW_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
          CLAUDE_REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
        run: |
          if [[ "${CLAUDE_REVIEW_OUTCOME}" == "success" && "${CLAUDE_REVIEW_CONCLUSION}" == "success" ]]; then
            exit 0
          fi

          if [[ -n "${CLAUDE_EXECUTION_FILE}" && -f "${CLAUDE_EXECUTION_FILE}" ]]; then
            jq -c '
              [ .[] | select(.type == "result") ]
              | last
              | {
                  subtype,
                  is_error,
                  api_error_status,
                  terminal_reason,
                  stop_reason,
                  errors
                }
            ' "${CLAUDE_EXECUTION_FILE}"
          fi
          exit 1
