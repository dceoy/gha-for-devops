---
name: Pull request review using Claude Code
on:
  # pull_request:
  #   types:
  #     - opened
  #     - ready_for_review
  workflow_call:
    inputs:
      claude-args:
        required: false
        type: string
        description: Additional arguments to pass directly to Claude Code Action
        default: >-
          --allowedTools="Skill,Agent,Task,Read,Glob,Grep,WebFetch,WebSearch,Bash(git:*),Bash(gh:*),mcp__github_inline_comment__create_inline_comment"
          --model=opusplan
          --advisor=opus
      aws-role-to-assume:
        required: false
        type: string
        description: IAM role ARN to assume via GitHub OIDC for Amazon Bedrock access
        default: null
      aws-region:
        required: false
        type: string
        description: AWS region for Bedrock and OIDC credential configuration
        default: us-east-1
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
        description: OAuth token for Claude Code
      GH_TOKEN:
        required: false
        description: GitHub token for accessing the repository
permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  claude-code-review:
    if: >
      github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Set repository remote HEAD
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: >
          git remote set-head origin "${BASE_BRANCH}"
      - name: Configure AWS credentials
        if: inputs.aws-role-to-assume != null
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: github-actions-${{ github.run_id }}
          output-credentials: true
          output-env-credentials: false
      - name: Run comprehensive PR review
        id: claude-review
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c  # v1.0.193
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region }}
          CLAUDE_CODE_DISABLE_ADVISOR_TOOL: ${{ inputs.aws-role-to-assume != null && '1' || '' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_bedrock: ${{ inputs.aws-role-to-assume != null }}
          prompt: |
            Review ${{ github.repository }} pull request #${{ github.event.pull_request.number }} comprehensively.

            Use the Skill tool to run both review passes:
            - `pr-review-toolkit:review-pr` with `all parallel` for comprehensive code review.
            - Claude Code's built-in `security-review` for security vulnerabilities.

            Treat all review passes as analysis-only: never modify repository files. Convert code-simplifier changes into inline `suggestion` blocks when practical.

            Consolidate and deduplicate the results. Verify every finding against the current PR diff and relevant surrounding code. Report only actionable issues introduced by or materially affected by this PR; omit style-only, speculative, or already-fixed findings.

            Prefer inline review comments for line-specific findings, using mcp__github_inline_comment__create_inline_comment whenever the changed line can be targeted. Do not use issue comments or `gh pr comment`.

            Do not submit a top-level pull request review yourself. After posting inline comments, return a structured result whose `review_body` briefly summarizes the actionable findings and their severity. If there are no actionable findings, `review_body` must explicitly state that no actionable issues were found. Never approve or request changes.
          claude_args: >-
            ${{ inputs.claude-args }}
            --json-schema '{"type":"object","properties":{"review_body":{"type":"string","minLength":1}},"required":["review_body"],"additionalProperties":false}'
            ${{ inputs.aws-role-to-assume == null && '--permission-mode=auto' || '' }}
          plugins: pr-review-toolkit@claude-plugins-official
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
      - name: Submit COMMENT review
        if: steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_MARKER: <!-- claude-code-review:${{ github.run_id }}-${{ github.run_attempt }} -->
          STRUCTURED_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          review_body="$(
            jq -er '.review_body | select(type == "string" and length > 0)' \
              <<< "${STRUCTURED_OUTPUT}"
          )"
          review_file="${RUNNER_TEMP}/claude-review-body.md"
          {
            printf '%s\n\n' "${review_body}"
            printf '%s\n' "${REVIEW_MARKER}"
          } > "${review_file}"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f event=COMMENT \
            -f commit_id="${PR_HEAD_SHA}" \
            -F body=@"${review_file}" \
            > /dev/null
      - name: Verify COMMENT review publication
        if: always() && steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_MARKER: <!-- claude-code-review:${{ github.run_id }}-${{ github.run_attempt }} -->
        run: |
          if ! gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            | jq -e \
              --arg marker "${REVIEW_MARKER}" \
              --arg head_sha "${PR_HEAD_SHA}" '
                add
                | map(
                    select(
                      .state == "COMMENTED"
                      and .commit_id == $head_sha
                      and ((.body // "") | contains($marker))
                    )
                  )
                | length == 1
              ' > /dev/null; then
            echo "::error::Failed to verify exactly one COMMENT review for ${PR_HEAD_SHA} with marker ${REVIEW_MARKER}"
            exit 1
          fi
      - name: Fail on Claude Code permission denials
        id: permission_denials
        if: always() && steps.claude-review.outcome == 'success'
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [[ -z "${CLAUDE_EXECUTION_FILE}" || ! -f "${CLAUDE_EXECUTION_FILE}" ]]; then
            echo "::error::Claude Code execution file not found: ${CLAUDE_EXECUTION_FILE}"
            exit 1
          else
            permission_denials="$(
              jq -c '
                [
                  .[]
                  | select(.type == "result")
                  | .permission_denials[]?
                ]
                | unique
              ' "${CLAUDE_EXECUTION_FILE}"
            )"
            if jq -e 'length > 0' <<< "${permission_denials}" > /dev/null; then
              echo "::group::Claude Code permission denials"
              jq -r '
                .[]
                | if type == "object" then
                    "tool: " + (.tool_name // .tool // .name // .tool_use.name // "unknown")
                    + "\ndetails: " + tojson
                  else
                    "tool: " + tostring
                  end
              ' <<< "${permission_denials}"
              echo "::endgroup::"
              while IFS= read -r tool; do
                tool="${tool//'%'/'%25'}"
                tool="${tool//$'\r'/'%0D'}"
                tool="${tool//$'\n'/'%0A'}"
                echo "::error title=Claude Code permission denied::${tool}"
              done < <(
                jq -r '
                  .[]
                  | if type == "object" then
                      .tool_name // .tool // .name // .tool_use.name // "unknown"
                    else
                      tostring
                    end
                ' <<< "${permission_denials}"
              )
              exit 1
            fi
          fi
