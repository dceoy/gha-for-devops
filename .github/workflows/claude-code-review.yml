---
name: Pull request review using Claude Code
on:
  # pull_request:
  #   types:
  #     - opened
  #     - ready_for_review
  workflow_call:
    inputs:
      claude-args:
        required: false
        type: string
        description: Additional arguments to pass directly to Claude Code Action
        default: >-
          --allowedTools="Skill,Agent,Task,Read,Glob,Grep,WebFetch,WebSearch,Bash(git:*),Bash(gh:*),mcp__github_inline_comment__create_inline_comment"
          --model=opusplan
          --advisor=opus
      aws-role-to-assume:
        required: false
        type: string
        description: IAM role ARN to assume via GitHub OIDC for Amazon Bedrock access
        default: null
      aws-region:
        required: false
        type: string
        description: AWS region for Bedrock and OIDC credential configuration
        default: us-east-1
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
        description: OAuth token for Claude Code
      GH_TOKEN:
        required: false
        description: GitHub token for accessing the repository
permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
env:
  # Identity that posts the review via `gh pr review --comment` from inside the
  # claude-code-action step (Claude's own GitHub App installation), used to keep
  # the marker match from being satisfiable by an unrelated actor/workflow.
  GH_REVIEW_AUTHOR: claude[bot]
jobs:
  claude-code-review:
    if: >
      github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Set repository remote HEAD
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: >
          git remote set-head origin "${BASE_BRANCH}"
      - name: Prepare pinned Claude plugin marketplace
        env:
          CLAUDE_PLUGINS_REF: 340e33aef211d95769d252324854497af871dafe
        run: |
          marketplace="${RUNNER_TEMP}/claude-plugins-official"
          rm -rf "${marketplace}"
          git init --quiet "${marketplace}"
          git -C "${marketplace}" remote add origin https://github.com/anthropics/claude-plugins-official.git
          git -C "${marketplace}" fetch --depth=1 origin "${CLAUDE_PLUGINS_REF}"
          git -C "${marketplace}" checkout --quiet --detach "${CLAUDE_PLUGINS_REF}"
          test "$(git -C "${marketplace}" rev-parse HEAD)" = "${CLAUDE_PLUGINS_REF}"
      - name: Configure AWS credentials
        if: inputs.aws-role-to-assume != null
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: github-actions-${{ github.run_id }}
          output-credentials: true
          output-env-credentials: false
      - name: Run comprehensive PR review
        id: claude-review
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c  # v1.0.193
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region }}
          CLAUDE_CODE_DISABLE_ADVISOR_TOOL: ${{ inputs.aws-role-to-assume != null && '1' || '' }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REVIEW_MARKER: <!-- claude-code-review:${{ github.run_id }}-${{ github.run_attempt }} -->
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_bedrock: ${{ inputs.aws-role-to-assume != null }}
          prompt: |
            Review ${{ github.repository }} pull request #${{ github.event.pull_request.number }} comprehensively and publish the review to GitHub.

            Use the Skill tool to run both review passes:
            - `pr-review-toolkit:review-pr` with `all parallel` for comprehensive code review.
            - Claude Code's built-in `security-review` for security vulnerabilities.

            Treat all review passes as analysis-only: never modify repository files. Convert code-simplifier changes into inline `suggestion` blocks when practical.

            Consolidate and deduplicate the results. Verify every finding against the current PR diff and relevant surrounding code. Report only actionable issues introduced by or materially affected by this PR; omit style-only, speculative, or already-fixed findings.

            Prefer inline review comments for line-specific findings, using mcp__github_inline_comment__create_inline_comment whenever the changed line can be targeted. Do not use issue comments or `gh pr comment`.

            After posting inline comments, always submit exactly one COMMENT review with `gh pr review --comment`. Briefly summarize the actionable findings and their severity; if there are none, explicitly state that no actionable issues were found. Include the exact HTML comment `<!-- claude-code-review:${{ github.run_id }}-${{ github.run_attempt }} -->` in the top-level review body. The task is not complete until that review command succeeds. Never approve or request changes.
          # Stop hook branch matrix (exit 0 = allow stop, exit 2 = force a retry turn):
          #   1. stop_hook_active is true (this is already a forced retry)        -> exit 0
          #   2. PR-head-SHA gh api call fails (network/rate-limit/auth)          -> exit 0
          #   3. PR head has advanced past this run's head                        -> exit 0
          #   4. reviews-list gh api call fails (network/rate-limit/auth)         -> exit 0
          #      (fail-closed for cases 2 and 4 is enforced by the separate
          #      "Verify COMMENT review publication" step below, not by this hook)
          #   5. a matching COMMENT review already exists                        -> exit 0
          #      (allowed to stop as soon as one exists; the downstream "Verify
          #      COMMENT review publication" step is the strict exactly-one gate)
          #   6. otherwise (no matching review yet)                              -> exit 2, retry once
          settings: |
            {
              "hooks": {
                "Stop": [
                  {
                    "hooks": [
                      {
                        "type": "command",
                        "command": "payload=\"$(cat)\"; if [ \"$(printf '%s' \"$payload\" | jq -r '.stop_hook_active // false')\" = \"true\" ]; then exit 0; fi; current_head=\"$(gh api \"repos/${GH_REPOSITORY}/pulls/${GH_PR_NUMBER}\" --jq .head.sha)\" || { printf '%s\\n' 'Unable to verify current PR head SHA; skipping stop-hook retry.' >&2; exit 0; }; if [ \"$current_head\" != \"${GH_PR_HEAD_SHA}\" ]; then printf '%s\\n' 'PR head has advanced past this run; skipping stop-hook retry.' >&2; exit 0; fi; reviews=\"$(gh api --paginate --slurp \"repos/${GH_REPOSITORY}/pulls/${GH_PR_NUMBER}/reviews\")\" || { printf '%s\\n' 'Unable to verify COMMENT review publication; skipping stop-hook retry.' >&2; exit 0; }; if printf '%s' \"$reviews\" | jq -e --arg marker \"$GH_REVIEW_MARKER\" --arg head_sha \"$GH_PR_HEAD_SHA\" --arg bot_login \"$GH_REVIEW_AUTHOR\" 'add | map(select(.user.login == $bot_login and .state == \"COMMENTED\" and .commit_id == $head_sha and ((.body // \"\") | contains($marker)))) | length > 0' > /dev/null; then exit 0; fi; printf '%s\\n' 'Required COMMENT review is still missing. Continue autonomously: submit exactly one top-level COMMENT review for this PR head with gh pr review --comment, include the required claude-code-review marker, and do not stop until the command succeeds.' >&2; exit 2"
                      }
                    ]
                  }
                ]
              }
            }
          claude_args: ${{ inputs.aws-role-to-assume == null && format('{0} --permission-mode=auto', inputs.claude-args) || inputs.claude-args }}
          plugins: pr-review-toolkit@claude-plugins-official
          plugin_marketplaces: ${{ runner.temp }}/claude-plugins-official
      - name: Verify COMMENT review publication
        if: always() && steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_MARKER: <!-- claude-code-review:${{ github.run_id }}-${{ github.run_attempt }} -->
        run: |
          if ! gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            | jq -e \
              --arg marker "${REVIEW_MARKER}" \
              --arg head_sha "${PR_HEAD_SHA}" \
              --arg bot_login "${GH_REVIEW_AUTHOR}" '
                add
                | map(
                    select(
                      .user.login == $bot_login
                      and .state == "COMMENTED"
                      and .commit_id == $head_sha
                      and ((.body // "") | contains($marker))
                    )
                  )
                | length == 1
              ' > /dev/null; then
            echo "::error::Failed to verify exactly one COMMENT review for ${PR_HEAD_SHA} with marker ${REVIEW_MARKER}"
            exit 1
          fi
      - name: Fail on Claude Code permission denials
        id: permission_denials
        if: always() && steps.claude-review.outcome == 'success'
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [[ -z "${CLAUDE_EXECUTION_FILE}" || ! -f "${CLAUDE_EXECUTION_FILE}" ]]; then
            echo "::error::Claude Code execution file not found: ${CLAUDE_EXECUTION_FILE}"
            exit 1
          else
            permission_denials="$(
              jq -c '
                [
                  .[]
                  | select(.type == "result")
                  | .permission_denials[]?
                ]
                | unique
              ' "${CLAUDE_EXECUTION_FILE}"
            )"
            if jq -e 'length > 0' <<< "${permission_denials}" > /dev/null; then
              echo "::group::Claude Code permission denials"
              jq -r '
                .[]
                | if type == "object" then
                    "tool: " + (.tool_name // .tool // .name // .tool_use.name // "unknown")
                    + "\ndetails: " + tojson
                  else
                    "tool: " + tostring
                  end
              ' <<< "${permission_denials}"
              echo "::endgroup::"
              while IFS= read -r tool; do
                tool="${tool//'%'/'%25'}"
                tool="${tool//$'\r'/'%0D'}"
                tool="${tool//$'\n'/'%0A'}"
                echo "::error title=Claude Code permission denied::${tool}"
              done < <(
                jq -r '
                  .[]
                  | if type == "object" then
                      .tool_name // .tool // .name // .tool_use.name // "unknown"
                    else
                      tostring
                    end
                ' <<< "${permission_denials}"
              )
              exit 1
            fi
          fi
