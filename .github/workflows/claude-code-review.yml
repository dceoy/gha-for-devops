---
name: Pull request review using Claude Code
on:
  # pull_request:
  #   types:
  #     - opened
  #     - ready_for_review
  workflow_call:
    inputs:
      claude-args:
        required: false
        type: string
        description: Additional arguments to pass directly to Claude Code Action
        default: >-
          --allowedTools="Skill,Agent,Task,Read,Glob,Grep,WebFetch,WebSearch,Bash(git:*),Bash(gh:*),mcp__github_inline_comment__create_inline_comment"
          --model=opusplan
          --advisor=opus
      aws-role-to-assume:
        required: false
        type: string
        description: IAM role ARN to assume via GitHub OIDC for Amazon Bedrock access
        default: null
      aws-region:
        required: false
        type: string
        description: AWS region for Bedrock and OIDC credential configuration
        default: us-east-1
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
        description: OAuth token for Claude Code
      GH_TOKEN:
        required: false
        description: GitHub token for accessing the repository
permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  claude-code-review:
    if: >
      github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Set repository remote HEAD
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: >
          git remote set-head origin "${BASE_BRANCH}"
      - name: Prepare pinned Claude plugin marketplace
        env:
          CLAUDE_PLUGINS_REF: 340e33aef211d95769d252324854497af871dafe
        run: |
          marketplace="${RUNNER_TEMP}/pinned-pr-review-toolkit"
          rm -rf "${marketplace}"
          git init --quiet "${marketplace}"
          git -C "${marketplace}" remote add origin https://github.com/anthropics/claude-plugins-official.git
          git -C "${marketplace}" fetch --depth=1 origin "${CLAUDE_PLUGINS_REF}"
          git -C "${marketplace}" checkout --quiet --detach "${CLAUDE_PLUGINS_REF}"
          test "$(git -C "${marketplace}" rev-parse HEAD)" = "${CLAUDE_PLUGINS_REF}"
          manifest="${marketplace}/.claude-plugin/marketplace.json"
          jq '.name = "pinned-pr-review-toolkit"' "${manifest}" > "${manifest}.tmp"
          mv "${manifest}.tmp" "${manifest}"
      - name: Configure AWS credentials
        if: inputs.aws-role-to-assume != null
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: github-actions-${{ github.run_id }}
          output-credentials: true
          output-env-credentials: false
      - name: Run comprehensive PR review
        id: claude-review
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c  # v1.0.193
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region }}
          CLAUDE_CODE_DISABLE_ADVISOR_TOOL: ${{ inputs.aws-role-to-assume != null && '1' || '' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_bedrock: ${{ inputs.aws-role-to-assume != null }}
          prompt: |
            Review ${{ github.repository }} pull request #${{ github.event.pull_request.number }} comprehensively.

            Use the Skill tool to run both review passes:
            - `pr-review-toolkit:review-pr` with `all parallel` for comprehensive code review.
            - Claude Code's built-in `security-review` for security vulnerabilities.

            Treat all review passes as analysis-only: never modify repository files. Convert code-simplifier changes into inline `suggestion` blocks when practical.

            Consolidate and deduplicate the results. Verify every finding against the current PR diff and relevant surrounding code. Report only actionable issues introduced by or materially affected by this PR; omit style-only, speculative, or already-fixed findings.

            Prefer inline review comments for line-specific findings, using mcp__github_inline_comment__create_inline_comment whenever the changed line can be targeted. Do not use issue comments or `gh pr comment`.

            Return a concise top-level review summary as the final response. The workflow publishes that summary as a COMMENT review. Never approve or request changes.
          claude_args: ${{ inputs.aws-role-to-assume == null && format('{0} --permission-mode=auto', inputs.claude-args) || inputs.claude-args }}
          plugins: pr-review-toolkit@pinned-pr-review-toolkit
          plugin_marketplaces: ${{ runner.temp }}/pinned-pr-review-toolkit
      - name: Ensure COMMENT review publication
        if: always() && steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_MARKER: <!-- claude-code-review:${{ github.run_id }}-${{ github.run_attempt }} -->
        run: |
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          if [[ "${current_head}" != "${PR_HEAD_SHA}" ]]; then
            echo "PR head advanced to ${current_head}; skipping review publication for ${PR_HEAD_SHA}."
            exit 0
          fi

          if [[ -z "${CLAUDE_EXECUTION_FILE}" || ! -f "${CLAUDE_EXECUTION_FILE}" ]]; then
            echo "::error::Claude Code execution file not found: ${CLAUDE_EXECUTION_FILE}"
            exit 1
          fi

          permission_denials="$(
            jq -c '
              [
                .[]
                | select(.type == "result")
                | .permission_denials[]?
              ]
              | unique
            ' "${CLAUDE_EXECUTION_FILE}"
          )"
          if jq -e 'length > 0' <<< "${permission_denials}" > /dev/null; then
            echo "::group::Claude Code permission denials"
            jq -r '
              .[]
              | if type == "object" then
                  "tool: " + (.tool_name // .tool // .name // .tool_use.name // "unknown")
                  + "\ndetails: " + tojson
                else
                  "tool: " + tostring
                end
            ' <<< "${permission_denials}"
            echo "::endgroup::"
            exit 1
          fi

          review_body="$(
            jq -r '
              [
                .[]
                | select(.type == "result" and .subtype == "success" and (.is_error | not))
                | .result // empty
              ]
              | last // empty
            ' "${CLAUDE_EXECUTION_FILE}"
          )"
          if [[ -z "${review_body}" ]]; then
            review_body='Claude Code review completed successfully. No top-level summary was returned.'
          fi

          body_file="${RUNNER_TEMP}/claude-comment-review.md"
          printf '%s\n\n%s\n' "${review_body}" "${REVIEW_MARKER}" > "${body_file}"
          payload_file="${RUNNER_TEMP}/claude-comment-review.json"
          jq -n \
            --rawfile body "${body_file}" \
            --arg commit_id "${PR_HEAD_SHA}" \
            '{event: "COMMENT", commit_id: $commit_id, body: $body}' \
            > "${payload_file}"
          created="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --input "${payload_file}")"
          if ! printf '%s' "${created}" \
            | jq -e \
              --arg marker "${REVIEW_MARKER}" \
              --arg head_sha "${PR_HEAD_SHA}" '
                .state == "COMMENTED"
                and .commit_id == $head_sha
                and ((.body // "") | contains($marker))
              ' > /dev/null; then
            echo "::error::Failed to publish COMMENT review for ${PR_HEAD_SHA}"
            exit 1
          fi
      - name: Diagnose Claude Code failure
        if: always() && steps.claude-review.outcome == 'failure'
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [[ -n "${CLAUDE_EXECUTION_FILE}" && -f "${CLAUDE_EXECUTION_FILE}" ]]; then
            jq -c '
              [ .[] | select(.type == "result") ]
              | last
              | {
                  subtype,
                  is_error,
                  api_error_status,
                  terminal_reason,
                  stop_reason,
                  errors
                }
            ' "${CLAUDE_EXECUTION_FILE}"
          fi
          exit 1
