---
# Optional SCA depth scan. cdxgen may invoke project tooling, so only trusted
# default-branch pushes, schedules, and explicitly dispatched runs are accepted.
# Do not invoke from pull_request_target or untrusted pull requests.
name: OWASP dep-scan
on:
  workflow_call:
    inputs:
      package-path:
        type: string
        default: .
        description: Repository-relative directory to scan
      report-artifact-name:
        type: string
        default: dep-scan-report
        description: Artifact name for raw OWASP dep-scan evidence (may contain private paths)
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  dep-scan:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # v6 CLI; digest-only to prevent automatic upgrades to incompatible v7.
      DEPSCAN_IMAGE: ghcr.io/owasp-dep-scan/depscan@sha256:085282708983374b216a9d75851898014fe5f6f244a706165b33405bcc3cd7e8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned dep-scan CLI
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            "${DEPSCAN_IMAGE}" depscan --src /app --help > /dev/null
      - name: Scan dependencies and reachability
        id: scan
        env:
          PACKAGE_PATH: ${{ inputs.package-path }}
        run: |
          if [[ ! "${PACKAGE_PATH}" =~ ^(\.|[[:alnum:]_.-]+(/[[:alnum:]_.-]+)*)$ ]] ||
             [[ "/${PACKAGE_PATH}/" == *"/../"* ]]; then
            echo "::error::package-path must be a repository-relative directory without parent traversal."
            exit 1
          fi
          if [[ ! "${DEPSCAN_IMAGE}" =~ ^ghcr\.io/owasp-dep-scan/depscan@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::dep-scan image must be pinned to an official GHCR image digest."
            exit 1
          fi
          scan_dir="$(realpath -e -- "${GITHUB_WORKSPACE}/${PACKAGE_PATH}")"
          if [[ ! -d "${scan_dir}" ]] ||
             [[ "${scan_dir}" != "${GITHUB_WORKSPACE}" && "${scan_dir}" != "${GITHUB_WORKSPACE}/"* ]]; then
            echo "::error::package-path must resolve to a directory inside the checkout."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/dep-scan-reports" "${RUNNER_TEMP}/dep-scan-cache"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            --mount "type=bind,source=${scan_dir},target=/app,readonly" \
            --mount "type=bind,source=${RUNNER_TEMP}/dep-scan-reports,target=/reports" \
            --mount "type=bind,source=${RUNNER_TEMP}/dep-scan-cache,target=/cache" \
            --env HOME=/cache \
            --env XDG_CACHE_HOME=/cache/.cache \
            --env VDB_HOME=/cache/vdb \
            --env CDXGEN_NO_BANNER=true \
            --workdir /app \
            "${DEPSCAN_IMAGE}" depscan \
              --src /app \
              --reports-dir /reports \
              --profile research \
              --lifecycle pre-build \
              --cdxgen-args=--no-install-deps \
              --csaf \
              --fail-on-error
          if [[ -z "$(find "${RUNNER_TEMP}/dep-scan-reports" -type f -print -quit)" ]]; then
            echo "::error::dep-scan produced no reports."
            exit 1
          fi
      - name: Upload scan evidence
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.report-artifact-name }}
          path: ${{ runner.temp }}/dep-scan-reports/
          retention-days: 7
          if-no-files-found: error
