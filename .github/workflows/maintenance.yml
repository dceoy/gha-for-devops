---
# Repository-specific maintenance. Public Scorecard publishing runs directly
# in an isolated job; the reusable assessment workflow stays read-only.
name: Repository maintenance
on:
  branch_protection_rule:
  push:
    branches:
      - main
  schedule:
    - cron: '15 0 * * 1'  # Mondays 09:15 JST (release and Scorecard)
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:Input selects the maintenance task; it does not control commands or code
    inputs:
      task:
        description: Maintenance task to run
        type: choice
        required: true
        default: patch-release
        options:
          - major-release
          - minor-release
          - patch-release
          - scorecard
          - renovate-pr
permissions: {}
concurrency:
  group: ${{ github.repository }}-maintenance-${{ github.event_name == 'workflow_dispatch' && inputs.task == 'renovate-pr' && 'dependency-update' || (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task != 'scorecard')) && 'release' || 'scorecard' }}
  cancel-in-progress: false
jobs:
  renovate-pr:
    if: >-
      github.repository == 'dceoy/gha-for-devops'
      && github.event_name == 'workflow_dispatch'
      && inputs.task == 'renovate-pr'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    uses: $/.github/workflows/renovate.yml
    with:
      allowed-unsafe-executions: '["mise"]'
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
  github-release:
    needs:
      - bats-tests
      - analysis
    if: >-
      !cancelled()
      && github.repository == 'dceoy/gha-for-devops'
      && ((github.event_name == 'schedule'
      && needs.bats-tests.result == 'success'
      && needs.analysis.result == 'success')
      || (github.event_name == 'workflow_dispatch'
      && inputs.task != 'scorecard'
      && inputs.task != 'renovate-pr'))
    permissions:
      contents: write
    uses: $/.github/workflows/github-release.yml
    with:
      version-bump: ${{ inputs.task || 'auto' }}
      release-trigger-paths: |
        .github/workflows/*.yml
        .github/workflows/*.yaml
        !.github/workflows/ai-agents.yml
        !.github/workflows/ci.yml
        !.github/workflows/maintenance.yml
      runs-on: ubuntu-slim
  major-version-tag:
    needs: github-release
    if: needs.github-release.result == 'success'
    permissions:
      contents: write
    uses: $/.github/workflows/github-major-version-tag.yml
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  bats-tests:
    permissions:
      contents: read
    if: github.repository == 'dceoy/gha-for-devops' && github.event_name == 'schedule'
    runs-on: ubuntu-slim
    defaults:
      run:
        shell: bash -euo pipefail {0}
        working-directory: .
    env:
      GH_TELEMETRY: 'false'
      MISE_USE_VERSIONS_HOST_TRACK: 'false'
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a  # v5.2.10
        with:
          auto_update: true
          install_args: actionlint yq gomplate trivy syft grype
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Set up Bats
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e  # 4.1.0
        with:
          github-token: ${{ github.token }}
      - name: Run Bats tests
        run: bats --print-output-on-failure .github/scripts/tests/*.bats
  analysis:
    if: >-
      github.repository == 'dceoy/gha-for-devops'
      && (github.event_name == 'push'
      || github.event_name == 'branch_protection_rule'
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.task == 'scorecard'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: results.sarif
