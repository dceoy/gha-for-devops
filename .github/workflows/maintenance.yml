---
# Repository-specific maintenance. Public Scorecard publishing runs directly
# in an isolated job; the reusable assessment workflow stays read-only.
name: Repository maintenance
on:
  branch_protection_rule:
  push:
    branches:
      - main
  schedule:
    - cron: '15 0 * * 1'  # Mondays 09:15 JST (release and Scorecard)
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:Input selects the maintenance task; it does not control commands or code
    inputs:
      task:
        description: Maintenance task to run
        type: choice
        required: true
        default: patch-release
        options:
          - major-release
          - minor-release
          - patch-release
          - scorecard
          - mise-lock-upgrade
permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-maintenance-${{ github.event_name == 'workflow_dispatch' && inputs.task == 'mise-lock-upgrade' && 'mise-lock-upgrade' || (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task != 'scorecard')) && 'release' || 'scorecard' }}
  cancel-in-progress: false
jobs:
  mise-lock-update:
    if: >-
      github.repository == 'dceoy/gha-for-devops'
      && github.event_name == 'workflow_dispatch'
      && inputs.task == 'mise-lock-upgrade'
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/mise-lock-update.yml
    with:
      runs-on: macos-latest
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
  github-release:
    needs:
      - bats-tests
      - analysis
    if: >-
      !cancelled()
      && github.repository == 'dceoy/gha-for-devops'
      && ((github.event_name == 'schedule'
      && needs.bats-tests.result == 'success'
      && needs.analysis.result == 'success')
      || (github.event_name == 'workflow_dispatch'
      && inputs.task != 'scorecard'
      && inputs.task != 'mise-lock-upgrade'))
    permissions:
      contents: write
    uses: $/.github/workflows/github-release.yml
    with:
      version-bump: ${{ inputs.task || 'auto' }}
      release-trigger-paths: |
        .github/workflows/*.yml
        .github/workflows/*.yaml
        !.github/workflows/ai-agents.yml
        !.github/workflows/ci.yml
        !.github/workflows/maintenance.yml
      runs-on: ubuntu-slim
  major-version-tag:
    needs: github-release
    if: needs.github-release.result == 'success'
    permissions:
      contents: write
    uses: $/.github/workflows/github-major-version-tag.yml
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  bats-tests:
    if: github.repository == 'dceoy/gha-for-devops' && github.event_name == 'schedule'
    runs-on: ubuntu-slim
    defaults:
      run:
        shell: bash -euo pipefail {0}
        working-directory: .
    env:
      GH_TELEMETRY: 'false'
      MISE_USE_VERSIONS_HOST_TRACK: 'false'
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        with:
          auto_update: true
          install_args: actionlint yq gomplate trivy syft grype
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Set up Bats
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e  # 4.1.0
        with:
          github-token: ${{ github.token }}
      - name: Run Bats tests
        run: bats --print-output-on-failure .github/scripts/tests/*.bats
  analysis:
    if: >-
      github.repository == 'dceoy/gha-for-devops'
      && (github.event_name == 'push'
      || github.event_name == 'branch_protection_rule'
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.task == 'scorecard'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26  # v4.39.2
        with:
          sarif_file: results.sarif
