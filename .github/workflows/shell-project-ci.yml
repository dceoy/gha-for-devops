---
name: Run shell project CI
on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
        description: Caller-provided QA command to run after installing pinned tools (ShellCheck, shfmt, actionlint, Bats, zizmor, yamllint, and Checkov)
      search-path:
        required: false
        type: string
        description: Relative path to run the command in
        default: .
      python-version:
        required: false
        type: string
        description: Python version used to run zizmor, yamllint, and Checkov
        default: '3.12'
      bats-version:
        required: false
        type: string
        description: Bats version to install
        # renovate: datasource=github-releases depName=bats-core/bats-core
        default: 1.14.0
      install-bats-libraries:
        required: false
        type: boolean
        description: Install bats-support, bats-assert, bats-detik, and bats-file
        default: false
      enable-cache:
        required: false
        type: boolean
        description: Cache pinned tool downloads
        default: true
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust tool caches
        default: null
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-slim
      timeout-minutes:
        required: false
        type: number
        description: Maximum duration of the CI job
        default: 15
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      UV_EXCLUDE_NEWER: 7 days
      # renovate: datasource=github-releases depName=koalaman/shellcheck
      SHELLCHECK_VERSION: v0.11.0
      # renovate: datasource=github-releases depName=mvdan/sh
      SHFMT_VERSION: v3.13.1
      # renovate: datasource=github-releases depName=rhysd/actionlint
      ACTIONLINT_VERSION: v1.7.12
      # renovate: datasource=pypi depName=zizmor versioning=pep440
      ZIZMOR_VERSION: 1.29.0
      # renovate: datasource=pypi depName=yamllint versioning=pep440
      YAMLLINT_VERSION: 1.38.0
      # renovate: datasource=pypi depName=checkov versioning=pep440
      CHECKOV_VERSION: 3.3.9
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate inputs
        env:
          SEARCH_PATH: ${{ inputs.search-path }}
          QA_COMMAND: ${{ inputs.command }}
          BATS_VERSION: ${{ inputs.bats-version }}
        run: |
          if [[ -z "${QA_COMMAND}" ]]; then
            echo "::error::command must not be empty"
            exit 1
          fi
          if [[ -z "${SEARCH_PATH}" || "${SEARCH_PATH}" == /* || "${SEARCH_PATH}" == ".." || "${SEARCH_PATH}" == ../* || "${SEARCH_PATH}" == */../* || "${SEARCH_PATH}" == */.. || "${SEARCH_PATH}" == *$'\n'* ]]; then
            echo "::error::search-path must be a relative path without parent-directory components or newlines"
            exit 1
          fi
          if [[ ! -d "${SEARCH_PATH}" ]]; then
            echo "::error::search-path does not exist: ${SEARCH_PATH}"
            exit 1
          fi
          if [[ ! "${BATS_VERSION}" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::bats-version must be a numeric release version"
            exit 1
          fi
      - name: Cache linter binaries
        if: inputs.enable-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/bin
          key: shell-project-ci-bin-${{ runner.os }}-${{ runner.arch }}-shellcheck-${{ env.SHELLCHECK_VERSION }}-shfmt-${{ env.SHFMT_VERSION }}-actionlint-${{ env.ACTIONLINT_VERSION }}-${{ inputs.cache-salt }}
      - name: Install ShellCheck if the pinned version is missing
        env:
          SHELLCHECK_VERSION: ${{ env.SHELLCHECK_VERSION }}
        run: |
          [[ "${SHELLCHECK_VERSION}" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::invalid SHELLCHECK_VERSION"; exit 1; }
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          current=""
          if [[ -x "${HOME}/.local/bin/shellcheck" ]]; then
            current="v$("${HOME}/.local/bin/shellcheck" --version | awk '/^version:/ {print $2}')" || true
          fi
          [[ "${current}" == "${SHELLCHECK_VERSION}" ]] && exit 0
          [[ "${RUNNER_OS}" == "Linux" ]] || { echo "::error::automatic ShellCheck installation requires Linux"; exit 1; }
          arch=x86_64
          [[ "${RUNNER_ARCH}" == "ARM64" ]] && arch=aarch64
          curl --fail --location --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.${arch}.tar.xz" \
            | tar -xJ --strip-components=1 -C "${RUNNER_TEMP}" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          install -m 0755 "${RUNNER_TEMP}/shellcheck" "${HOME}/.local/bin/shellcheck"
      - name: Install shfmt if the pinned version is missing
        env:
          SHFMT_VERSION: ${{ env.SHFMT_VERSION }}
        run: |
          [[ "${SHFMT_VERSION}" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::invalid SHFMT_VERSION"; exit 1; }
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          current=""
          if [[ -x "${HOME}/.local/bin/shfmt" ]]; then
            current="$("${HOME}/.local/bin/shfmt" --version)" || true
          fi
          [[ "${current}" == "${SHFMT_VERSION}" ]] && exit 0
          [[ "${RUNNER_OS}" == "Linux" ]] || { echo "::error::automatic shfmt installation requires Linux"; exit 1; }
          arch=amd64
          [[ "${RUNNER_ARCH}" == "ARM64" ]] && arch=arm64
          asset="shfmt_${SHFMT_VERSION}_linux_${arch}"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${asset}" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/${asset}"
          curl --fail --location --silent --show-error \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/sha256sums.txt" \
            | grep -F "  ${asset}" \
            | (cd "${RUNNER_TEMP}" && sha256sum --check --strict -)
          install -m 0755 "${RUNNER_TEMP}/${asset}" "${HOME}/.local/bin/shfmt"
      - name: Install actionlint if the pinned version is missing
        env:
          ACTIONLINT_VERSION: ${{ env.ACTIONLINT_VERSION }}
        run: |
          # shellcheck disable=SC2153
          [[ "${ACTIONLINT_VERSION}" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::invalid ACTIONLINT_VERSION"; exit 1; }
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          current=""
          if [[ -x "${HOME}/.local/bin/actionlint" ]]; then
            current="v$("${HOME}/.local/bin/actionlint" --version | head -n1)" || true
          fi
          [[ "${current}" == "${ACTIONLINT_VERSION}" ]] && exit 0
          [[ "${RUNNER_OS}" == "Linux" ]] || { echo "::error::automatic actionlint installation requires Linux"; exit 1; }
          arch=amd64
          [[ "${RUNNER_ARCH}" == "ARM64" ]] && arch=arm64
          actionlint_version="${ACTIONLINT_VERSION#v}"
          asset="actionlint_${actionlint_version}_linux_${arch}.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${asset}" \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${asset}"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${actionlint_version}_checksums.txt" \
            | grep -F "  ${asset}" \
            | (cd "${RUNNER_TEMP}" && sha256sum --check --strict -)
          tar -xz -C "${HOME}/.local/bin" -f "${RUNNER_TEMP}/${asset}" actionlint
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: ${{ inputs.enable-cache }}
          cache-suffix: shell-project-ci-${{ inputs.cache-salt }}
      - name: Provide Python QA tool wrappers
        env:
          ZIZMOR_VERSION: ${{ env.ZIZMOR_VERSION }}
          YAMLLINT_VERSION: ${{ env.YAMLLINT_VERSION }}
          CHECKOV_VERSION: ${{ env.CHECKOV_VERSION }}
        run: | # zizmor: ignore[adhoc-packages] wrappers run pinned Python QA tools through uvx
          mkdir -p "${HOME}/.local/bin"
          create_wrapper() {
            local tool="$1" version="$2"
            [[ "${version}" =~ ^[0-9]+(\.[0-9]+)*([._+-][A-Za-z0-9]+)*$ ]] || { echo "::error::invalid pinned Python QA tool version: ${version}"; exit 1; }
            cat > "${HOME}/.local/bin/${tool}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec uvx --from "${tool}==${version}" "${tool}" "\$@"
          EOF
            chmod 0755 "${HOME}/.local/bin/${tool}"
          }
          create_wrapper zizmor "${ZIZMOR_VERSION}"
          create_wrapper yamllint "${YAMLLINT_VERSION}"
          create_wrapper checkov "${CHECKOV_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Set up Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          bats-version: ${{ inputs.bats-version }}
          support-install: ${{ inputs.install-bats-libraries }}
          assert-install: ${{ inputs.install-bats-libraries }}
          detik-install: ${{ inputs.install-bats-libraries }}
          file-install: ${{ inputs.install-bats-libraries }}
      - name: Run the caller-provided QA command
        working-directory: ${{ inputs.search-path }}
        env:
          QA_COMMAND: ${{ inputs.command }}
        run: |
          qa_command_script="$(mktemp)"
          printf '%s\n' "${QA_COMMAND}" > "${qa_command_script}"
          bash -euo pipefail "${qa_command_script}"
          dirty="$(git -C "${GITHUB_WORKSPACE}" status --porcelain --untracked-files=no)"
          if [[ -n "${dirty}" ]]; then
            echo "::error::the QA command modified tracked files; run it locally and commit the results before pushing"
            echo "${dirty}"
            exit 1
          fi
