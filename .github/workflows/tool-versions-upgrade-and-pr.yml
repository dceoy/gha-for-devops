---
name: Upgrade mise, uv, and pnpm tool versions
on:
  workflow_call:
    inputs:
      uv-packages:
        type: string
        default: ""
        description: Space-separated Python packages whose exact pins should be upgraded
      runs-on:
        type: string
        default: ubuntu-latest
        description: GitHub Actions runner to use
    secrets:
      GH_TOKEN:
        required: false
        description: GitHub token for creating pull requests
permissions:
  contents: write
  pull-requests: write
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  upgrade-and-pr:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3
        with:
          install: false
          cache: false
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 11
          run_install: false
      - name: Upgrade mise versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise trust mise.toml
          mise upgrade --bump --local
          mise lock --bump
      - name: Upgrade Python dependencies
        env:
          UV_PACKAGES: ${{ inputs.uv-packages }}
        run: |
          if [[ -n "${UV_PACKAGES}" ]]; then
            read -r -a packages <<< "${UV_PACKAGES}"
            uv add --upgrade --bounds exact --no-sync "${packages[@]}"
          fi
          uv lock --upgrade
          uv lock --check
      - name: Upgrade pnpm dependencies and Node.js
        run: |
          node_major="$(jq -r '.devEngines.runtime.version | match("[0-9]+").string' package.json)"
          pnpm runtime set node "${node_major}"
          pnpm update --latest --ignore-scripts
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          branch: chore/update-tool-versions
          delete-branch: true
          add-paths: |
            mise.toml
            mise.lock
            pyproject.toml
            uv.lock
            package.json
            pnpm-lock.yaml
          commit-message: "chore: update mise, uv, and pnpm tool versions"
          title: "chore: update mise, uv, and pnpm tool versions"
          body: |
            Automated tool version updates in both specifications and lockfiles.
            Review compatibility and required CI checks before merging.
