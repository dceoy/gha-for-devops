---
name: Formatting for Markdown
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for Markdown files
        default: .
      update-readme:
        required: false
        type: boolean
        description: Regenerate README.md before creating the formatting pull request
        default: false
      node-version:
        required: false
        type: string
        description: Node.js version to use
        default: latest
      use-prettier:
        required: false
        type: boolean
        description: Use Prettier to format Markdown files
        default: true
      prettier-glob:
        required: false
        type: string
        description: Glob pattern for Prettier to format
        default: '**/*.{md,mdx}'
      use-oxfmt:
        required: false
        type: boolean
        description: Use Oxfmt to format Markdown files
        default: false
      oxfmt-glob:
        required: false
        type: string
        description: Glob pattern for Oxfmt to format
        default: '**/*.{md,markdown,mdx}'
      use-biome:
        required: false
        type: boolean
        description: Use Biome to format Markdown files when supported
        default: false
      biome-glob:
        required: false
        type: string
        description: Glob pattern for Biome to check and write
        default: '**/*.{md,mdx}'
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-slim
    secrets:
      GH_TOKEN:
        required: false
        description: Optional PAT or GitHub App token; PRs created with the default GITHUB_TOKEN generally do not trigger caller CI workflows
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: formatter-markdown-${{ github.repository }}-${{ inputs.search-path }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
  queue: max  # Keep up to 100 pending formatter runs instead of replacing pending work
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
env:
  MISE_USE_VERSIONS_HOST_TRACK: 'false'
jobs:
  format-and-pr:
    runs-on: ${{ inputs.runs-on }}
    env:
      npm_config_min_release_age: '7'
      # renovate: datasource=npm depName=prettier
      PRETTIER_VERSION: 3.9.6
      # renovate: datasource=npm depName=oxfmt
      OXFMT_VERSION: 0.73.0
      # renovate: datasource=github-releases depName=jdx/mise
      MISE_VERSION: 2026.8.5
      # renovate: datasource=npm depName=@biomejs/biome
      BIOME_VERSION: 2.5.6
    steps:
      - name: Validate formatter inputs
        if: (! inputs.use-prettier) && (! inputs.use-oxfmt) && (! inputs.use-biome)
        run: |
          echo '::error::At least one of use-prettier, use-oxfmt, or use-biome must be true'
          exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Set up mise
        if: inputs.update-readme
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: yq gomplate
      - name: Provide Prettier wrapper
        if: inputs.update-readme
        env:
          PRETTIER_VERSION: ${{ env.PRETTIER_VERSION }}
        run: | # zizmor: ignore[adhoc-packages] wrapper runs pinned Prettier through npx
          [[ "${PRETTIER_VERSION}" =~ ^[0-9]+(\.[0-9]+)*([._+-][A-Za-z0-9]+)*$ ]] || { echo "invalid PRETTIER_VERSION"; exit 1; }
          mkdir -p "${HOME}/.local/bin"
          cat > "${HOME}/.local/bin/prettier" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec npx --yes "prettier@${PRETTIER_VERSION}" "\$@"
          EOF
          chmod 0755 "${HOME}/.local/bin/prettier"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Update README.md
        if: inputs.update-readme
        run: ./.github/scripts/update-readme.sh
      - name: Format Markdown files using Prettier
        if: inputs.use-prettier
        working-directory: ${{ inputs.search-path }}
        env:
          PRETTIER_GLOB: ${{ inputs.prettier-glob }}
        run: >  # zizmor: ignore[adhoc-packages] runs pinned Prettier through npx
          npx --yes "prettier@${PRETTIER_VERSION}" --write "${PRETTIER_GLOB}"
      - name: Format Markdown files using Oxfmt
        if: inputs.use-oxfmt
        working-directory: ${{ inputs.search-path }}
        env:
          OXFMT_GLOB: ${{ inputs.oxfmt-glob }}
        run: >  # zizmor: ignore[adhoc-packages] runs pinned Oxfmt through npx
          npx --yes "oxfmt@${OXFMT_VERSION}" --write --no-error-on-unmatched-pattern "${OXFMT_GLOB}"
      - name: Format Markdown files using Biome
        if: inputs.use-biome
        working-directory: ${{ inputs.search-path }}
        env:
          BIOME_GLOB: ${{ inputs.biome-glob }}
        run: >  # zizmor: ignore[adhoc-packages] runs pinned Biome through npx
          npx --yes "@biomejs/biome@${BIOME_VERSION}" format --write --files-ignore-unknown=true "${BIOME_GLOB}"
      - name: Require a PR-triggering token for README updates
        if: inputs.update-readme
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if ! git diff --quiet -- README.md && [[ -z "${GH_TOKEN}" ]]; then
            echo '::error::Set the GH_TOKEN repository secret to a GitHub App token or PAT before creating a README update PR.'
            exit 1
          fi
      - name: Create output parameters
        id: parameters
        env:
          USE_PRETTIER: ${{ inputs.use-prettier }}
          USE_OXFMT: ${{ inputs.use-oxfmt }}
          USE_BIOME: ${{ inputs.use-biome }}
          PR_BASE: ${{ github.head_ref || github.ref_name }}
          TARGET_PATH: ${{ inputs.search-path }}
        run: |
          formatters=()
          if ${USE_PRETTIER}; then
            formatters+=('prettier')
          fi
          if ${USE_OXFMT}; then
            formatters+=('oxfmt')
          fi
          if ${USE_BIOME}; then
            formatters+=('biome')
          fi
          if [[ "${#formatters[@]}" -gt 0 ]]; then
            formatter_text="$(IFS=', '; echo "${formatters[*]}")"
          else
            formatter_text='Markdown formatters'
          fi
          target_hash=$(printf '%s' "${TARGET_PATH}" | sha256sum | cut -c1-12)
          target_slug=$(printf '%s' "${TARGET_PATH}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_-]+#-#g; s#^-+|-+$##g; s#-+#-#g' | cut -c1-40)
          if [[ -z "${target_slug}" || "${target_slug}" == "." ]]; then
            target_slug=root
          fi
          target_id="${target_slug}-${target_hash}"
          {
            echo "commit_message=Reformat Markdown files using ${formatter_text}"
            echo "pr_base=${PR_BASE}"
            echo "pr_branch=github-actions/markdown/${target_id}/${PR_BASE}"
          } >> "${GITHUB_OUTPUT}"
      - name: Detect changed files and create a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          commit-message: ${{ steps.parameters.outputs.commit_message }}
          title: ${{ steps.parameters.outputs.commit_message }}
          branch: ${{ steps.parameters.outputs.pr_branch }}
          base: ${{ steps.parameters.outputs.pr_base }}
          labels: agent:github-actions
          body: |
            This PR contains the following updates:
            - ${{ steps.parameters.outputs.commit_message }}
            This PR has been generated by
            [${{ github.workflow_ref }}](https://github.com/${{ github.repository }}/).
          delete-branch: true
          draft: false  # Formatter PRs are opened ready for review; reviewers are not automatically requested
