---
name: Schema validation for JSON
on:
  workflow_call:
    inputs:
      search-path:
        required: false
        type: string
        description: Path to search for files
        default: .
      schema-file-name:
        required: false
        type: string
        description: JSON schema file name
        default: '*.schema.json'
      relative-path-from-schema-directory-to-data-files:
        required: false
        type: string
        description: Relative path from JSON schema directory to JSON data directory
        default: ./*.data.json
      node-version:
        required: false
        type: string
        description: Node.js version to use
        default: latest
      lint-before-validation:
        required: false
        type: boolean
        description: Whether to lint JSON files before validation
        default: true
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  lint:
    if: inputs.lint-before-validation
    uses: ./.github/workflows/json-lint.yml
    with:
      search-path: ${{ inputs.search-path }}
  validation:
    if: (! (failure() || cancelled()))
    needs:
      - lint
    runs-on: ${{ inputs.runs-on }}
    env:
      npm_config_min_release_age: '7'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Validate JSON files using ajv-cli
        env:
          SCHEMA_FILE_NAME: ${{ inputs.schema-file-name }}
          RELATIVE_PATH_FROM_SCHEMA_DIRECTORY_TO_DATA_FILES: ${{ inputs.relative-path-from-schema-directory-to-data-files }}
        working-directory: ${{ inputs.search-path }}
        run: | # zizmor: ignore[adhoc-packages] runs ajv-cli through npm exec
          reject_shell_metacharacters() {
            local label="${1}" value="${2}"
            case "${value}" in
              *'$'*|*'`'*|*';'*|*'|'*|*'&'*|*'<'*|'>'*)
                echo "Error: ${label} contains unsupported shell metacharacters"
                exit 1
                ;;
            esac
          }

          reject_shell_metacharacters "schema-file-name" "${SCHEMA_FILE_NAME}"
          reject_shell_metacharacters "relative-path-from-schema-directory-to-data-files" "${RELATIVE_PATH_FROM_SCHEMA_DIRECTORY_TO_DATA_FILES}"

          schema_glob="**/${SCHEMA_FILE_NAME}"
          git ls-files -z -- "${schema_glob}" \
            | while IFS= read -r -d '' schema; do
                (
                  cd "$(dirname "${schema}")"
                  npm exec --yes --package=ajv-cli -- \
                    ajv validate -s "$(basename "${schema}")" \
                    -d "${RELATIVE_PATH_FROM_SCHEMA_DIRECTORY_TO_DATA_FILES}"
                )
              done
