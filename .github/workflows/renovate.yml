---
name: Renovate pull request
on:
  workflow_call:
    inputs:
      renovate-version:
        required: false
        type: string
        description: Renovate image tag (latest or an explicit version)
        default: latest
      runs-on:
        required: false
        type: string
        description: Docker-capable GitHub Actions runner
        default: ubuntu-latest
      allowed-unsafe-executions:
        required: false
        type: string
        description: JSON array of Renovate unsafe execution identifiers (trusted repositories only)
        default: '[]'
    secrets:
      GH_TOKEN:
        required: false
        description: Optional GitHub token to trigger CI on Renovate-created PRs
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:inputs configure Renovate; no input is interpolated into workflow shell scripts
    inputs:
      renovate-version:
        required: false
        type: string
        description: Renovate image tag (latest or an explicit version)
        default: latest
      runs-on:
        required: false
        type: string
        description: Docker-capable GitHub Actions runner
        default: ubuntu-latest
      allowed-unsafe-executions:
        required: false
        type: string
        description: JSON array of Renovate unsafe execution identifiers (trusted repositories only)
        default: '[]'
permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  renovate:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084  # v46.3.13
        with:
          renovate-version: ${{ inputs.renovate-version }}
          token: ${{ secrets.GH_TOKEN || github.token }}  # zizmor: ignore[secrets-outside-env] optional caller token
          additional-env-list: |
            GH_TELEMETRY
            DO_NOT_TRACK
            OTEL_SDK_DISABLED
        env:
          GH_TELEMETRY: 'false'
          DO_NOT_TRACK: '1'
          OTEL_SDK_DISABLED: 'true'
          RENOVATE_PLATFORM: github
          RENOVATE_ENDPOINT: ${{ github.api_url }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: ${{ inputs.allowed-unsafe-executions }}
