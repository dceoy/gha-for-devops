---
name: Renovate OSS
on:
  workflow_call:
    inputs:
      renovate-version:
        required: false
        type: string
        description: Pinned Renovate version
        # renovate: datasource=github-releases depName=renovatebot/renovate
        default: 44.210.2
      runs-on:
        required: false
        type: string
        description: Docker-capable GitHub Actions runner
        default: ubuntu-latest
      dry-run:
        required: false
        type: boolean
        description: Exercise Renovate against the GitHub API without modifying the repository
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  renovate-check:
    if: >-
      inputs.dry-run && github.event_name != 'pull_request_target'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 45
    permissions:
      contents: read
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect Renovate changes
        if: github.event_name == 'pull_request'
        id: renovate-changes
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -Eq '^(\.github/workflows/renovate\.yml|\.github/renovate\.json|renovate\.json)$'; then
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
          fi
      - name: Run Renovate in read-only mode
        if: github.event_name != 'pull_request' || steps.renovate-changes.outputs.changed == 'true'
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc  # v46.3.12
        with:
          renovate-version: ${{ inputs.renovate-version }}
          token: ${{ github.token }}  # zizmor: ignore[secrets-outside-env] built-in workflow token
        env:
          RENOVATE_DRY_RUN: full
          RENOVATE_PLATFORM: github
          RENOVATE_ENDPOINT: ${{ github.api_url }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'false'
  renovate:
    if: >-
      !inputs.dry-run && github.event_name != 'pull_request'
      && github.event_name != 'pull_request_target'
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc  # v46.3.12
        with:
          renovate-version: ${{ inputs.renovate-version }}
          token: ${{ github.token }}  # zizmor: ignore[secrets-outside-env] built-in workflow token
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_ENDPOINT: ${{ github.api_url }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'false'
