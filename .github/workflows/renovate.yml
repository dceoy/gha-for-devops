---
name: Renovate OSS
on:
  workflow_call:
    inputs:
      renovate-version:
        required: false
        type: string
        description: Renovate image tag (latest or an explicit version)
        default: latest
      runs-on:
        required: false
        type: string
        description: Docker-capable GitHub Actions runner
        default: ubuntu-latest
      dry-run:
        required: false
        type: boolean
        description: Exercise Renovate against the GitHub API without modifying the repository
        default: true
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:manual dry-run input selects execution mode
    inputs:
      renovate-version:
        required: false
        type: string
        description: Renovate image tag (latest or an explicit version)
        default: latest
      runs-on:
        required: false
        type: string
        description: Docker-capable GitHub Actions runner
        default: ubuntu-latest
      dry-run:
        required: false
        type: boolean
        description: Exercise Renovate against the GitHub API without modifying the repository
        default: true
permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  renovate:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    timeout-minutes: 45
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Enable read-only integration run
        if: inputs.dry-run
        run: >
          printf '%s\n' 'RENOVATE_DRY_RUN=full' >> "${GITHUB_ENV}"
      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc  # v46.3.12
        with:
          renovate-version: ${{ inputs.renovate-version }}
          token: ${{ github.token }}  # zizmor: ignore[secrets-outside-env] built-in workflow token
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_ENDPOINT: ${{ github.api_url }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'false'
