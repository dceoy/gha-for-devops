---
name: Renovate OSS
on:
  workflow_call:
    inputs:
      renovate-version:
        required: false
        type: string
        description: Pinned Renovate version
        # renovate: datasource=github-releases depName=renovatebot/renovate
        default: 44.210.2
      runs-on:
        required: false
        type: string
        description: Docker-capable GitHub Actions runner
        default: ubuntu-latest
    secrets:
      RENOVATE_TOKEN:
        required: false
        description: GitHub PAT; omit when using a GitHub App
      RENOVATE_APP_ID:
        required: false
        description: GitHub App ID; supply with RENOVATE_APP_PRIVATE_KEY
      RENOVATE_APP_PRIVATE_KEY:
        required: false
        description: GitHub App private key; supply with RENOVATE_APP_ID
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  renovate:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Validate authentication
        id: auth
        env:
          PAT: ${{ secrets.RENOVATE_TOKEN }}
          APP_ID: ${{ secrets.RENOVATE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "${PAT}" ]]; then
            if [[ -n "${APP_ID}" || -n "${APP_PRIVATE_KEY}" ]]; then
              echo '::error::Provide either RENOVATE_TOKEN or a GitHub App credential pair, not both'
              exit 1
            fi
            echo 'use-app=false' >> "${GITHUB_OUTPUT}"
          elif [[ -n "${APP_ID}" && -n "${APP_PRIVATE_KEY}" ]]; then
            echo 'use-app=true' >> "${GITHUB_OUTPUT}"
          else
            echo '::error::Provide RENOVATE_TOKEN or both RENOVATE_APP_ID and RENOVATE_APP_PRIVATE_KEY'
            exit 1
          fi
      - name: Create GitHub App token
        if: steps.auth.outputs.use-app == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc  # v46.3.12
        with:
          renovate-version: ${{ inputs.renovate-version }}
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided token
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_ENDPOINT: ${{ github.api_url }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'false'
