---
name: Release on GitHub
on:
  workflow_call:
    inputs:
      tag-name:
        required: false
        type: string
        description: Git tag to create a release for
        default: null
      create-new-tag:
        required: false
        type: boolean
        description: Create a new tag if the input tag does not exist
        default: false
      bump:
        required: false
        type: string
        description: Optional SemVer increment (auto, major-release, minor-release, or patch-release)
        default: null
      release-paths:
        required: false
        type: string
        description: Newline-delimited paths that trigger automatic SemVer releases
        default: null
      required-ci-workflow:
        required: false
        type: string
        description: Workflow file name whose completed successful push run is required for SemVer releases
        default: null
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    outputs:
      release-tag:
        description: Release tag, empty if no release was needed
        value: ${{ jobs.github-release.outputs.release-tag }}
    secrets:
      GH_TOKEN:
        required: false
        description: GitHub token
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:workflow_dispatch inputs are required for release parameters
    inputs:
      tag-name:
        required: false
        type: string
        description: Git tag to create a release for
        default: null
      create-new-tag:
        required: false
        type: boolean
        description: Create a new tag if the input tag does not exist
        default: false
permissions:
  contents: write  # IMPORTANT: mandatory for making GitHub Releases
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
env:
  GH_TELEMETRY: 'false'
jobs:
  github-release:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      release-tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: ${{ inputs.bump && '0' || '1' }}
          persist-credentials: false
      - name: Validate release inputs
        env:
          TAG_NAME: ${{ inputs.tag-name }}
          RELEASE_BUMP: ${{ inputs.bump }}
          CREATE_NEW_TAG: ${{ inputs.create-new-tag }}
          REQUIRED_CI_WORKFLOW: ${{ inputs.required-ci-workflow }}
        run: |
          if [[ -n "${RELEASE_BUMP}" ]]; then
            if [[ -z "${REQUIRED_CI_WORKFLOW}" ]]; then
              echo '::error::SemVer releases require a CI workflow to verify before publishing.'
              exit 2
            fi
            if [[ -n "${TAG_NAME}" || "${CREATE_NEW_TAG}" == true ]]; then
              echo '::error::bump cannot be combined with tag-name or create-new-tag.'
              exit 2
            fi
            case "${RELEASE_BUMP}" in
              auto|major-release|minor-release|patch-release) ;;
              *)
                echo "::error::Invalid release bump: ${RELEASE_BUMP}"
                exit 2
                ;;
            esac
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ -n "${TAG_NAME}" && "${TAG_NAME}" != "${GITHUB_REF_NAME}" ]]; then
              echo "::error::Invalid tag: ${TAG_NAME} != ${GITHUB_REF_NAME}"
              exit 1
            fi
          elif [[ -z "${TAG_NAME}" ]]; then
            echo '::error::A tag-name is required for non-tag events without bump.'
            exit 2
          fi
      - name: Plan SemVer release
        if: inputs.bump
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_PATHS: ${{ inputs.release-paths }}
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/main || "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ]]; then
            echo '::error::SemVer releases require an exact main-branch checkout.'
            exit 1
          fi
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${main_sha}" != "${RELEASE_SHA}" ]]; then
            echo '::notice::main advanced; skipping the stale release.'
            exit 0
          fi
          previous_tag="$(gh release list --repo "${GITHUB_REPOSITORY}" --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
          if [[ ! "${previous_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Expected a latest stable SemVer release: ${previous_tag}"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if ! git merge-base --is-ancestor "${previous_tag}" "${RELEASE_SHA}"; then
            echo "::error::Latest release ${previous_tag} is not an ancestor of main."
            exit 1
          fi
          if [[ "$(git rev-parse "${previous_tag}^{commit}")" == "${RELEASE_SHA}" ]]; then
            if [[ "${RELEASE_BUMP}" == auto ]]; then
              echo '::notice::Current main has already been released.'
              exit 0
            fi
            # Manual reruns can restore missing release assets without bumping.
            tag="${previous_tag}"
          else
            case "${RELEASE_BUMP}" in
              major-release)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor-release)
                minor=$((minor + 1))
                patch=0
                ;;
              patch-release)
                patch=$((patch + 1))
                ;;
              auto)
                paths=()
                while IFS= read -r path; do
                  [[ -n "${path}" ]] && paths+=("${path}")
                done <<< "${RELEASE_PATHS}"
                if (("${#paths[@]}" == 0)); then
                  echo '::error::Automatic releases require at least one release path.'
                  exit 2
                fi
                if git diff --quiet "${previous_tag}" "${RELEASE_SHA}" -- "${paths[@]}"; then
                  echo '::notice::No changes to the configured release paths.'
                  exit 0
                else
                  status=$?
                  if ((status != 1)); then
                    echo "::error::git diff failed with status ${status}"
                    exit "${status}"
                  fi
                fi
                messages="$(git log --first-parent --format=%B "${previous_tag}..${RELEASE_SHA}")"
                if grep -Eq '^[[:space:]]*(\*[[:space:]]*)?[[:alnum:]_-]+(\([^)]*\))?!:|^[[:space:]]*(\*[[:space:]]*)?BREAKING[ -]CHANGE:' <<< "${messages}" ||
                  grep -Eq '^[[:space:]]*(\*[[:space:]]*)?feat(\([^)]*\))?:' <<< "${messages}"; then
                  minor=$((minor + 1))
                  patch=0
                else
                  patch=$((patch + 1))
                fi
                ;;
            esac
            tag="v${major}.${minor}.${patch}"
          fi
          {
            echo 'ready=true'
            echo "tag=${tag}"
            echo "previous-tag=${previous_tag}"
          } >> "${GITHUB_OUTPUT}"
      - name: Publish GitHub release
        id: publish
        if: >-
          !inputs.bump || steps.plan.outputs.ready == 'true'
        env:
          TAG_NAME: ${{ inputs.tag-name || steps.plan.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous-tag }}
          REQUIRED_CI_WORKFLOW: ${{ inputs.required-ci-workflow }}
          RELEASE_BUMP: ${{ inputs.bump }}
          CREATE_NEW_TAG: ${{ inputs.create-new-tag }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
        run: |
          tag="${TAG_NAME:-${GITHUB_REF_NAME}}"
          if [[ -n "${RELEASE_BUMP}" ]]; then
            if [[ ! "${REQUIRED_CI_WORKFLOW}" =~ ^[a-zA-Z0-9_.-]+\.ya?ml$ ]]; then
              echo "::error::Invalid CI workflow filename: ${REQUIRED_CI_WORKFLOW}"
              exit 2
            fi
            ci_url="${GITHUB_API_URL}/repos/${REPOSITORY}/actions/workflows/${REQUIRED_CI_WORKFLOW}/runs?branch=main&head_sha=${RELEASE_SHA}&event=push&per_page=1"
            if [[ -n "${CI_TOKEN}" ]]; then
              ci_json="$(gh api "${ci_url}")"
            else
              # Public repositories can read CI runs without raising GITHUB_TOKEN permissions.
              # Private callers must supply GH_TOKEN with Actions: read access.
              ci_json="$(curl --fail --silent --show-error --location --retry 3 \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' "${ci_url}")"
            fi
            ci_state="$(jq -r '[.workflow_runs[0].status // "missing", .workflow_runs[0].conclusion // "missing", .workflow_runs[0].head_sha // "missing"] | @tsv' <<< "${ci_json}")"
            if [[ "${ci_state}" != "$(printf 'completed\tsuccess\t%s' "${RELEASE_SHA}")" ]]; then
              echo "::error::Required CI ${REQUIRED_CI_WORKFLOW} has not succeeded for ${RELEASE_SHA}: ${ci_state}"
              exit 1
            fi
            main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "${main_sha}" != "${RELEASE_SHA}" ]]; then
              echo '::notice::main advanced during release planning; skipping publication.'
              exit 0
            fi
            latest_tag="$(gh release list --repo "${REPOSITORY}" --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
            if [[ "${latest_tag}" != "${PREVIOUS_TAG}" ]]; then
              echo '::error::Latest release changed during planning.'
              exit 1
            fi
            existing="$(gh api "repos/${REPOSITORY}/git/matching-refs/tags/${tag}" --jq ".[] | select(.ref == \"refs/tags/${tag}\") | [.object.type, .object.sha] | @tsv")"
            if [[ -n "${existing}" && "${existing}" != "$(printf 'commit\t%s' "${RELEASE_SHA}")" ]]; then
              echo "::error::Tag ${tag} already points to another object."
              exit 1
            fi
            if [[ -z "${existing}" ]]; then
              gh api "repos/${REPOSITORY}/git/refs" --method POST -f "ref=refs/tags/${tag}" -f "sha=${RELEASE_SHA}" > /dev/null
            fi
          fi
          if ! gh release view "${tag}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            if [[ -z "${RELEASE_BUMP}" && "${CREATE_NEW_TAG}" == true && "${GITHUB_REF}" != refs/tags/* ]]; then
              gh release create "${tag}" --repo "${REPOSITORY}" --generate-notes
            else
              gh release create "${tag}" --repo "${REPOSITORY}" --generate-notes --verify-tag
            fi
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
