---
name: Formatting for TypeScript
on:
  workflow_call:
    inputs:
      package-path:
        required: false
        type: string
        description: Path to a TypeScript project
        default: .
      node-version:
        required: false
        type: string
        description: Node.js version fallback (pnpm prefers package.json devEngines.runtime, then engines.node)
        default: latest
      pnpm-version:
        required: false
        type: string
        description: Optional pnpm version override
        default: ""
      enable-cache:
        required: false
        type: boolean
        description: Cache package-manager downloads (never project files or PR output)
        default: true
      cache-dependency-path:
        required: false
        type: string
        description: Lockfile used to scope the package-manager cache
        default: null
      use-biome:
        required: false
        type: boolean
        description: Use Biome to format and lint code
        default: true
      biome-glob:
        required: false
        type: string
        description: Glob pattern for Biome to check and write
        default: '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,css,scss}'
      use-oxlint:
        required: false
        type: boolean
        description: Use Oxlint to lint code
        default: true
      use-prettier:
        required: false
        type: boolean
        description: Use Prettier to format code
        default: false
      prettier-glob:
        required: false
        type: string
        description: Glob pattern for Prettier to format
        default: '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,css,scss,html,md}'
      use-eslint:
        required: false
        type: boolean
        description: Use ESLint to lint code
        default: false
      lint-before-pr:
        required: false
        type: boolean
        description: Run lint before creating a pull request
        default: true
      audit:
        required: false
        type: boolean
        description: Fix known security issues with the installed packages
        default: true
      additional-npm-packages:
        required: false
        type: string
        description: Additional NPM packages to install
        default: null
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-slim
    secrets:
      GH_TOKEN:
        required: false
        description: GitHub token
permissions:
  contents: write
  pull-requests: write
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  format-and-pr:
    runs-on: ${{ inputs.runs-on }}
    env:
      npm_config_min_release_age: '7'
      NPM_CONFIG_MINIMUM_RELEASE_AGE: '10080'
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: '10080'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Detect the package manager
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ ! -f package.json ]]; then
            echo 'package.json not found in the specified path.' >&2
            exit 1
          fi
          has_pnpm_version_source() {
            jq -e '
              def is_pnpm_manager: (type == "object") and (.name == "pnpm") and ((.version // "") != "");
              ((.packageManager // "") as $pm | if ($pm | type) == "string" then ($pm | test("^pnpm@.+")) else false end)
              or ((.devEngines.packageManager // null) | if type == "object" then is_pnpm_manager else false end)
            ' package.json > /dev/null 2>&1
          }
          {
            if [[ -f package-lock.json ]]; then
              echo 'PACKAGE_LOCK_FILE=package-lock.json'
              echo 'PACKAGE_MANAGER=npm'
            elif [[ -f pnpm-lock.yaml ]]; then
              echo 'PACKAGE_LOCK_FILE=pnpm-lock.yaml'
              echo 'PACKAGE_MANAGER=pnpm'
              if [[ -z "${PNPM_VERSION}" ]] && ! has_pnpm_version_source; then
                echo 'PNPM_VERSION=latest'
              fi
            elif [[ -f yarn.lock ]]; then
              echo 'yarn.lock is not supported. Use package-lock.json or pnpm-lock.yaml.' >&2
              exit 1
            else
              echo 'PACKAGE_LOCK_FILE='
              echo 'PACKAGE_MANAGER='
            fi
          } | tee -a "${GITHUB_ENV}"
      - name: Select pnpm setup and Node.js version
        id: pnpm-config
        if: env.PACKAGE_MANAGER == 'pnpm'
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version || env.PNPM_VERSION }}
          NODE_VERSION: ${{ inputs.node-version }}
        working-directory: ${{ inputs.package-path }}
        run: |
          selected="${PNPM_VERSION}"
          if [[ -z "${selected}" ]]; then
            selected="$(jq -r '
              if .devEngines.packageManager.name == "pnpm" then .devEngines.packageManager.version // ""
              else .packageManager // "" end
            ' package.json)"
          fi
          selected="${selected#pnpm@}"
          major=''
          if [[ "${selected}" =~ ([0-9]+) ]]; then
            major="${BASH_REMATCH[1]}"
          fi
          legacy=false
          if [[ -n "${major}" ]] && (( 10#${major} < 11 )); then
            legacy=true
          elif [[ "${major}" == 11 && "${RUNNER_OS}-${RUNNER_ARCH}" == macOS-X64 ]]; then
            legacy=true
          fi
          node_version="$(jq -r '
            . as $manifest
            | (.devEngines.runtime // [])
            | if type == "array" then . else [.] end
            | map(select(.name == "node"))
            | if length > 1 then error("Multiple Node.js runtime declarations")
              elif length == 1 then
                .[0].version | if type == "string" and length > 0 then .
                  else error("Node.js runtime.version must be a nonempty string") end
              else $manifest.engines.node // "" end
            | if type == "string" then . else error("engines.node must be a string") end
          ' package.json)"
          node_version="${node_version:-${NODE_VERSION}}"
          case "${node_version}" in
            node|stable|current|\*) node_version=latest ;;
            lts/\*) node_version=lts ;;
            lts/-*)
              offset="${node_version#lts/-}"
              if [[ ! "${offset}" =~ ^[0-9]+$ ]]; then
                echo "Invalid Node.js LTS offset: ${node_version}" >&2
                exit 1
              fi
              node_version="$(curl -fsSL https://nodejs.org/dist/index.json | jq -r --argjson offset "$((10#${offset}))" '[.[] | select(.lts) | .version | capture("^v(?<major>[0-9]+)\\.").major | tonumber] | unique | sort | reverse | .[$offset] // empty')"
              if [[ -z "${node_version}" ]]; then
                echo "Unable to resolve Node.js LTS selector: ${NODE_VERSION}" >&2
                exit 1
              fi
              ;;
            lts/*) node_version="${node_version#lts/}" ;;
          esac
          {
            echo "legacy=${legacy}"
            echo "node-version=${node_version}"
          } >> "${GITHUB_OUTPUT}"
      - name: Bootstrap Node.js for legacy pnpm on Intel macOS
        if: env.PACKAGE_MANAGER == 'pnpm' && steps.pnpm-config.outputs.legacy == 'true' && runner.os == 'macOS' && runner.arch == 'X64'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: latest
      - name: Setup pnpm and Node.js
        if: env.PACKAGE_MANAGER == 'pnpm' && steps.pnpm-config.outputs.legacy != 'true'
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024  # v3
        with:
          version: ${{ inputs.pnpm-version || env.PNPM_VERSION }}
          runtime: node@${{ steps.pnpm-config.outputs.node-version }}
          working-directory: ${{ inputs.package-path }}
          install: false
          cache: ${{ inputs.enable-cache }}
          cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/pnpm-lock.yaml', inputs.package-path) }}
      - name: Setup legacy pnpm
        if: env.PACKAGE_MANAGER == 'pnpm' && steps.pnpm-config.outputs.legacy == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: ${{ inputs.pnpm-version || env.PNPM_VERSION }}
          package_json_file: ${{ format('{0}/package.json', inputs.package-path) }}
          standalone: ${{ runner.os != 'macOS' || runner.arch != 'X64' }}
      - name: Record pnpm version on Intel macOS
        id: legacy-pnpm
        if: env.PACKAGE_MANAGER == 'pnpm' && steps.pnpm-config.outputs.legacy == 'true' && runner.os == 'macOS' && runner.arch == 'X64'
        run: |
          pnpm_version="$(pnpm --version)"
          echo "version=${pnpm_version}" >> "${GITHUB_OUTPUT}"
          echo "major=${pnpm_version%%.*}" >> "${GITHUB_OUTPUT}"
      - name: Setup Node.js for legacy pnpm
        if: env.PACKAGE_MANAGER == 'pnpm' && steps.pnpm-config.outputs.legacy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ steps.pnpm-config.outputs.node-version }}
          cache: ${{ inputs.enable-cache && steps.legacy-pnpm.outputs.major != '11' && 'pnpm' || '' }}
          cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/pnpm-lock.yaml', inputs.package-path) }}
      - name: Validate pnpm 11 Node.js runtime on Intel macOS
        if: steps.legacy-pnpm.outputs.major == '11'
        run: |
          node_version="$(node --version)"
          if [[ ! "${node_version}" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::error::Unable to identify the selected Node.js version: ${node_version}" >&2
            exit 1
          fi
          node_major="${BASH_REMATCH[1]}"
          node_minor="${BASH_REMATCH[2]}"
          if (( 10#${node_major} < 22 || (10#${node_major} == 22 && 10#${node_minor} < 13) )); then
            echo "::error::pnpm 11 on Intel macOS requires Node.js >=22.13.0; selected ${node_version}. Select a compatible Node.js runtime or use pnpm 10." >&2
            exit 1
          fi
      - name: Locate pnpm 11 store on Intel macOS
        id: pnpm11-store
        if: inputs.enable-cache && steps.legacy-pnpm.outputs.major == '11'
        run: |
          echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
          echo "node-version=$(node --version)" >> "${GITHUB_OUTPUT}"
      - name: Cache pnpm 11 store on Intel macOS
        if: inputs.enable-cache && steps.legacy-pnpm.outputs.major == '11'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pnpm11-store.outputs.path }}
          key: pnpm11-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.legacy-pnpm.outputs.version }}-${{ steps.pnpm11-store.outputs.node-version }}-${{ hashFiles(inputs.cache-dependency-path || format('{0}/pnpm-lock.yaml', inputs.package-path)) }}
          restore-keys: |
            pnpm11-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.legacy-pnpm.outputs.version }}-${{ steps.pnpm11-store.outputs.node-version }}-
      - name: Setup Node.js
        if: env.PACKAGE_MANAGER != 'pnpm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.enable-cache && env.PACKAGE_MANAGER == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/{1}', inputs.package-path, env.PACKAGE_LOCK_FILE) }}
      - name: Install dependencies
        env:
          ADDITIONAL_NPM_PACKAGES: ${{ inputs.additional-npm-packages }}
        working-directory: ${{ inputs.package-path }}
        run: | # zizmor: ignore[adhoc-packages] installs workflow-selected and caller-selected packages
          case "${PACKAGE_MANAGER:-}" in
            pnpm )
              pnpm install --frozen-lockfile
              pnpm add --save-dev \
                typescript \
                ${{ inputs.use-oxlint && 'oxlint' || '' }} \
                ${{ inputs.use-biome && 'biome' || '' }} \
                ${{ inputs.use-eslint && 'eslint @typescript-eslint/eslint-plugin @typescript-eslint/parser' || '' }} \
                ${{ inputs.use-prettier && 'prettier eslint-config-prettier' || '' }}
              ;;
            * )
              if [[ -f package-lock.json ]]; then
                npm ci
              else
                npm install
              fi
              npm install --save-dev \
                typescript \
                ${{ inputs.use-oxlint && 'oxlint' || '' }} \
                ${{ inputs.use-biome && 'biome' || '' }} \
                ${{ inputs.use-eslint && 'eslint @typescript-eslint/eslint-plugin @typescript-eslint/parser' || '' }} \
                ${{ inputs.use-prettier && 'prettier eslint-config-prettier' || '' }}
              ;;
          esac
          for p in $(tr ' ' '\n' <<< "${ADDITIONAL_NPM_PACKAGES}"); do
            if [[ -n "${p}" ]]; then
              case "${PACKAGE_MANAGER:-}" in
                pnpm )
                  pnpm add --save-dev "${p}"
                  ;;
                * )
                  npm install --save-dev "${p}"
                  ;;
              esac
            fi
          done
          echo "PATH=${PWD}/node_modules/.bin:${PATH}" >> "${GITHUB_ENV}"
      - name: Fix security vulnerabilities
        if: inputs.audit
        working-directory: ${{ inputs.package-path }}
        run: |
          case "${PACKAGE_MANAGER:-}" in
            pnpm )
              pnpm audit --fix
              pnpm install
              ;;
            npm )
              npm audit fix
              ;;
          esac
      - name: Format and lint the code using Biome
        if: inputs.use-biome
        working-directory: ${{ inputs.package-path }}
        env:
          BIOME_GLOB: ${{ inputs.biome-glob }}
        run: >
          biome check --write --files-ignore-unknown=true "${BIOME_GLOB}"
      - name: Format the code using Prettier
        if: inputs.use-prettier
        working-directory: ${{ inputs.package-path }}
        env:
          PRETTIER_GLOB: ${{ inputs.prettier-glob }}
        run: >
          prettier --write "${PRETTIER_GLOB}"
      - name: Lint the code using Oxlint
        if: inputs.use-oxlint && inputs.lint-before-pr
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ -f tsconfig.json ]]; then
            oxlint --fix --type-aware --tsconfig tsconfig.json .
          else
            oxlint --fix .
          fi
      - name: Lint the code using ESLint
        if: inputs.use-eslint && inputs.lint-before-pr
        working-directory: ${{ inputs.package-path }}
        run: >
          eslint --ext .js,.jsx,.mjs,.cjs,.ts,.tsx,.mts,.cts --fix --no-error-on-unmatched-pattern .
      - name: Create output parameters
        id: parameters
        env:
          USE_BIOME: ${{ inputs.use-biome }}
          USE_OXLINT: ${{ inputs.use-oxlint }}
          USE_PRETTIER: ${{ inputs.use-prettier }}
          USE_ESLINT: ${{ inputs.use-eslint }}
          PR_BASE: ${{ github.head_ref || github.ref_name }}
        run: |
          formatters=()
          if ${USE_BIOME}; then
            formatters+=('biome')
          fi
          if ${USE_OXLINT}; then
            formatters+=('oxlint')
          fi
          if ${USE_PRETTIER}; then
            formatters+=('prettier')
          fi
          if ${USE_ESLINT}; then
            formatters+=('eslint')
          fi
          if [[ "${#formatters[@]}" -gt 0 ]]; then
            formatter_text="$(IFS=', '; echo "${formatters[*]}")"
          else
            formatter_text='TypeScript formatters'
          fi
          {
            if [[ "${{ inputs.audit }}" == 'true' ]]; then
              echo "commit_message=Reformat TypeScript code using ${formatter_text} and fix security vulnerabilities"
            else
              echo "commit_message=Reformat TypeScript code using ${formatter_text}"
            fi
            echo "pr_base=${PR_BASE}"
            echo "pr_branch=github-actions/${PR_BASE}"
          } >> "${GITHUB_OUTPUT}"
      - name: Detect changed files and create a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          commit-message: ${{ steps.parameters.outputs.commit_message }}
          title: ${{ steps.parameters.outputs.commit_message }}
          branch: ${{ steps.parameters.outputs.pr_branch }}
          base: ${{ steps.parameters.outputs.pr_base }}
          labels: agent:github-actions
          body: |
            This PR contains the following updates:

            - ${{ steps.parameters.outputs.commit_message }}

            This PR has been generated by
            [${{ github.workflow_ref }}](https://github.com/${{ github.repository }}/).
          delete-branch: true
          draft: false
