---
name: Package script run for a TypeScript project
on:
  workflow_call:
    inputs:
      package-scripts:
        required: false
        type: string
        description: Script names defined in package.json to run (comma-separated)
        default: test
      package-path:
        required: false
        type: string
        description: Path to a TypeScript project
        default: .
      node-version:
        required: false
        type: string
        description: Node.js version to use
        default: latest
      pnpm-version:
        required: false
        type: string
        description: Optional pnpm version override
        default: ""
      enable-cache:
        required: false
        type: boolean
        description: Cache package-manager downloads
        default: true
      cache-dependency-path:
        required: false
        type: string
        description: Lockfile used to scope the package-manager cache
        default: null
      audit:
        required: false
        type: boolean
        description: Check known security issues with the installed packages
        default: false
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  script-run:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Detect the package manager
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        working-directory: ${{ inputs.package-path }}
        run: |
          has_pnpm_version_source() {
            jq -e '
              def is_pnpm_manager: (type == "object") and (.name == "pnpm") and ((.version // "") != "");
              ((.packageManager // "") as $pm | if ($pm | type) == "string" then ($pm | test("^pnpm@.+")) else false end)
              or ((.devEngines.packageManager // null) | if type == "object" then is_pnpm_manager else false end)
            ' package.json > /dev/null 2>&1
          }
          {
            if [[ ! -f package.json ]]; then
              echo 'package.json not found in the specified path.' >&2
              exit 1
            elif [[ -f package-lock.json ]]; then
              echo 'PACKAGE_LOCK_FILE=package-lock.json'
              echo 'PACKAGE_MANAGER=npm'
            elif [[ -f pnpm-lock.yaml ]]; then
              echo 'PACKAGE_LOCK_FILE=pnpm-lock.yaml'
              echo 'PACKAGE_MANAGER=pnpm'
              if [[ -z "${PNPM_VERSION}" ]] && ! has_pnpm_version_source; then
                echo 'PNPM_VERSION=latest'
              fi
            elif [[ -f yarn.lock ]]; then
              echo 'yarn.lock is not supported. Use package-lock.json or pnpm-lock.yaml.' >&2
              exit 1
            else
              echo 'PACKAGE_LOCK_FILE='
              echo 'PACKAGE_MANAGER='
            fi
          } | tee -a "${GITHUB_ENV}"
      - name: Setup Node.js with cache
        if: inputs.enable-cache && env.PACKAGE_MANAGER == 'npm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/{1}', inputs.package-path, env.PACKAGE_LOCK_FILE) }}
      - name: Setup Node.js without cache
        if: env.PACKAGE_MANAGER != 'npm' || ! inputs.enable-cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Setup pnpm
        if: env.PACKAGE_MANAGER == 'pnpm'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: ${{ inputs.pnpm-version || env.PNPM_VERSION }}
          package_json_file: ${{ format('{0}/package.json', inputs.package-path) }}
      - name: Get pnpm store path
        id: pnpm-cache
        if: inputs.enable-cache && env.PACKAGE_MANAGER == 'pnpm'
        working-directory: ${{ inputs.package-path }}
        run: echo "store-path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Cache pnpm store
        if: inputs.enable-cache && env.PACKAGE_MANAGER == 'pnpm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store-path }}
          key: pnpm-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles(inputs.cache-dependency-path || format('{0}/{1}', inputs.package-path, env.PACKAGE_LOCK_FILE)) }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ inputs.node-version }}-
            pnpm-${{ runner.os }}-
      - name: Install dependencies
        working-directory: ${{ inputs.package-path }}
        run: | # zizmor: ignore[adhoc-packages] installs caller-selected package manager dependencies
          case "${PACKAGE_MANAGER:-}" in
            pnpm )
              pnpm install --frozen-lockfile
              ;;
            * )
              if [[ -f package-lock.json ]]; then
                npm ci
              else
                npm install
              fi
              ;;
          esac
          echo "PATH=${PWD}/node_modules/.bin:${PATH}" >> "${GITHUB_ENV}"
      - name: Run a package script
        working-directory: ${{ inputs.package-path }}
        env:
          PACKAGE_SCRIPTS: ${{ inputs.package-scripts }}
        run: >
          tr ',' '\n' <<< "${PACKAGE_SCRIPTS}"
          | xargs -L1 -t "${PACKAGE_MANAGER:-npm}" run
      - name: Run security audit
        if: inputs.audit
        working-directory: ${{ inputs.package-path }}
        run: |
          case "${PACKAGE_MANAGER:-}" in
            pnpm )
              pnpm audit
              ;;
            * )
              npm audit
              ;;
          esac
