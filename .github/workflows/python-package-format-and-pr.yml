---
name: Formatting for Python
on:
  workflow_call:
    inputs:
      package-path:
        required: false
        type: string
        description: Path to a Python package or project
        default: .
      python-version:
        required: false
        type: string
        description: Python version to use (not applicable if uv.lock is present)
        default: 3.x
      uv-version:
        required: false
        type: string
        description: Version of uv to use
        default: latest
      enable-cache:
        required: false
        type: boolean
        description: Cache dependency downloads (never formatted files or PR credentials)
        default: true
      cache-dependency-path:
        required: false
        type: string
        description: Dependency file used to scope the cache
        default: null
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust the uv cache
        default: null
      lint-before-pr:
        required: false
        type: boolean
        description: Run lint before creating a pull request
        default: true
      requirements-txt:
        required: false
        type: string
        description: Path to the requirements.txt file (not applicable if uv.lock is present)
        default: null
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-slim
    secrets:
      GH_TOKEN:
        required: false
        description: Optional PAT or GitHub App token; PRs created with the default GITHUB_TOKEN generally do not trigger caller CI workflows
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: formatter-python-${{ github.repository }}-${{ inputs.package-path }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
  queue: max  # Keep up to 100 pending formatter runs instead of replacing pending work
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  format-and-pr:
    runs-on: ${{ inputs.runs-on }}
    env:
      UV_EXCLUDE_NEWER: 7 days
      UV_MALWARE_CHECK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: ${{ inputs.enable-cache }}
          cache-dependency-glob: ${{ inputs.cache-dependency-path || format('{0}/uv.lock', inputs.package-path) }}
          cache-suffix: ${{ inputs.cache-salt }}
      - name: Install packages using uv
        if: hashFiles(format('{0}/uv.lock', inputs.package-path)) != ''
        working-directory: ${{ inputs.package-path }}
        run: |
          uv sync --all-groups
          uv add --dev ruff
          echo "EXECUTOR_KIND=uv" >> "${GITHUB_ENV}"
      - name: Set up Python
        if: hashFiles(format('{0}/uv.lock', inputs.package-path)) == ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install packages using uv pip
        if: hashFiles(format('{0}/uv.lock', inputs.package-path)) == ''
        env:
          REQUIREMENTS_TXT_PATH: ${{ inputs.requirements-txt }}
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ -n "${REQUIREMENTS_TXT_PATH}" ]]; then
            uv pip install --system -r "${REQUIREMENTS_TXT_PATH}"
          fi
          uv pip install --system ruff
          echo "EXECUTOR_KIND=none" >> "${GITHUB_ENV}"
      - name: Format the code using ruff
        working-directory: ${{ inputs.package-path }}
        run: |
          case "${EXECUTOR_KIND}" in
            uv)     uv run ruff format . ;;
            *)      ruff format . ;;
          esac
      - name: Lint the code using ruff
        if: inputs.lint-before-pr
        working-directory: ${{ inputs.package-path }}
        run: |
          case "${EXECUTOR_KIND}" in
            uv)     uv run ruff check --fix --output-format=github . ;;
            *)      ruff check --fix --output-format=github . ;;
          esac
      - name: Restore project files
        if: env.EXECUTOR_KIND == 'uv'
        working-directory: ${{ inputs.package-path }}
        run: |
          git restore pyproject.toml uv.lock
      - name: Create output parameters
        id: parameters
        env:
          PR_BASE: ${{ github.head_ref || github.ref_name }}
          TARGET_PATH: ${{ inputs.package-path }}
        run: |
          target_hash=$(printf '%s' "${TARGET_PATH}" | sha256sum | cut -c1-12)
          target_slug=$(printf '%s' "${TARGET_PATH}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_-]+#-#g; s#^-+|-+$##g; s#-+#-#g' | cut -c1-40)
          if [[ -z "${target_slug}" || "${target_slug}" == "." ]]; then
            target_slug=root
          fi
          target_id="${target_slug}-${target_hash}"
          {
            echo "commit_message=Reformat Python code using ruff"
            echo "pr_base=${PR_BASE}"
            echo "pr_branch=github-actions/python/${target_id}/${PR_BASE}"
          } >> "${GITHUB_OUTPUT}"
      - name: Detect changed files and create a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          commit-message: ${{ steps.parameters.outputs.commit_message }}
          title: ${{ steps.parameters.outputs.commit_message }}
          branch: ${{ steps.parameters.outputs.pr_branch }}
          base: ${{ steps.parameters.outputs.pr_base }}
          labels: agent:github-actions
          body: |
            This PR contains the following updates:

            - ${{ steps.parameters.outputs.commit_message }}

            This PR has been generated by
            [${{ github.workflow_ref }}](https://github.com/${{ github.repository }}/).
          delete-branch: true
          draft: false  # Formatter PRs are opened ready for review; reviewers are not automatically requested
