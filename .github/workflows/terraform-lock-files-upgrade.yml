---
name: Upgrade of Terraform lock files
on:
  workflow_call:
    inputs:
      terraform-working-directories:
        required: false
        type: string
        description: Terraform working directories (separated by spaces or returns)
        default: .
      terraform-working-directory-to-version-tf-json:
        required: false
        type: string
        description: JSON object with Terraform working directories as keys and Terraform version files as values
        default: null
      terragrunt-working-directories:
        required: false
        type: string
        description: Terragrunt working directories (separated by spaces or returns)
        default: null
      terraform-version:
        required: false
        type: string
        description: Terraform version to use
        default: latest
      terragrunt-version:
        required: false
        type: string
        description: Terragrunt version to use
        default: latest
      create-pr:
        required: false
        type: boolean
        description: Create a pull request instead of committing directly
        default: false
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
    secrets:
      GH_TOKEN:
        required: false
        description: GitHub token
permissions:
  contents: write
  pull-requests: write
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  upgrade-and-commit:
    runs-on: ${{ inputs.runs-on }}
    env:
      COMMIT_MESSAGE: Upgrade Terraform lock files
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TG_NON_INTERACTIVE: "true"
      TERRAFORM_LOCK_FILE: .terraform.lock.hcl
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Configure Terraform plugin cache directory
        run: |
          mkdir -p "${RUNNER_TEMP}/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=${RUNNER_TEMP}/terraform-plugin-cache" >> "${GITHUB_ENV}"
      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-provider-cache-${{ runner.os }}-${{ inputs.terraform-version }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-provider-cache-${{ runner.os }}-${{ inputs.terraform-version }}-
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: Install Terragrunt
        if: inputs.terragrunt-working-directories != null
        uses: dceoy/setup-terragrunt@1cbef4029fa29d03260e3572cd1df1d45fd3f290  # v2.0.0
        with:
          terragrunt-version: ${{ inputs.terragrunt-version }}
      - name: Upgrade and validate Terraform lock files
        env:
          TERRAFORM_WORKING_DIRECTORY_TO_VERSION_TF_JSON: ${{ inputs.terraform-working-directory-to-version-tf-json }}
          TERRAGRUNT_WORKING_DIRECTORIES: ${{ inputs.terragrunt-working-directories }}
          TERRAFORM_WORKING_DIRECTORIES: ${{ inputs.terraform-working-directories }}
          TERRAFORM_INIT: terraform init -backend=false -upgrade -reconfigure && terraform validate && rm -rf .terraform
          TERRAGRUNT_INIT: terragrunt init --non-interactive -backend=false -upgrade -reconfigure && terragrunt validate && rm -rf .terragrunt-cache
        run: |
          if [[ -n "${TERRAFORM_WORKING_DIRECTORY_TO_VERSION_TF_JSON}" ]]; then
            jq -r 'to_entries[] | [.key, .value] | @tsv' <<< "${TERRAFORM_WORKING_DIRECTORY_TO_VERSION_TF_JSON}" \
              | while IFS=$'\t' read -r working_dir version_tf; do
                  cp "${version_tf}" "${working_dir}"
                  (
                    cd "${working_dir}"
                    terraform init -backend=false -upgrade -reconfigure
                    terraform validate
                    rm -rf .terraform
                    rm -f "$(basename "${version_tf}")"
                  )
                done
            jq -r 'keys[] | sub("/$"; "")' <<< "${TERRAFORM_WORKING_DIRECTORY_TO_VERSION_TF_JSON}" \
              | xargs -I{} git ls-files -- "{}/${TERRAFORM_LOCK_FILE}" \
              | jq -rRs 'split("\n")[:-1] | "UPDATED_FILES_JSON=\(.)"' \
              | tee -a "${GITHUB_ENV}"
          else
            updated_files_txt="$(mktemp)"
            if [[ -n "${TERRAGRUNT_WORKING_DIRECTORIES}" ]]; then
              target_dirs="${TERRAGRUNT_WORKING_DIRECTORIES}"
            else
              target_dirs="${TERRAFORM_WORKING_DIRECTORIES}"
            fi
            while IFS=$' \n\t' read -r d; do
              [[ -z "${d}" ]] || git ls-files -- "${d%/}/**/${TERRAFORM_LOCK_FILE}" >> "${updated_files_txt}"
            done <<< "${target_dirs}"
            xargs dirname < "${updated_files_txt}" | while read -r d; do
              if [[ -n "${TERRAGRUNT_WORKING_DIRECTORIES}" ]] && [[ -f "${d}/terragrunt.hcl" ]]; then
                (
                  cd "${d}"
                  mv terragrunt.hcl terragrunt.hcl.orig
                  awk '
                    /^terraform[[:space:]]*\{/ { in_block = 1 }
                    in_block { print }
                    in_block {
                      opens += gsub(/\{/, "{")
                      closes += gsub(/\}/, "}")
                      if (opens > 0 && opens == closes) {
                        exit
                      }
                    }
                  ' terragrunt.hcl.orig > terragrunt.hcl
                  terragrunt init --non-interactive -backend=false -upgrade -reconfigure
                  terragrunt validate
                  rm -rf .terragrunt-cache
                  mv terragrunt.hcl.orig terragrunt.hcl
                )
              else
                (
                  cd "${d}"
                  terraform init -backend=false -upgrade -reconfigure
                  terraform validate
                  rm -rf .terraform
                )
              fi
            done
            jq -rRs 'split("\n")[:-1] | "UPDATED_FILES_JSON=\(.)"' "${updated_files_txt}" | tee -a "${GITHUB_ENV}"
            rm -f "${updated_files_txt}"
          fi
      - name: Commit and push the changes
        if: (! inputs.create-pr)
        uses: EndBug/add-and-commit@645ecc0dd0a57f4d86d26c0aa5fc42c0a856fbca  # v11.0.0
        with:
          add: ${{ env.UPDATED_FILES_JSON }}
          message: ${{ env.COMMIT_MESSAGE }}
          push: true
          github_token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
      - name: Detect changed files and create a pull request
        if: inputs.create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          commit-message: ${{ env.COMMIT_MESSAGE }}
          title: ${{ env.COMMIT_MESSAGE }}
          branch: github-actions/${{ github.head_ref || github.ref_name }}
          labels: agent:github-actions
          body: |
            This PR contains the following updates:

            - ${{ env.COMMIT_MESSAGE }}

            This PR has been generated by
            [${{ github.workflow_ref }}](https://github.com/${{ github.repository }}/).
          delete-branch: true
          draft: false
