---
name: Trivy scan and dependency submission
on:
  workflow_call:
    inputs:
      scan-type: {type: string, default: filesystem}
      scan-ref: {type: string, default: .}
      image-refs-json: {type: string, default: '[]'}
      image-targets-json: {type: string, default: ''}
      image-artifact-name: {type: string, default: ''}
      registry: {type: string, default: ''}
      registry-user: {type: string, default: "${{ github.repository_owner }}"}
      trivy-scanners: {type: string, default: 'vuln,secret,misconfig'}
      trivy-severity: {type: string, default: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'}
      trivy-ignore-unfixed: {type: boolean, default: true}
      trivy-exit-code: {type: number, default: 1}
      trivy-config: {type: string, default: ''}
      trivy-timeout: {type: string, default: 5m0s}
      report-format: {type: string, default: table}
      trivy-report-artifact-name: {type: string, default: ''}
      submit-dependencies: {type: boolean, default: false}
      snapshot-correlator: {type: string, default: source-root}
      snapshot-artifact-prefix: {type: string, default: trivy}
      runs-on: {type: string, default: ubuntu-latest}
    secrets:
      DOCKER_TOKEN: {required: false}
permissions:
  contents: read
jobs:
  scan:
    permissions:
      contents: read
    uses: ./.github/workflows/trivy-core.yml
    with:
      scan-type: ${{ inputs.scan-type }}
      scan-ref: ${{ inputs.scan-ref }}
      image-refs-json: ${{ inputs.image-refs-json }}
      image-targets-json: ${{ inputs.image-targets-json }}
      image-artifact-name: ${{ inputs.image-artifact-name }}
      registry: ${{ inputs.registry }}
      registry-user: ${{ inputs.registry-user }}
      trivy-scanners: ${{ inputs.trivy-scanners }}
      trivy-severity: ${{ inputs.trivy-severity }}
      trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      trivy-exit-code: ${{ inputs.trivy-exit-code }}
      trivy-config: ${{ inputs.trivy-config }}
      trivy-timeout: ${{ inputs.trivy-timeout }}
      report-format: ${{ inputs.report-format }}
      trivy-report-artifact-name: ${{ inputs.trivy-report-artifact-name }}
      submit-dependencies: ${{ inputs.submit-dependencies }}
      snapshot-correlator: ${{ inputs.snapshot-correlator }}
      snapshot-artifact-prefix: ${{ inputs.snapshot-artifact-prefix }}
      runs-on: ${{ inputs.runs-on }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  submit:
    if: >-
      always()
      && needs.scan.result != 'cancelled'
      && inputs.submit-dependencies
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scan.outputs.targets) }}
    steps:
      - name: Download dependency snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.snapshot-artifact-prefix }}-dependency-snapshot-${{ matrix.id }}
          path: ${{ runner.temp }}/dependency-snapshot
      - name: Validate and publish dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ runner.temp }}/dependency-snapshot/dependency-snapshot.json
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.version == 0 and (.detector.name | type == "string") and
            (.job.correlator | type == "string" and length > 0) and
            (.manifests | type == "object")' "${SNAPSHOT}" > /dev/null
          curl --fail-with-body --silent --show-error --retry 3 --output /dev/null \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "@${SNAPSHOT}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots"
          echo 'Dependency snapshot submitted successfully.' >> "${GITHUB_STEP_SUMMARY}"
