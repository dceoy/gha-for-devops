---
name: Trivy scan and dependency submission
on:
  workflow_call:
    inputs:
      scan-type: {type: string, default: filesystem}
      scan-ref: {type: string, default: .}
      image-refs-json: {type: string, default: '[]'}
      image-targets-json: {type: string, default: ''}
      image-artifact-name: {type: string, default: ''}
      registry: {type: string, default: ''}
      registry-user: {type: string, default: "${{ github.repository_owner }}"}
      trivy-scanners: {type: string, default: 'vuln,secret,misconfig'}
      trivy-severity: {type: string, default: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'}
      trivy-ignore-unfixed: {type: boolean, default: true}
      trivy-exit-code: {type: number, default: 1}
      trivy-config: {type: string, default: ''}
      trivy-timeout: {type: string, default: 5m0s}
      report-format: {type: string, default: table}
      trivy-report-artifact-name: {type: string, default: ''}
      submit-dependencies: {type: boolean, default: false}
      snapshot-correlator: {type: string, default: source-root}
      snapshot-artifact-prefix: {type: string, default: trivy}
      runs-on: {type: string, default: ubuntu-latest}
    outputs:
      targets:
        description: Indexed scan targets and correlators
        value: ${{ jobs.prepare.outputs.targets }}
    secrets:
      DOCKER_TOKEN: {required: false}
jobs:
  # Publisher permissions are inherited from the caller; read-only wrappers cannot elevate.
  prepare:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        shell: bash
        env:
          SCAN_TYPE: ${{ inputs.scan-type }}
          SCAN_REF: ${{ inputs.scan-ref }}
          IMAGE_REFS: ${{ inputs.image-refs-json }}
          IMAGE_TARGETS: ${{ inputs.image-targets-json }}
          CORRELATOR: ${{ inputs.snapshot-correlator }}
        run: |
          set -euo pipefail
          if [[ "$SCAN_TYPE" == filesystem ]]; then
            targets="$(jq -cn --arg ref "$SCAN_REF" --arg correlator "$CORRELATOR" '[{id:"0",ref:$ref,correlator:$correlator}]')"
          elif [[ "$SCAN_TYPE" == image && -n "$IMAGE_TARGETS" ]]; then
            targets="$(jq -ce 'to_entries | map({id:(.key|tostring),ref:.value.image_ref,correlator:.value.correlator})' <<< "$IMAGE_TARGETS")"
          elif [[ "$SCAN_TYPE" == image ]]; then
            targets="$(jq -cn --argjson refs "$IMAGE_REFS" --arg prefix "$CORRELATOR" '$refs | to_entries | map({id:(.key|tostring),ref:.value,correlator:($prefix+"-"+(.value|sub("@[^@]+$";"")|sub(":[^/:]+$";"")))})')"
          else
            echo '::error::Unsupported Trivy scan type'
            exit 1
          fi
          jq -e 'length > 0 and all(.[]; (.ref|type)=="string" and (.ref|length)>0 and (.correlator|type)=="string" and (.correlator|length)>0)' <<< "$targets" >/dev/null
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
  scan:
    needs: prepare
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: inputs.scan-type == 'filesystem' || inputs.trivy-config != ''
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: inputs.scan-type == 'image' && inputs.image-artifact-name != ''
        with:
          name: ${{ inputs.image-artifact-name }}
          path: ${{ runner.temp }}/image
      - name: Load image archive
        if: inputs.scan-type == 'image' && inputs.image-artifact-name != ''
        env:
          IMAGE_TAR: ${{ runner.temp }}/image/${{ inputs.image-artifact-name }}.tar
        shell: bash
        run: docker load -i "$IMAGE_TAR"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: inputs.scan-type == 'image' && inputs.registry != ''
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-user }}
          password: ${{ secrets.DOCKER_TOKEN }}  # zizmor: ignore[secrets-outside-env]
      - name: Scan once with all requested scanners
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: 'true'
          TRIVY_SKIP_VERSION_CHECK: 'true'
        with:
          scan-type: ${{ inputs.scan-type }}
          scan-ref: ${{ matrix.ref }}
          image-ref: ${{ inputs.scan-type == 'image' && matrix.ref || '' }}
          scanners: ${{ inputs.trivy-scanners }}
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          timeout: ${{ inputs.trivy-timeout }}
          trivy-config: ${{ inputs.trivy-config }}
          list-all-pkgs: true
          format: json
          exit-code: 0
          output: ${{ runner.temp }}/trivy.json
      - name: Convert report from JSON
        env:
          REPORT_FORMAT: ${{ inputs.report-format }}
          TRIVY_SCANNERS: ${{ inputs.trivy-scanners }}
          RAW_REPORT: ${{ runner.temp }}/trivy.json
          REPORT: ${{ runner.temp }}/trivy-report
        shell: bash
        run: |
          set -euo pipefail
          case "$REPORT_FORMAT" in table | sarif) ;; *) exit 1 ;; esac
          trivy convert --scanners "$TRIVY_SCANNERS" --format "$REPORT_FORMAT" --output "$REPORT" "$RAW_REPORT"
          if [[ "$REPORT_FORMAT" == table ]]; then
            jq -r '
              [.Results[]?] as $results
              | "Trivy scanned \($results | length) targets",
                "Vulnerabilities: \([$results[] | .Vulnerabilities[]?] | length)",
                "Misconfigurations: \([$results[] | .Misconfigurations[]?] | length)",
                "Secrets: \([$results[] | .Secrets[]?] | length)"
            ' "$RAW_REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            count="$(jq '[.runs[]?.results[]?] | length' "$REPORT")"
            echo "Trivy SARIF findings: $count (messages omitted)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: inputs.trivy-report-artifact-name != ''
        with:
          name: ${{ inputs.scan-type == 'image' && format('{0}-{1}', inputs.trivy-report-artifact-name, matrix.id) || inputs.trivy-report-artifact-name }}
          path: ${{ runner.temp }}/trivy-report
          if-no-files-found: error
      - name: Convert dependency snapshot without rescanning
        if: >-
          inputs.submit-dependencies
          && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          SNAPSHOT_CORRELATOR: ${{ matrix.correlator }}
          RAW_REPORT: ${{ runner.temp }}/trivy.json
          SNAPSHOT: ${{ runner.temp }}/dependency-snapshot.json
        run: |
          set -euo pipefail
          trivy convert --format github --output "$SNAPSHOT.raw" "$RAW_REPORT"
          jq -e --arg correlator "$SNAPSHOT_CORRELATOR" '.job.correlator=$correlator | select(.version==0 and (.manifests|type=="object"))' "$SNAPSHOT.raw" > "$SNAPSHOT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: >-
          inputs.submit-dependencies
          && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: ${{ inputs.snapshot-artifact-prefix }}-dependency-snapshot-${{ matrix.id }}
          path: ${{ runner.temp }}/dependency-snapshot.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Enforce findings policy
        env:
          EXIT_CODE: ${{ inputs.trivy-exit-code }}
          TRIVY_SCANNERS: ${{ inputs.trivy-scanners }}
          RAW_REPORT: ${{ runner.temp }}/trivy.json
        shell: bash
        run: trivy convert --scanners "$TRIVY_SCANNERS" --format table --output /dev/null --exit-code "$EXIT_CODE" "$RAW_REPORT"
  submit:
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.scan.result != 'cancelled'
      && inputs.submit-dependencies
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [prepare, scan]
    runs-on: ubuntu-latest
    # Inherit caller permissions: read-only security scans cannot grant write access.
    # For submissions, the caller must grant contents: write explicitly.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - name: Download dependency snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.snapshot-artifact-prefix }}-dependency-snapshot-${{ matrix.id }}
          path: ${{ runner.temp }}/dependency-snapshot
      - name: Validate and publish dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ runner.temp }}/dependency-snapshot/dependency-snapshot.json
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.version == 0 and (.detector.name | type == "string") and
            (.job.correlator | type == "string" and length > 0) and
            (.manifests | type == "object")' "${SNAPSHOT}" > /dev/null
          curl --fail-with-body --silent --show-error --retry 3 --output /dev/null \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "@${SNAPSHOT}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots"
          echo 'Dependency snapshot submitted successfully.' >> "${GITHUB_STEP_SUMMARY}"
