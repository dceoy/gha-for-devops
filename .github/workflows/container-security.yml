---
# The default signing identity for images built by docker-build-and-push.yml can
# be restricted with certificate-identity-regexp:
# ^https://github\.com/dceoy/gha-for-devops/\.github/workflows/docker-build-and-push\.yml@(refs/.+|[0-9a-f]{40})$
name: Container security scan and signature verification
on:
  workflow_call:
    inputs:
      image-refs-json:
        required: true
        type: string
        description: JSON array of image references to scan
      image-artifact-name:
        required: false
        type: string
        description: Image tarball artifact name to download
        default: null
      registry:
        required: false
        type: string
        description: Image registry to login (e.g., ghcr.io, docker.io)
        default: null
      registry-user:
        required: false
        type: string
        description: Registry username
        default: ${{ github.repository_owner }}
      trivy-scanners:
        required: false
        type: string
        description: List of scanners to use
        default: vuln,secret,misconfig
      trivy-severity:
        required: false
        type: string
        description: Severity levels to fail the scan
        default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      trivy-ignore-unfixed:
        required: false
        type: boolean
        description: Ignore unpatched/unfixed vulnerabilities
        default: true
      trivy-exit-code:
        required: false
        type: number
        description: Exit code for pre-build scan
        default: 1
      trivy-config:
        required: false
        type: string
        description: Path to a Trivy config file
        default: null
      trivy-timeout:
        required: false
        type: string
        description: Timeout for the Trivy scan
        default: 5m0s
      trivy-report-artifact-name:
        required: false
        type: string
        description: Unique base name for Trivy report artifacts; omit to skip report uploads
        default: null
      image-targets-json:
        type: string
        default: null
        description: Optional array of {image_ref, correlator} pairs for pinned images
      verify-signatures:
        type: boolean
        default: true
        description: Fail releases unless images have valid Cosign signatures
      certificate-identity:
        type: string
        default: null
        description: Expected keyless signer identity (exclusive with regexp)
      certificate-identity-regexp:
        type: string
        default: null
        description: Anchored signer identity regular expression
      certificate-oidc-issuer:
        type: string
        default: https://token.actions.githubusercontent.com
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
    secrets:
      DOCKER_TOKEN:
        required: false
        description: Registry token
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  scan:
    permissions:
      contents: read
      packages: read
    uses: $/.github/workflows/trivy-scan.yml
    with:
      scan-type: image
      image-refs-json: ${{ inputs.image-refs-json }}
      image-targets-json: ${{ inputs.image-targets-json }}
      image-artifact-name: ${{ inputs.image-artifact-name || '' }}
      registry: ${{ inputs.registry || '' }}
      registry-user: ${{ inputs.registry-user }}
      trivy-scanners: ${{ inputs.trivy-scanners }}
      trivy-severity: ${{ inputs.trivy-severity }}
      trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      trivy-exit-code: ${{ inputs.trivy-exit-code }}
      trivy-config: ${{ inputs.trivy-config || '' }}
      trivy-timeout: ${{ inputs.trivy-timeout }}
      trivy-report-artifact-name: ${{ inputs.trivy-report-artifact-name || '' }}
      runs-on: ${{ inputs.runs-on }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  verify:
    if: inputs.verify-signatures
    needs: scan
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image-ref: ${{ fromJSON(inputs.image-refs-json) }}
    steps:
      - name: Validate verification policy
        env:
          IMAGE_REF: ${{ matrix.image-ref }}
          IDENTITY: ${{ inputs.certificate-identity }}
          IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
          ISSUER: ${{ inputs.certificate-oidc-issuer }}
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ "${IMAGE_REF}" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]] || fail "image-ref must be pinned by digest (name@sha256:<64 hex>)."
          if [[ -n "${IDENTITY}" && -n "${IDENTITY_REGEXP}" ]]; then
            fail "Set only one of certificate-identity and certificate-identity-regexp."
          fi
          [[ -n "${IDENTITY}" || -n "${IDENTITY_REGEXP}" ]] || fail "An expected signer identity is required."
          if [[ -n "${IDENTITY_REGEXP}" ]]; then
            [[ "${IDENTITY_REGEXP}" =~ ^\^.*\$$ ]] || fail "certificate-identity-regexp must be anchored with ^ and \$."
          fi
          [[ "${ISSUER}" =~ ^https://[^[:space:]]+$ ]] || fail "certificate-oidc-issuer must be an https URL."
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Login to the Docker registry
        if: inputs.registry != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-user }}
          password: ${{ secrets.DOCKER_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
      - name: Verify the image signature
        id: cosign
        env:
          IMAGE_REF: ${{ matrix.image-ref }}
          IDENTITY: ${{ inputs.certificate-identity }}
          IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
          ISSUER: ${{ inputs.certificate-oidc-issuer }}
        shell: bash
        run: |
          set -euo pipefail
          args=(verify --certificate-oidc-issuer "${ISSUER}")
          if [[ -n "${IDENTITY}" ]]; then
            args+=(--certificate-identity "${IDENTITY}")
          else
            args+=(--certificate-identity-regexp "${IDENTITY_REGEXP}")
          fi
          cosign "${args[@]}" "${IMAGE_REF}"
          echo "Verified ${IMAGE_REF}" >> "${GITHUB_STEP_SUMMARY}"
