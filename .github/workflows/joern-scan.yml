---
name: Static analysis with Joern
on:
  workflow_call:
    inputs:
      scan-path:
        required: false
        type: string
        description: Source code directory to scan
        default: .
      language:
        required: false
        type: string
        description: Source language for joern-scan (auto-detected if not set)
        default: null
      joern-scan-options:
        required: false
        type: string
        description: >-
          Additional space-separated command-line options for joern-scan.
          Limited to --names, --tags, --depth, and --store.
        default: null
      fail-on-findings:
        required: false
        type: boolean
        description: Whether to fail the job when joern-scan reports findings
        default: true
      runs-on:
        required: false
        type: string
        description: Linux runner with Docker support
        default: ubuntu-latest
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  joern-scan:
    runs-on: ${{ inputs.runs-on }}
    container:
      # renovate: datasource=docker depName=ghcr.io/joernio/joern
      image: ghcr.io/joernio/joern:master@sha256:c09cf0b6d03c140e79343398d45f9de04abfc7e5af86950ee4b523a5df556d2c
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify Joern query database
        run: |
          queries="$(joern-scan --list-query-names)"
          if [[ -z "${queries}" ]]; then
            echo '::error::The Joern query database is empty'
            exit 1
          fi
      - name: Prepare scan
        env:
          SCAN_PATH: ${{ inputs.scan-path }}
          SCAN_LANGUAGE: ${{ inputs.language }}
        run: |
          [[ -n "${SCAN_PATH}" ]] || { echo '::error::scan-path must not be empty'; exit 1; }

          # Canonicalize to an absolute path so scan-path can never be parsed as a
          # `find`/joern-scan option (e.g. a caller-supplied "-delete"), and confirm
          # it stays inside the checkout before it reaches `find` or joern-scan.
          # GITHUB_WORKSPACE is resolved too since it may reach the workspace root
          # through a symlink on self-hosted runners.
          workspace_abs="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          scan_path_abs="$(realpath -e -- "${SCAN_PATH}")" || { echo '::error::scan-path does not exist'; exit 1; }
          case "${scan_path_abs}" in
            "${workspace_abs}" | "${workspace_abs}"/*) ;;
            *)
              echo '::error::scan-path must resolve to a location inside the workspace'
              exit 1
              ;;
          esac
          if [[ ! -d "${scan_path_abs}" || "${scan_path_abs}" == *$'\n'* || "${scan_path_abs}" == *$'\r'* ]]; then
            echo '::error::scan-path must be a directory without newlines'
            exit 1
          fi
          SCAN_PATH="${scan_path_abs}"

          # Count actual source files once. Manifests and lockfiles are intentionally
          # excluded because they can produce a successful but empty CPG.
          declare -A source_counts=()
          source_list="$(mktemp "${RUNNER_TEMP}/joern-sources.XXXXXX")"
          trap 'rm -f -- "${source_list}"' EXIT
          if ! find "${SCAN_PATH}" -type f -print0 > "${source_list}"; then
            echo '::error::failed to enumerate source files'
            exit 1
          fi
          while IFS= read -r -d '' source_file; do
            case "${source_file,,}" in
              *.c | *.cc | *.cpp | *.cxx | *.cp | *.h | *.hpp | *.hh | *.hxx | *.h++ | *.tcc)
                source_lang=c ;;
              *.java) source_lang=java ;;
              *.jar | *.war | *.ear | *.apk | *.class) source_lang=jvm ;;
              *.js | *.ts | *.jsx | *.tsx | *.cjs | *.mjs | *.vue | *.ejs)
                source_lang=javascript ;;
              *.kt) source_lang=kotlin ;;
              *.php) source_lang=php ;;
              *.py) source_lang=python ;;
              *.rb) source_lang=ruby ;;
              *.swift) source_lang=swiftsrc ;;
              *.go) source_lang=golang ;;
              *.cs) source_lang=csharp ;;
              *.bc | *.ll) source_lang=llvm ;;
              *.rs) source_lang=rust ;;
              *.abap) source_lang=abap ;;
              *) continue ;;
            esac
            source_counts["${source_lang}"]=$(( ${source_counts["${source_lang}"]:-0} + 1 ))
          done < "${source_list}"

          # Joern interpolates --language, --names and --tags into generated Scala.
          # Preserve the accepted frontend aliases while validating source presence.
          lang_key="${SCAN_LANGUAGE,,}"
          case "${lang_key}" in
            '')
              best_count=0
              for candidate in c java jvm javascript kotlin php python ruby swiftsrc golang csharp llvm rust abap; do
                count="${source_counts["${candidate}"]:-0}"
                if (( count > best_count )); then
                  lang_key="${candidate}"
                  best_count="${count}"
                fi
              done
              [[ -n "${lang_key}" ]] || {
                echo '::error::no recognized source files found under scan-path'
                exit 1
              }
              source_lang="${lang_key}"
              ;;
            c | cpp) source_lang=c ;;
            jssrc | javascript) source_lang=javascript ;;
            csharp | csharpsrc) source_lang=csharp ;;
            ghidra) source_lang='' ;;
            java | jvm | kotlin | php | python | ruby | swiftsrc | golang | llvm | rust | abap)
              source_lang="${lang_key}" ;;
            *)
              echo '::error::language is not a recognized joern-scan frontend'
              exit 1
              ;;
          esac
          if [[ -n "${source_lang}" && "${source_counts["${source_lang}"]:-0}" -eq 0 ]]; then
            echo '::error::no source files found for the selected Joern frontend'
            exit 1
          fi

          # GITHUB_ENV carries only the validated path and allowlisted frontend.
          printf 'JOERN_SCAN_PATH=%s\nJOERN_LANGUAGE=%s\n' "${SCAN_PATH}" "${lang_key}" >> "${GITHUB_ENV}"
      - name: Run joern-scan
        env:
          JOERN_SCAN_OPTIONS: ${{ inputs.joern-scan-options }}
        run: |
          # --overwrite prevents reuse of stale CPGs on persistent runners.
          args=(--overwrite --language "${JOERN_LANGUAGE}")

          # Reject multiline options instead of silently parsing only the first line.
          if [[ "${JOERN_SCAN_OPTIONS}" == *$'\n'* || "${JOERN_SCAN_OPTIONS}" == *$'\r'* ]]; then
            echo '::error::joern-scan-options must be a single line'
            exit 1
          fi
          if [[ -n "${JOERN_SCAN_OPTIONS}" ]]; then
            read -r -a extra_args <<< "${JOERN_SCAN_OPTIONS}"
            # Allow-list only scan-tuning flags. Anything else -- non-scan modes such as
            # --dump/--list-query-names/--list-languages/--updatedb, --language (has its
            # own input), --frontend-args, --help, or a bare positional path -- can make
            # joern-scan exit 0 without analyzing scan-path at all, which the findings
            # check below cannot detect.
            expect_value=0
            expect_flag=""
            for extra_arg in "${extra_args[@]}"; do
              if [[ "${expect_value}" -eq 1 ]]; then
                # joern-scan quotes --names/--tags values as-is into the same
                # generated Scala script as --language (`Array("$value", ...)`), so a
                # quote or backslash in a value would break out of that string
                # literal. Restrict to the characters a comma-separated list of query
                # names/tags actually needs.
                if [[ "${expect_flag}" == "--depth" ]]; then
                  [[ "${extra_arg}" =~ ^[0-9]+$ ]] || { echo "::error::joern-scan-options --depth value must be a non-negative integer"; exit 1; }
                else
                  [[ "${extra_arg}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*(,[A-Za-z0-9_][A-Za-z0-9_.-]*)*$ ]] || { echo '::error::joern-scan-options --names/--tags must be comma-separated identifiers'; exit 1; }
                fi
                expect_value=0
                continue
              fi
              case "${extra_arg}" in
                --names | --tags | --depth)
                  expect_value=1
                  expect_flag="${extra_arg}"
                  ;;
                --store)
                  ;;
                *)
                  echo '::error::joern-scan-options supports only --names, --tags, --depth, and --store'
                  exit 1
                  ;;
              esac
            done
            if [[ "${expect_value}" -eq 1 ]]; then
              echo '::error::joern-scan-options ends with an option that requires a value'
              exit 1
            fi
            args+=("${extra_args[@]}")
          fi

          joern-scan "${args[@]}" -- "${JOERN_SCAN_PATH}" 2>&1 | tee "${RUNNER_TEMP}/joern-scan.log"
      - name: Evaluate scan results
        env:
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          scan_log="${RUNNER_TEMP}/joern-scan.log"
          # "Error executing query" is logged via logger.warn (may carry a
          # timestamp/level prefix); match as a substring rather than anchoring to
          # line start.
          if grep -q -E 'Error executing query|No queries matched current filter selection' "${scan_log}"; then
            echo '::error::joern-scan did not complete a full analysis (see log for query execution errors)'
            exit 1
          fi
          # joern-scan only prints this line after a scan runs to completion
          # (JoernScan.runScanPlugin's final println); a bypassed or aborted run
          # leaves it out even with no error and zero findings.
          if ! grep -q -F 'to explore interactively' "${scan_log}"; then
            echo '::error::joern-scan did not report a completed scan (no completion message found in output)'
            exit 1
          fi
          n_findings="$(grep -c '^Result: ' "${scan_log}" || true)"
          if [[ "${n_findings}" -gt 0 ]]; then
            if [[ "${FAIL_ON_FINDINGS}" == 'true' ]]; then
              echo "::error::joern-scan reported ${n_findings} findings"
              exit 1
            fi
            echo "::warning::joern-scan reported ${n_findings} findings"
          fi
