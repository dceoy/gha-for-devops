---
name: Build and deployment of MkDocs documentation
on:
  workflow_call:
    inputs:
      package-path:
        required: false
        type: string
        description: Repository-relative package path (forward slashes only, no .. or glob characters)
        default: .
      python-version:
        required: false
        type: string
        description: Python version to use (not applicable if uv.lock is present)
        default: 3.x
      uv-version:
        required: false
        type: string
        description: Version of uv to use
        default: latest
      enable-cache:
        required: false
        type: boolean
        description: Cache dependency downloads (never site output or credentials)
        default: true
      cache-dependency-path:
        required: false
        type: string
        description: Dependency file used to scope the cache
        default: null
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust the uv cache
        default: null
      mkdocs-config-file:
        required: false
        type: string
        description: MkDocs config file
        default: mkdocs.yml
      mkdocs-strict:
        required: false
        type: boolean
        description: Enable strict mode for MkDocs build
        default: true
      mkdocs-theme:
        required: false
        type: string
        description: Theme to use for MkDocs (mkdocs or readthedocs)
        default: mkdocs
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
    secrets:
      GH_TOKEN:
        required: false
        description: GitHub token
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:workflow_dispatch inputs are required for MkDocs build settings
    inputs:
      package-path:
        required: false
        type: string
        description: Repository-relative package path (forward slashes only, no .. or glob characters)
        default: .
      python-version:
        required: false
        type: string
        description: Python version to use (not applicable if uv.lock is present)
        default: 3.x
      uv-version:
        required: false
        type: string
        description: Version of uv to use
        default: latest
      enable-cache:
        required: false
        type: boolean
        description: Cache dependency downloads (never site output or credentials)
        default: true
      cache-dependency-path:
        required: false
        type: string
        description: Dependency file used to scope the cache
        default: null
      cache-salt:
        required: false
        type: string
        description: Optional value used to bust the uv cache
        default: null
      mkdocs-config-file:
        required: false
        type: string
        description: MkDocs config file
        default: mkdocs.yml
      mkdocs-strict:
        required: false
        type: boolean
        description: Enable strict mode for MkDocs build
        default: true
      mkdocs-theme:
        required: false
        type: string
        description: Theme to use for MkDocs (mkdocs or readthedocs)
        default: mkdocs
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
permissions:
  contents: write
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  python-package-mkdocs-gh-deploy:
    runs-on: ${{ inputs.runs-on }}
    env:
      UV_EXCLUDE_NEWER: 7 days
      UV_MALWARE_CHECK: "1"
      PACKAGE_PATH: ${{ inputs.package-path }}
      MKDOCS_SITE_DIR: ${{ inputs.package-path }}/site
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: ${{ inputs.enable-cache }}
          cache-dependency-glob: ${{ inputs.cache-dependency-path || format('{0}/uv.lock', inputs.package-path) }}
          cache-suffix: ${{ inputs.cache-salt }}
      - name: Install packages using uv
        if: hashFiles(format('{0}/uv.lock', inputs.package-path)) != ''
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ "${PACKAGE_PATH}" == /* || "${PACKAGE_PATH}" == [A-Za-z]:* || "${PACKAGE_PATH}" == *\\* || "/${PACKAGE_PATH}/" == *"/../"* || "${PACKAGE_PATH}" == *[\?\*\[\]\!\{\}\(\)\+\@\|]* ]]; then
            echo "::error::package-path must be relative, use forward slashes, and contain no .. or glob characters" >&2
            exit 1
          fi
          uv sync --all-groups
          echo "EXECUTOR_KIND=uv" >> "${GITHUB_ENV}"
      - name: Set up Python
        if: hashFiles(format('{0}/uv.lock', inputs.package-path)) == ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install packages using uv pip
        if: hashFiles(format('{0}/uv.lock', inputs.package-path)) == ''
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ "${PACKAGE_PATH}" == /* || "${PACKAGE_PATH}" == [A-Za-z]:* || "${PACKAGE_PATH}" == *\\* || "/${PACKAGE_PATH}/" == *"/../"* || "${PACKAGE_PATH}" == *[\?\*\[\]\!\{\}\(\)\+\@\|]* ]]; then
            echo "::error::package-path must be relative, use forward slashes, and contain no .. or glob characters" >&2
            exit 1
          fi
          uv pip install --system mkdocs
          echo "EXECUTOR_KIND=none" >> "${GITHUB_ENV}"
      - name: Build MkDocs site
        working-directory: ${{ inputs.package-path }}
        env:
          MKDOCS_CONFIG_FILE: ${{ inputs.mkdocs-config-file }}
          MKDOCS_STRICT: ${{ inputs.mkdocs-strict }}
          MKDOCS_THEME: ${{ inputs.mkdocs-theme }}
        run: |
          args=()
          [[ -n "${MKDOCS_CONFIG_FILE}" ]] && args+=(--config-file="${MKDOCS_CONFIG_FILE}")
          [[ "${MKDOCS_STRICT}" == "true" ]] && args+=(--strict)
          [[ -n "${MKDOCS_THEME}" ]] && args+=(--theme="${MKDOCS_THEME}")
          case "${EXECUTOR_KIND}" in
            uv)     uv run mkdocs build --clean --site-dir="${MKDOCS_SITE_DIR}" "${args[@]}" ;;
            *)      mkdocs build --clean --site-dir="${MKDOCS_SITE_DIR}" "${args[@]}" ;;
          esac
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          publish_dir: ${{ env.MKDOCS_SITE_DIR }}
