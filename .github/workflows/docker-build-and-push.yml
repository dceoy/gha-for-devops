---
name: Docker image build and push
on:
  workflow_call:
    inputs:
      registry:
        required: false
        type: string
        description: Image registry to login (e.g., ghcr.io, docker.io)
        default: null
      registry-user:
        required: false
        type: string
        description: Image registry username
        default: ${{ github.repository_owner }}
      image-name:
        required: false
        type: string
        description: Name of the image to push
        default: ${{ github.repository }}
      context:
        required: false
        type: string
        description: Build's context is the set of files located in the specified PATH or URL
        default: .
      file:
        required: false
        type: string
        description: Path to a Dockerfile
        default: Dockerfile
      platforms:
        required: false
        type: string
        description: List of target platforms for build
        default: linux/amd64,linux/arm64
      target:
        required: false
        type: string
        description: Target stage to build
        default: null
      build-args:
        required: false
        type: string
        description: List of build-time variables
        default: null
      secret-envs:
        required: false
        type: string
        description: List of secret env vars to expose to the build (e.g., key=envname, MY_SECRET=MY_ENV_VAR)
        default: null
      secret-files:
        required: false
        type: string
        description: List of secret files to expose to the build (e.g., key=filename, MY_SECRET=./secret.txt)
        default: null
      push:
        required: false
        type: boolean
        description: Push an image to the registry
        default: true
      provenance:
        required: false
        type: boolean
        description: Generate provenance attestation for the build
        default: false
      cosign:
        required: false
        type: boolean
        description: Sign the image with cosign
        default: false
      scan-before-build:
        required: false
        type: boolean
        description: Scan Dockerfile before build
        default: true
      scan-after-build:
        required: false
        type: boolean
        description: Scan the image after build
        default: true
      hadolint-failure-threshold:
        required: false
        type: string
        description: Hadolint failure threshold
        default: error
      hadolint-recursive:
        required: false
        type: boolean
        description: Search for Dockerfile recursively from the project root
        default: true
      trivy-scanners:
        required: false
        type: string
        description: List of scanners to use
        default: vuln,secret,misconfig
      trivy-severity:
        required: false
        type: string
        description: Severity levels to fail the scan
        default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      trivy-ignore-unfixed:
        required: false
        type: boolean
        description: Ignore unpatched/unfixed vulnerabilities
        default: true
      trivy-filesystem-exit-code:
        required: false
        type: number
        description: Exit code for trivy filesystem
        default: 1
      trivy-image-exit-code:
        required: false
        type: number
        description: Exit code for trivy image
        default: 0
      trivy-config:
        required: false
        type: string
        description: Path to a Trivy config file
        default: null
      trivy-timeout:
        required: false
        type: string
        description: Timeout for the Trivy scan
        default: 5m0s
      trivy-report-artifact-name:
        required: false
        type: string
        description: Unique base name for Trivy report artifacts; omit to skip report uploads
        default: null
      docker-metadata-action-tags:
        required: false
        type: string
        description: Tags for the Docker metadata action
        default: |
          type=sha
          type=sha,format=long
          type=raw,value=latest
          type=schedule
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
      image-artifact-name:
        required: false
        type: string
        description: Image tarball artifact name to upload
        default: docker-image
      image-artifact-retention-days:
        required: false
        type: number
        description: Number of days to retain artifacts
        default: 1
      image-artifact-overwrite:
        required: false
        type: boolean
        description: Overwrite existing artifacts
        default: true
      build-output-artifact-name:
        required: false
        type: string
        description: Build output JSON artifact name to upload
        default: null
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
      timeout-minutes:
        required: false
        type: number
        description: Timeout in minutes for the job
        default: 360
    secrets:
      BUILD_SECRETS:
        required: false
        description: BuildKit secret values (e.g., GIT_AUTH_TOKEN=mytoken); pass via workflow_call secrets so values are masked
      DOCKER_TOKEN:
        required: false
        description: Registry token
      GH_TOKEN:
        required: false
        description: GitHub token
    outputs:
      metadata-json:
        description: Metadata JSON extracted from Git reference and GitHub events
        value: ${{ jobs.build-and-push.outputs.metadata-json }}
      build-push-imageid:
        description: Docker image ID
        value: ${{ jobs.build-and-push.outputs.build-push-imageid }}
      build-push-digest:
        description: Docker image digest
        value: ${{ jobs.build-and-push.outputs.build-push-digest }}
      image-ref:
        description: Primary Docker image reference
        value: ${{ jobs.build-and-push.outputs.image-ref }}
permissions:
  contents: write
  packages: write
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  prebuild-lint-and-scan:
    if: >
      inputs.scan-before-build
    uses: ./.github/workflows/docker-lint-and-scan.yml
    with:
      hadolint-dockerfile: ${{ inputs.file }}
      hadolint-failure-threshold: ${{ inputs.hadolint-failure-threshold }}
      hadolint-recursive: ${{ inputs.hadolint-recursive }}
      trivy-scan-ref: ${{ inputs.context }}
      trivy-scanners: ${{ inputs.trivy-scanners }}
      trivy-severity: ${{ inputs.trivy-severity }}
      trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      trivy-exit-code: ${{ inputs.trivy-filesystem-exit-code }}
      trivy-config: ${{ inputs.trivy-config }}
      trivy-timeout: ${{ inputs.trivy-timeout }}
      trivy-report-artifact-name: ${{ inputs.trivy-report-artifact-name && format('{0}-filesystem', inputs.trivy-report-artifact-name) || '' }}
      runs-on: ${{ inputs.runs-on }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
  build-and-push:
    if: >
      (! (failure() || cancelled()))
    needs:
      - prebuild-lint-and-scan
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      IMAGE_TAR: /tmp/${{ inputs.image-artifact-name }}.tar
    outputs:
      metadata-json: ${{ steps.meta.outputs.json }}
      build-push-imageid: ${{ steps.docker-build.outputs.imageid }}
      build-push-digest: ${{ steps.docker-build.outputs.digest }}
      image-ref: ${{ fromJson(steps.meta.outputs.json).tags[0] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - name: Install cosign
        if: inputs.cosign && inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Extract metadata from Git reference and GitHub events
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ inputs.registry && format('{0}/{1}', inputs.registry, inputs.image-name) || inputs.image-name }}
          tags: ${{ inputs.docker-metadata-action-tags }}
      - name: Login to the Docker registry
        if: inputs.registry != null
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-user }}
          password: ${{ secrets.DOCKER_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
      - name: Build and push an image
        id: docker-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          tags: ${{ steps.meta.outputs.tags }}
          context: ${{ inputs.context }}  # zizmor: ignore[template-injection]
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.BUILD_SECRETS }}
          secret-envs: ${{ inputs.secret-envs }}
          secret-files: ${{ inputs.secret-files }}
          push: ${{ inputs.push }}
          pull: true
          load: ${{ ! inputs.push }}
          provenance: ${{ inputs.provenance }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign the images with GitHub OIDC Token
        if: inputs.cosign && inputs.push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.docker-build.outputs.digest }}
        run: >
          xargs -I{} -t cosign sign --yes "{}@${DIGEST}" <<< "${TAGS}"
      - name: Verify the image signatures
        if: inputs.cosign && inputs.push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.docker-build.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            cosign verify \
              --certificate-identity-regexp "https://github.com/dceoy/gha-for-devops/\\.github/workflows/docker-build-and-push\\.yml@(refs/.+|[0-9a-f]{40})" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${tag}@${DIGEST}"
          done <<< "${TAGS}"
      - name: Pull Docker images
        if: inputs.push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: >
          xargs -L1 -t docker pull <<< "${TAGS}"
      - name: Save the image as a tarball
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: >
          xargs -t docker save -o "${IMAGE_TAR}" <<< "${TAGS}"
      - name: Upload the image tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.image-artifact-name }}
          path: ${{ env.IMAGE_TAR }}
          retention-days: ${{ inputs.image-artifact-retention-days }}
          overwrite: ${{ inputs.image-artifact-overwrite }}
      - name: Write build outputs
        if: inputs.build-output-artifact-name != null
        env:
          IMAGE_ARTIFACT_NAME: ${{ inputs.image-artifact-name }}
          IMAGE_REF: ${{ fromJson(steps.meta.outputs.json).tags[0] }}
          BUILD_PUSH_DIGEST: ${{ steps.docker-build.outputs.digest }}
        run: |
          jq -n \
            --arg image_artifact_name "${IMAGE_ARTIFACT_NAME}" \
            --arg image_ref "${IMAGE_REF}" \
            --arg build_push_digest "${BUILD_PUSH_DIGEST}" \
            '{
              image_artifact_name: $image_artifact_name,
              image_ref: $image_ref,
              build_push_digest: $build_push_digest
            }' > /tmp/docker-build-output.json
      - name: Upload build outputs
        if: inputs.build-output-artifact-name != null
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.build-output-artifact-name }}
          path: /tmp/docker-build-output.json
          retention-days: ${{ inputs.image-artifact-retention-days }}
          overwrite: true
  postbuild-scan:
    if: >
      inputs.scan-after-build && (! (failure() || cancelled()))
    needs:
      - build-and-push
    uses: ./.github/workflows/docker-image-scan.yml
    with:
      image-refs-json: ${{ toJSON(fromJSON(needs.build-and-push.outputs.metadata-json).tags) }}
      image-artifact-name: ${{ inputs.image-artifact-name }}
      trivy-scanners: ${{ inputs.trivy-scanners }}
      trivy-severity: ${{ inputs.trivy-severity }}
      trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      trivy-exit-code: ${{ inputs.trivy-image-exit-code }}
      trivy-config: ${{ inputs.trivy-config }}
      trivy-timeout: ${{ inputs.trivy-timeout }}
      trivy-report-artifact-name: ${{ inputs.trivy-report-artifact-name && format('{0}-image', inputs.trivy-report-artifact-name) || '' }}
      runs-on: ${{ inputs.runs-on }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
