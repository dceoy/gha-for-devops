---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: '15 0 * * 1'  # Mondays 09:15 JST (UTC+09:00)
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:workflow_dispatch inputs are required to select the pipeline
    inputs:
      workflow:
        required: true
        type: choice
        options:
          - lint
          - analyze
          - release
          - weekly-release
          - update
        description: Choose the workflow to run
        default: lint
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.workflow || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}
permissions:
  contents: read
env:
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: 2026.8.5
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  shell-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
    uses: ./.github/workflows/shell-lint.yml
    with:
      use-shfmt: true
  markdown-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
    uses: ./.github/workflows/markdown-lint.yml
  readme-generator-test:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
    runs-on: ubuntu-slim
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Setup Bats and Bats libraries
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          github-token: ${{ github.token }}
      - name: Run Bats tests
        run: bats --print-output-on-failure .github/scripts/tests/*.bats
  github-actions-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/github-actions-lint-and-scan.yml
    with:
      search-path: .github/workflows
      zizmor-search-path: .github
      go-version: stable
      python-version: 3.x
      actions-lock-exclude-workflows: .github/workflows/python-package-release-on-pypi-and-github.yml
  github-codeql-analysis:
    if: >
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'analyze')
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/github-codeql-analysis.yml
    with:
      language: >
        ["actions"]
  github-release:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.workflow == 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      create-new-tag: false
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  github-major-version-tag:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.workflow == 'release'
    needs:
      - github-release
    permissions:
      contents: write
    uses: ./.github/workflows/github-major-version-tag.yml
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  weekly-release:
    if: >
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'weekly-release')
    runs-on: ubuntu-slim
    concurrency:
      group: weekly-release-main
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish weekly release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${head_sha}" != "${RELEASE_SHA}" ]]; then
            echo '::notice::main advanced after the run started; skipping this release.'
            exit 0
          fi

          # Only release the exact main commit that passed the push CI pipeline.
          passed="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml \
            --branch main --commit "${RELEASE_SHA}" --event push --status success \
            --json databaseId --jq 'length')"
          if (( passed == 0 )); then
            echo '::error::The release commit has no successful main push CI run.'
            exit 1
          fi

          previous_tag="$(gh release list --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
          if [[ ! "${previous_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Expected a latest stable SemVer release, got: ${previous_tag}"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if ! git merge-base --is-ancestor "${previous_tag}" "${RELEASE_SHA}"; then
            echo "::error::Release tag ${previous_tag} is not an ancestor of main."
            exit 1
          fi

          # Documentation-only changes do not affect the reusable workflows.
          if git diff --quiet "${previous_tag}" "${RELEASE_SHA}" -- \
            .github/workflows .github/scripts; then
            echo '::notice::No workflow or shared script changes since the last release.'
            exit 0
          fi

          messages="$(git log --first-parent --format=%B "${previous_tag}..${RELEASE_SHA}")"
          if grep -Eq '^[[:alnum:]_-]+(\([^)]*\))?!:|^BREAKING CHANGE:' <<< "${messages}"; then
            echo '::error::Breaking changes require a reviewed manual major release.'
            exit 1
          fi
          if grep -Eq '^feat(\([^)]*\))?:' <<< "${messages}"; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi
          tag="v${major}.${minor}.${patch}"

          # Avoid publishing code that landed after the validated commit.
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${head_sha}" != "${RELEASE_SHA}" ]]; then
            echo '::notice::main advanced during release preparation; skipping.'
            exit 0
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${tag} already exists."
            exit 1
          fi
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_SHA}" --title "${tag}" --generate-notes
          echo 'published=true' >> "${GITHUB_OUTPUT}"

  weekly-major-version-tag:
    if: needs.weekly-release.outputs.published == 'true'
    needs:
      - weekly-release
    permissions:
      contents: write
    uses: ./.github/workflows/github-major-version-tag.yml
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - shell-lint
      - markdown-lint
      - readme-generator-test
      - github-actions-lint-and-scan
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: ./.github/workflows/dependabot-auto-merge.yml
    with:
      unconditional: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Write-capable maintenance jobs never run for pull_request events.
  markdown-format-and-pr:
    if: >
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'update')
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/markdown-format-and-pr.yml
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  update-readme-md:
    if: >
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'update')
    permissions:
      contents: write
    runs-on: ubuntu-slim
    env:
      npm_config_min_release_age: '7'
      # renovate: datasource=npm depName=prettier
      PRETTIER_VERSION: 3.9.6
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24.18.0
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Provide Prettier wrapper
        env:
          PRETTIER_VERSION: ${{ env.PRETTIER_VERSION }}
        run: | # zizmor: ignore[adhoc-packages] wrapper runs pinned Prettier through npx
          [[ "${PRETTIER_VERSION}" =~ ^[0-9]+(\.[0-9]+)*([._+-][A-Za-z0-9]+)*$ ]] || { echo "invalid PRETTIER_VERSION"; exit 1; }
          mkdir -p "${HOME}/.local/bin"
          cat > "${HOME}/.local/bin/prettier" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec npx --yes "prettier@${PRETTIER_VERSION}" "\$@"
          EOF
          chmod 0755 "${HOME}/.local/bin/prettier"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Update README.md
        run: |
          ./.github/scripts/update-readme.sh
      - name: Commit and push the changes
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8  # v11.1.1
        with:
          add: ./README.md
          message: Update README.md
          push: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
