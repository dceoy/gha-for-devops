---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:workflow_dispatch inputs are required to select the pipeline
    inputs:
      workflow:
        required: true
        type: choice
        options:
          - lint
          - analyze
          - release
          - update
          - renovate
          - renovate-check
        description: Choose the workflow to run
        default: lint
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.workflow || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
env:
  GH_TELEMETRY: 'false'
  MISE_USE_VERSIONS_HOST_TRACK: 'false'
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  shell-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
    uses: $/.github/workflows/shell-lint.yml
    with:
      use-shfmt: true
  markdown-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
    uses: $/.github/workflows/markdown-lint.yml
  bats-test:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select Bats test scope
        if: github.event_name == 'pull_request'
        id: bats-scope
        run: |
          scope=full
          if git rev-parse -q --verify HEAD^1 > /dev/null && changed_paths="$(git diff --name-only --no-renames HEAD^1 HEAD)"; then
            if [[ -n "${changed_paths}" ]] && ! grep -Eqv '^(README\.md(\.tmpl)?|\.github/scripts/(update-readme\.sh|tests/update-readme\.bats))$' <<< "${changed_paths}"; then
              scope=readme
            fi
          fi
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"
      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        with:
          auto_update: true
          install_args: ${{ steps.bats-scope.outputs.scope == 'readme' && 'yq gomplate' || 'actionlint yq gomplate trivy syft grype' }}
      - name: Set up Go
        if: steps.bats-scope.outputs.scope != 'readme'
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Cache Go builds
        if: steps.bats-scope.outputs.scope != 'readme'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('.github/scripts/tests/fixtures/go-package-test/**') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Setup Bats and Bats libraries
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e  # 4.1.0
        with:
          github-token: ${{ github.token }}
      - name: Run README generator tests
        if: steps.bats-scope.outputs.scope == 'readme'
        run: bats --print-output-on-failure .github/scripts/tests/update-readme.bats
      - name: Run Bats tests
        if: steps.bats-scope.outputs.scope != 'readme'
        run: bats --print-output-on-failure --filter-tags '!e2e' .github/scripts/tests/*.bats
  github-actions-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: $/.github/workflows/github-actions-lint-and-scan.yml
    with:
      search-path: .github/workflows
      zizmor-search-path: .github
      go-version: stable
      python-version: 3.x
      actions-lock-exclude-workflows: .github/workflows/python-package-release-on-pypi-and-github.yml
  github-codeql-analysis:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'analyze')
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: $/.github/workflows/github-codeql-analysis.yml
    with:
      language: >
        ["actions"]
  github-release:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.workflow == 'release'
    permissions:
      contents: write
    uses: $/.github/workflows/github-release.yml
    with:
      create-new-tag: false
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  github-major-version-tag:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.workflow == 'release'
    needs:
      - github-release
    permissions:
      contents: write
    uses: $/.github/workflows/github-major-version-tag.yml
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - shell-lint
      - markdown-lint
      - bats-test
      - readme-sync-check
      - github-actions-lint-and-scan
      - github-codeql-analysis
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: $/.github/workflows/dependabot-auto-merge.yml
    with:
      unconditional: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  renovate-integration:
    timeout-minutes: 45
    if: >-
      (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch'
      && inputs.workflow == 'renovate-check')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect Renovate workflow changes
        id: renovate-changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -Fxq '.github/workflows/renovate.yml'; then
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
          fi
      - name: Enable read-only mode for PRs
        if: steps.renovate-changes.outputs.changed == 'true' || inputs.workflow == 'renovate-check'
        run: printf '%s\n' 'RENOVATE_DRY_RUN=full' >> "${GITHUB_ENV}"
      - name: Execute Renovate against GitHub
        if: steps.renovate-changes.outputs.changed == 'true' || inputs.workflow == 'renovate-check'
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc  # v46.3.12
        with:
          renovate-version: 44.210.2
          token: ${{ github.token }}  # zizmor: ignore[secrets-outside-env] built-in workflow token
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_ENDPOINT: ${{ github.api_url }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'false'
  renovate-live:
    if: github.event_name == 'workflow_dispatch' && inputs.workflow == 'renovate'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    uses: $/.github/workflows/renovate.yml
  # Write-capable maintenance jobs never run for pull_request events.
  markdown-format-and-pr:
    if: >
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'update')
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/markdown-format-and-pr.yml
    with:
      update-readme: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow == 'update' }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
  readme-sync-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-slim
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: '1440'
      # renovate: datasource=npm depName=oxfmt
      OXFMT_VERSION: 0.72.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup pnpm and latest Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e  # v3.1.2
        with:
          version: 12
          install: false
      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        with:
          auto_update: true
          install_args: yq gomplate
      - name: Provide Oxfmt wrapper
        env:
          OXFMT_VERSION: ${{ env.OXFMT_VERSION }}
        run: | # zizmor: ignore[adhoc-packages] wrapper runs pinned Oxfmt through pnpm dlx
          [[ "${OXFMT_VERSION}" =~ ^[0-9]+(\.[0-9]+)*([._+-][A-Za-z0-9]+)*$ ]] || { echo "invalid OXFMT_VERSION"; exit 1; }
          mkdir -p "${HOME}/.local/bin"
          cat > "${HOME}/.local/bin/oxfmt" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec pnpm dlx "oxfmt@${OXFMT_VERSION}" "\$@"
          EOF
          chmod 0755 "${HOME}/.local/bin/oxfmt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Regenerate README.md
        run: ./.github/scripts/update-readme.sh
      - name: Verify README.md and README.md.tmpl are up to date
        run: |
          if ! git diff --quiet -- README.md README.md.tmpl; then
            echo '::error::README.md or README.md.tmpl is out of date. Run ./.github/scripts/update-readme.sh and commit the generated result.'
            git --no-pager diff -- README.md README.md.tmpl
            exit 1
          fi
