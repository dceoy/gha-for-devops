---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:workflow_dispatch inputs are required to select the pipeline
    inputs:
      workflow:
        required: true
        type: choice
        options:
          - lint
          - analyze
          - release
          - update
        description: Choose the workflow to run
        default: lint
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.workflow || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
env:
  GH_TELEMETRY: 'false'
  MISE_USE_VERSIONS_HOST_TRACK: 'false'
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: 2026.8.5
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  shell-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
    uses: $/.github/workflows/shell-lint.yml
    with:
      use-shfmt: true
  markdown-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
    uses: $/.github/workflows/markdown-lint.yml
  bats-test:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select Bats test scope
        if: github.event_name == 'pull_request'
        id: bats-scope
        run: |
          scope=full
          if git rev-parse -q --verify HEAD^1 > /dev/null && changed_paths="$(git diff --name-only --no-renames HEAD^1 HEAD)"; then
            if [[ -n "${changed_paths}" ]] && ! grep -Eqv '^(README\.md(\.tmpl)?|\.github/scripts/(update-readme\.sh|tests/update-readme\.bats))$' <<< "${changed_paths}"; then
              scope=readme
            fi
          fi
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"
      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ steps.bats-scope.outputs.scope == 'readme' && 'yq gomplate' || 'actionlint yq gomplate trivy syft grype' }}
      - name: Set up Go
        if: steps.bats-scope.outputs.scope != 'readme'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Setup Bats and Bats libraries
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          github-token: ${{ github.token }}
      - name: Run README generator tests
        if: steps.bats-scope.outputs.scope == 'readme'
        run: bats --print-output-on-failure .github/scripts/tests/update-readme.bats
      - name: Run full Bats tests
        if: steps.bats-scope.outputs.scope != 'readme'
        run: bats --print-output-on-failure .github/scripts/tests/*.bats
  github-actions-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint')
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: $/.github/workflows/github-actions-lint-and-scan.yml
    with:
      search-path: .github/workflows
      zizmor-search-path: .github
      go-version: stable
      python-version: 3.x
      actions-lock-exclude-workflows: .github/workflows/python-package-release-on-pypi-and-github.yml
  github-codeql-analysis:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'analyze')
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: $/.github/workflows/github-codeql-analysis.yml
    with:
      language: >
        ["actions"]
  github-release:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.workflow == 'release'
    permissions:
      contents: write
    uses: $/.github/workflows/github-release.yml
    with:
      create-new-tag: false
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  github-major-version-tag:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.workflow == 'release'
    needs:
      - github-release
    permissions:
      contents: write
    uses: $/.github/workflows/github-major-version-tag.yml
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - shell-lint
      - markdown-lint
      - bats-test
      - readme-sync-check
      - github-actions-lint-and-scan
      - github-codeql-analysis
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: $/.github/workflows/dependabot-auto-merge.yml
    with:
      unconditional: true
      allow-python-dependency-auto-merge: false
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Write-capable maintenance jobs never run for pull_request events.
  markdown-format-and-pr:
    if: >
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'update')
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/markdown-format-and-pr.yml
    with:
      update-readme: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow == 'update' }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
  readme-sync-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-slim
    env:
      npm_config_min_release_age: '7'
      # renovate: datasource=npm depName=oxfmt
      OXFMT_VERSION: 0.72.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24.18.0
      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: yq gomplate
      - name: Provide Oxfmt wrapper
        env:
          OXFMT_VERSION: ${{ env.OXFMT_VERSION }}
        run: | # zizmor: ignore[adhoc-packages] wrapper runs pinned Oxfmt through npx
          [[ "${OXFMT_VERSION}" =~ ^[0-9]+(\.[0-9]+)*([._+-][A-Za-z0-9]+)*$ ]] || { echo "invalid OXFMT_VERSION"; exit 1; }
          mkdir -p "${HOME}/.local/bin"
          cat > "${HOME}/.local/bin/oxfmt" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec npx --yes "oxfmt@${OXFMT_VERSION}" "\$@"
          EOF
          chmod 0755 "${HOME}/.local/bin/oxfmt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Regenerate README.md
        run: ./.github/scripts/update-readme.sh
      - name: Verify README.md and README.md.tmpl are up to date
        run: |
          if ! git diff --quiet -- README.md README.md.tmpl; then
            echo '::error::README.md or README.md.tmpl is out of date. Run ./.github/scripts/update-readme.sh and commit the generated result.'
            git --no-pager diff -- README.md README.md.tmpl
            exit 1
          fi
