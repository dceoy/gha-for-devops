---
name: Update AWS Parameter Store values
on:
  workflow_call:
    inputs:
      aws-iam-role-to-assume:
        required: false
        type: string
        description: AWS IAM role ARN to assume
      aws-region:
        required: false
        type: string
        description: AWS region to use
        default: us-east-1
      dry-run:
        required: false
        type: boolean
        description: Show what would be updated without making changes
        default: false
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-slim
    secrets:
      PARAMETERS_JSON:
        required: true
        description: JSON array of parameters to update (including SecureString values); masked via workflow_call secrets
permissions:
  contents: read
  id-token: write
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  update-parameters:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ inputs.aws-iam-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: github-actions-${{ github.run_id }}
          output-credentials: true
          output-env-credentials: false
      - name: Update AWS Parameter Store
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region }}
          PARAMETERS_JSON: ${{ secrets.PARAMETERS_JSON }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          validate_parameter_type() {
            local type="${1}"
            case "${type}" in
              String | StringList | SecureString )
                return 0
                ;;
              * )
                echo "Error: Invalid parameter type '${type}'. Must be String, StringList, or SecureString"
                return 1
                ;;
            esac
          }

          update_parameter() {
            local name="${1}"
            local value="${2}"
            local type="${3:-String}"
            local description="${4}"
            local key_id="${5}"
            local overwrite="${6:-true}"

            if [[ -z "${name}" || -z "${value}" ]]; then
              echo "Error: Parameter name and value cannot be empty"
              return 1
            fi
            validate_parameter_type "${type}"
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "DRY RUN: Would update parameter '${name}'"
              echo "  Type: ${type}"
              echo "  Value: [HIDDEN]"
              echo "  Overwrite: ${overwrite}"
              [[ -n "${description}" ]] && echo "  Description: ${description}"
              [[ -n "${key_id}" ]] && echo "  KMS Key ID: ${key_id}"
              return 0
            fi

            echo "Updating parameter '${name}'"
            local args=(
              "ssm" "put-parameter"
              "--name" "${name}"
              "--value" "${value}"
              "--type" "${type}"
            )
            if [[ "${overwrite}" == "true" ]]; then
              args+=("--overwrite")
            fi
            if [[ -n "${description}" ]]; then
              args+=("--description" "${description}")
            fi
            if [[ "${type}" == "SecureString" && -n "${key_id}" ]]; then
              args+=("--key-id" "${key_id}")
            fi

            if aws "${args[@]}"; then
              echo "Successfully updated parameter '${name}'"
            else
              echo "Error: Failed to update parameter '${name}'"
              return 1
            fi
          }

          verify_parameter() {
            local name="${1}"
            echo "Verifying parameter '${name}'"
            if ! aws ssm get-parameter --name "${name}" --query 'Parameter.[Name,Type,LastModifiedDate]' --output table; then
              echo "Warning: Could not verify parameter '${name}'"
              return 1
            fi
          }

          process_json_parameters() {
            local parameters_updated=()

            while IFS= read -r param; do
              local name value type description key_id param_overwrite
              name=$(jq -r '.name // empty' <<< "${param}")
              value=$(jq -r '.value // empty' <<< "${param}")
              type=$(jq -r '.type // "String"' <<< "${param}")
              description=$(jq -r '.description // empty' <<< "${param}")
              key_id=$(jq -r '.keyId // empty' <<< "${param}")
              param_overwrite=$(jq -r '.overwrite // true' <<< "${param}")

              if [[ -z "${name}" ]]; then
                echo "Error: Parameter name is required in JSON"
                return 1
              elif update_parameter "${name}" "${value}" "${type}" "${description}" "${key_id}" "${param_overwrite}"; then
                parameters_updated+=("${name}")
              else
                echo "Error: Failed to update parameter '${name}'"
                return 1
              fi
            done < <(jq -c '.[]' <<< "${PARAMETERS_JSON}")

            if [[ "${DRY_RUN}" != "true" && ${#parameters_updated[@]} -gt 0 ]]; then
              echo "Verifying ${#parameters_updated[@]} updated parameters..."
              for param_name in "${parameters_updated[@]}"; do
                verify_parameter "${param_name}"
              done
            fi
          }

          if [[ -z "${PARAMETERS_JSON}" ]]; then
            echo "Error: PARAMETERS_JSON secret is required"
            exit 1
          elif ! jq empty <<< "${PARAMETERS_JSON}" 2>/dev/null; then
            echo "Error: Invalid JSON format in PARAMETERS_JSON secret"
            exit 1
          else
            echo "Processing parameters from JSON..."
            process_json_parameters
          fi
