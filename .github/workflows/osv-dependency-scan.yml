---
name: OSV-Scanner dependency scan
on:
  workflow_call:
    inputs:
      package-path:
        type: string
        default: .
      requirements-txt:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Detect dependencies and prepare scan arguments
        id: detect
        env:
          SCAN_PATH: ${{ inputs.package-path }}
          REQUIREMENTS_TXT_PATH: ${{ inputs.requirements-txt }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "${SCAN_PATH}" ]]; then
            echo "::error::Scan directory not found: ${SCAN_PATH}"
            exit 1
          fi
          if [[ "${SCAN_PATH}" == *$'\n'* || "${REQUIREMENTS_TXT_PATH}" == *$'\n'* ]]; then
            echo "::error::Newlines are not allowed in scan paths."
            exit 1
          fi
          requirements_file=""
          if [[ -n "${REQUIREMENTS_TXT_PATH}" && ! -f "${SCAN_PATH%/}/uv.lock" ]]; then
            requirements_file="${REQUIREMENTS_TXT_PATH}"
            if [[ "${requirements_file}" != /* ]]; then
              requirements_file="${SCAN_PATH%/}/${requirements_file}"
            fi
            if [[ ! -f "${requirements_file}" ]]; then
              echo "::error::Requirements file not found: ${requirements_file}"
              exit 1
            fi
          fi
          has_dependencies=false
          if find "${SCAN_PATH}" \
            \( -type d \( -name .git -o -name node_modules -o -name .venv -o -name vendor \) -prune \) -o \
            \( -type f \( \
              -name go.mod -o -name go.sum -o \
              -name uv.lock -o -name poetry.lock -o -name pdm.lock -o -name Pipfile.lock -o \
              -name 'requirements*.txt' -o -name pylock.toml -o \
              -name package-lock.json -o -name npm-shrinkwrap.json -o \
              -name pnpm-lock.yaml -o -name yarn.lock -o -name bun.lock -o -name bun.lockb -o \
              -name Gemfile.lock -o -name Cargo.lock -o -name composer.lock -o -name gradle.lockfile \
            \) -print -quit \) | grep -q .; then
            has_dependencies=true
          fi
          if [[ "${has_dependencies}" != true && -z "${requirements_file}" ]]; then
            echo "::notice::No supported dependency lockfiles were found."
            exit 0
          fi
          {
            echo "scan=true"
            echo "scan-args<<OSV_ARGS"
            echo "--recursive"
            echo "--include-git-root"
            if [[ -n "${requirements_file}" ]]; then
              echo "--lockfile=requirements.txt:${requirements_file}"
            fi
            echo "${SCAN_PATH}"
            echo "OSV_ARGS"
          } >> "${GITHUB_OUTPUT}"
      - name: Scan dependencies using OSV-Scanner
        if: steps.detect.outputs.scan == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@ef6dfdf01765802d5a8dbc3c39852a6128b00af0  # v2.7.0
        with:
          scan-args: ${{ steps.detect.outputs.scan-args }}
