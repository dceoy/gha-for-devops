---
name: Source security scan
on:
  workflow_call:
    inputs:
      package-path:
        type: string
        default: .
        description: Directory to scan
      requirements-txt:
        type: string
        default: null
        description: Optional Python requirements file relative to package-path
      use-osv-scanner:
        type: boolean
        default: true
        description: Scan dependency lockfiles with OSV-Scanner
      use-trivy:
        type: boolean
        default: true
        description: Scan the filesystem with Trivy
      submit-dependencies:
        type: boolean
        default: false
        description: Publish the existing Trivy dependency snapshot on trusted default-branch events
      snapshot-correlator:
        type: string
        default: source-root
      use-syft-grype:
        type: boolean
        default: false
        description: Enable optional Syft SBOM generation and Grype scanning
      grype-fail-on:
        type: string
        default: high
        description: Minimum vulnerability severity that fails the scan; empty disables the severity threshold
      grype-only-fixed:
        type: boolean
        default: true
        description: Report only vulnerabilities with an available fix
      sbom-artifact-name:
        type: string
        default: null
        description: Optional artifact name prefix for Syft SBOMs and Grype JSON; empty disables report upload
      trivy-scanners:
        type: string
        default: vuln,secret,misconfig
        description: Trivy scanners to run
      trivy-severity:
        type: string
        default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        description: Trivy severity levels to report
      trivy-ignore-unfixed:
        type: boolean
        default: true
        description: Ignore unpatched vulnerabilities in Trivy
      trivy-timeout:
        type: string
        default: 5m0s
        description: Trivy scan timeout
      use-semgrep:
        type: boolean
        default: false
        description: Run Semgrep OSS SAST
      semgrep-exclude-cooldown-rules:
        type: boolean
        default: false
        description: Exclude Semgrep p/default dependency cooldown and minimum release age rules
      semgrep-working-directory:
        type: string
        default: .
        description: Directory in which to execute Semgrep
      semgrep-target:
        type: string
        default: .
        description: Semgrep target relative to the working directory
      semgrep-includes:
        type: string
        default: null
        description: Newline-separated Semgrep include patterns
      semgrep-file-names:
        type: string
        default: null
        description: Newline-separated tracked file patterns (for Shell scans)
      semgrep-restrict-to-files:
        type: boolean
        default: false
        description: Restrict Semgrep targets to git-tracked files matching semgrep-file-names
      trivy-config:
        type: string
        default: null
      trivy-exit-code:
        type: number
        default: 1
      use-checkov:
        type: boolean
        default: false
      checkov-framework:
        type: string
        default: null
      checkov-skip-framework:
        type: string
        default: null
      checkov-check:
        type: string
        default: null
      checkov-skip-check:
        type: string
        default: null
      checkov-config-file:
        type: string
        default: null
      checkov-output-format:
        type: string
        default: github_failed_only
      checkov-output-file-path:
        type: string
        default: null
      checkov-soft-fail:
        type: boolean
        default: false
      trivy-report-artifact-name:
        type: string
        default: null
        description: Artifact name for Trivy SARIF output; empty disables upload
      runs-on:
        type: string
        default: ubuntu-slim
        description: Runner label for Docker-free Trivy and Semgrep scans
    secrets:
      BC_API_KEY:
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  source-osv-scan:
    permissions:
      contents: read
    if: inputs.use-osv-scanner
    runs-on: ${{ inputs.runs-on }}
    env:
      # renovate: datasource=github-releases depName=google/osv-scanner
      OSV_SCANNER_VERSION: 2.7.0
      # renovate: datasource=github-releases depName=jdx/mise
      MISE_VERSION: 2026.8.5
      MISE_USE_VERSIONS_HOST_TRACK: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # mise runs only in a trusted directory outside the caller's checkout.
      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e  # v5.2.3
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache: false
          working_directory: ${{ runner.temp }}
      - name: Restore pinned OSV-Scanner installation
        id: osv-tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/mise/installs
          key: osv-scanner-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.OSV_SCANNER_VERSION }}
      - name: Install OSV-Scanner
        working-directory: ${{ runner.temp }}
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise_dir="${RUNNER_TEMP}/osv-scanner-mise"
          mkdir -p "${mise_dir}"
          cd "${mise_dir}"
          export MISE_CEILING_PATHS="${RUNNER_TEMP}"
          printf '[tools]\n"aqua:google/osv-scanner" = "%s"\n' "${OSV_SCANNER_VERSION}" > mise.toml
          mise trust "${mise_dir}/mise.toml"
          mise install
          echo "OSV_SCANNER_BIN=$(mise which osv-scanner)" >> "${GITHUB_ENV}"
      - name: Save pinned OSV-Scanner installation
        if: steps.osv-tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/mise/installs
          key: ${{ steps.osv-tool-cache.outputs.cache-primary-key }}
      - name: Set up Go for call analysis
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Run OSV-Scanner
        id: osv
        env:
          SCAN_PATH: ${{ inputs.package-path }}
          REQUIREMENTS_TXT_PATH: ${{ inputs.requirements-txt }}
        run: |
          if [[ ! -d "${SCAN_PATH}" ]]; then
            echo "::error::Scan directory not found: ${SCAN_PATH}"
            exit 1
          fi
          if [[ "${SCAN_PATH}" == *$'\n'* || "${REQUIREMENTS_TXT_PATH}" == *$'\n'* ]]; then
            echo "::error::Newlines are not allowed in scan paths."
            exit 1
          fi
          args=(scan source --recursive --include-git-root)
          if [[ -n "${REQUIREMENTS_TXT_PATH}" && ! -f "${SCAN_PATH%/}/uv.lock" ]]; then
            requirements_file="${REQUIREMENTS_TXT_PATH}"
            if [[ "${requirements_file}" != /* ]]; then
              requirements_file="${SCAN_PATH%/}/${requirements_file}"
            fi
            if [[ ! -f "${requirements_file}" ]]; then
              echo "::error::Requirements file not found: ${requirements_file}"
              exit 1
            fi
            args+=("--lockfile=requirements.txt:${requirements_file}")
          fi
          args+=("${SCAN_PATH}")
          status=0
          "${OSV_SCANNER_BIN}" "${args[@]}" || status=$?
          if [[ "${status}" -eq 128 ]]; then
            echo "::notice::OSV-Scanner found no dependencies."
            exit 0
          fi
          exit "${status}"
  source-security-scan:
    permissions:
      contents: read
    if: inputs.use-semgrep
    runs-on: ${{ inputs.runs-on }}
    env:
      UV_EXCLUDE_NEWER: 1 day
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv for Semgrep
        if: ${{ !cancelled() && inputs.use-semgrep }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: auto
      - name: Run Semgrep SAST scan
        id: semgrep
        if: ${{ !cancelled() && inputs.use-semgrep }}
        continue-on-error: true
        working-directory: ${{ inputs.semgrep-working-directory }}
        env:
          SEMGREP_INCLUDES: ${{ inputs.semgrep-includes }}
          SEMGREP_TARGET: ${{ inputs.semgrep-target }}
          SEMGREP_FILE_NAMES: ${{ inputs.semgrep-file-names }}
          SEMGREP_RESTRICT_TO_FILES: ${{ inputs.semgrep-restrict-to-files }}
          SEMGREP_EXCLUDE_COOLDOWN_RULES: ${{ inputs.semgrep-exclude-cooldown-rules }}
        run: | # zizmor: ignore[adhoc-packages] runs Semgrep via uvx
          args=(semgrep scan --config p/default --metrics off --error)
          if [[ "${SEMGREP_EXCLUDE_COOLDOWN_RULES}" == true ]]; then
            args+=(
              --exclude-rule package_managers.bun.bun-missing-minimum-release-age.bun-missing-minimum-release-age
              --exclude-rule package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
              --exclude-rule package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age
              --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
              --exclude-rule package_managers.poetry.poetry-missing-solver-min-release-age.poetry-missing-solver-min-release-age
              --exclude-rule package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age
              --exclude-rule package_managers.ruby.bundler-gemfile-missing-cooldown.bundler-gemfile-missing-cooldown
              --exclude-rule package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
              --exclude-rule package_managers.yarn.yarn-missing-minimal-age-gate.yarn-missing-minimal-age-gate
            )
          fi
          while IFS= read -r pattern; do
            if [[ -n "${pattern}" ]]; then
              args+=(--include "${pattern}")
            fi
          done <<< "${SEMGREP_INCLUDES}"
          if [[ "${SEMGREP_RESTRICT_TO_FILES}" == true ]]; then
            files=()
            while IFS= read -r f; do
              [[ -n "${f}" ]] && files+=("${f}")
            done <<< "${SEMGREP_FILE_NAMES}"
            if (( ${#files[@]} == 0 )); then
              echo "::error::semgrep-file-names input produced no entries"
              exit 1
            fi
            targets=()
            while IFS= read -r -d '' f; do
              targets+=("${f}")
            done < <(git ls-files -z -- "${files[@]}")
            if (( ${#targets[@]} == 0 )); then
              echo "No tracked files matched semgrep-file-names; skipping Semgrep."
              exit 0
            fi
            uvx "${args[@]}" -- "${targets[@]}"
          else
            uvx "${args[@]}" -- "${SEMGREP_TARGET}"
          fi
      - name: Enforce security scan results
        if: ${{ !cancelled() && steps.semgrep.outcome == 'failure' }}
        run: exit 1
  source-trivy-scan:
    if: inputs.use-trivy
    permissions:
      contents: read
    uses: $/.github/workflows/trivy-scan.yml
    with:
      scan-type: filesystem
      scan-ref: ${{ inputs.package-path }}
      submit-dependencies: ${{ inputs.submit-dependencies }}
      snapshot-correlator: ${{ inputs.snapshot-correlator }}
      trivy-scanners: ${{ inputs.trivy-scanners }}
      trivy-severity: ${{ inputs.trivy-severity }}
      trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      trivy-config: ${{ inputs.trivy-config }}
      trivy-timeout: ${{ inputs.trivy-timeout }}
      trivy-exit-code: ${{ inputs.trivy-exit-code }}
      report-format: sarif
      trivy-report-artifact-name: ${{ inputs.trivy-report-artifact-name }}
      runs-on: ${{ inputs.runs-on }}
  source-syft-grype-scan:
    if: inputs.use-syft-grype
    permissions:
      contents: read
    uses: $/.github/workflows/syft-grype-scan.yml
    with:
      scan-type: filesystem
      scan-ref: ${{ inputs.package-path }}
      grype-fail-on: ${{ inputs.grype-fail-on }}
      grype-only-fixed: ${{ inputs.grype-only-fixed }}
      sbom-artifact-name: ${{ inputs.sbom-artifact-name }}
      runs-on: ${{ inputs.runs-on }}
  source-checkov:
    permissions:
      contents: read
    if: inputs.use-checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294  # v12.3135.0
        with:
          directory: ${{ inputs.package-path }}
          framework: ${{ inputs.checkov-framework }}
          skip_framework: ${{ inputs.checkov-skip-framework }}
          check: ${{ inputs.checkov-check }}
          skip_check: ${{ inputs.checkov-skip-check }}
          config_file: ${{ inputs.checkov-config-file }}
          output_format: ${{ inputs.checkov-output-format }}
          output_file_path: ${{ inputs.checkov-output-file-path }}
          soft_fail: ${{ inputs.checkov-soft-fail }}
          api-key: ${{ secrets.BC_API_KEY }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
