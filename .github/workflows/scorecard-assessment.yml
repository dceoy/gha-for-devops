---
# Reusable OpenSSF Scorecard assessment.
# Publication is opt-in and requires id-token: write from the caller.
# The Scorecard job must contain only allowlisted actions, and must not
# have environment variables, run steps, or defaults (OpenSSF API policy).
name: OpenSSF Scorecard assessment
on:
  workflow_call:
    inputs:
      publish-results:
        type: boolean
        default: false
        description: Publish results to OpenSSF and GitHub Code Scanning (requires caller write permissions)
      results-artifact-name:
        type: string
        default: scorecard-results
        description: Internal JSON artifact name; empty uses a one-day transfer artifact for the summary job
      retention-days:
        type: number
        default: 30
        description: Internal JSON artifact retention in days
      min-score:
        type: string
        default: ""
        description: Optional minimum aggregate score (0-10) for internal assessment only
    secrets:
      SCORECARD_TOKEN:
        required: false
        description: Optional token with read access for checks the default token cannot evaluate
permissions:
  contents: read
  actions: read
jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: ${{ inputs['publish-results'] && 'results.sarif' || format('{0}/scorecard.json', runner.temp) }}
          results_format: ${{ inputs['publish-results'] && 'sarif' || 'json' }}
          publish_results: ${{ inputs['publish-results'] }}
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
      - name: Upload internal Scorecard result
        if: ${{ !cancelled() && !inputs['publish-results'] }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs['results-artifact-name'] || 'scorecard-summary-transfer' }}
          path: ${{ runner.temp }}/scorecard.json
          retention-days: ${{ inputs['results-artifact-name'] != '' && inputs['retention-days'] || 1 }}
          if-no-files-found: warn
      - name: Upload Scorecard SARIF artifact
        if: ${{ !cancelled() && inputs['publish-results'] }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
          if-no-files-found: warn
      - name: Upload Scorecard results to code scanning
        if: ${{ !cancelled() && inputs['publish-results'] }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: results.sarif
  summary:
    if: ${{ !inputs['publish-results'] }}
    needs: scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
        working-directory: .
    steps:
      - name: Validate inputs
        env:
          MIN_SCORE: ${{ inputs['min-score'] }}
        run: |
          if [[ -n "${MIN_SCORE}" ]] && ! [[ "${MIN_SCORE}" =~ ^([0-9](\.[0-9]+)?|10(\.0+)?)$ ]]; then
            echo "::error::min-score must be a number between 0 and 10."
            exit 1
          fi
      - name: Download Scorecard result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs['results-artifact-name'] || 'scorecard-summary-transfer' }}
          path: ${{ runner.temp }}
      - name: Summarize findings
        id: summary
        env:
          RESULT_FILE: ${{ runner.temp }}/scorecard.json
          MIN_SCORE: ${{ inputs['min-score'] }}
        run: |
          score="$(jq -r '.score' "${RESULT_FILE}")"
          {
            echo "## OpenSSF Scorecard (private assessment, not published)"
            echo
            echo "Aggregate score: ${score} / 10 (a posture indicator, not a vulnerability count)."
            echo
            echo "| Check | Score | Reason |"
            echo "| --- | --- | --- |"
            jq -r '.checks | sort_by(.score) | map(select(.score < 10)) | .[] | "| [\(.name)](\(.documentation.url)) | \(if .score < 0 then "inconclusive" else (.score | tostring) end) | \(.reason | gsub("\\|"; "/") | gsub("\n"; " ")) |"' "${RESULT_FILE}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ -n "${MIN_SCORE}" ]] && awk -v s="${score}" -v m="${MIN_SCORE}" 'BEGIN { exit !(s < m) }'; then
            echo "::error::Scorecard score ${score} is below min-score ${MIN_SCORE}."
            exit 1
          fi
