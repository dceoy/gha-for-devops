---
# Dual-mode reusable Scorecard. Callers grant GITHUB_TOKEN permissions:
# read-only for internal audits; id-token/security-events write for public publishing.
# Workflow and job permissions are intentionally omitted to inherit the caller's
# least-privilege contract. Checkov's CKV2_GHA_1 exception is file-specific;
# all other checks still apply here, and CKV2_GHA_1 runs on all other workflows.
# https://github.com/ossf/scorecard-action#workflow-restrictions
name: OpenSSF Scorecard assessment
on:
  workflow_call:
    inputs:
      publish-results:
        type: boolean
        default: false
        description: Publish to OpenSSF and code scanning; caller must grant write permissions
      results-artifact-name:
        type: string
        default: scorecard-results
        description: Artifact name for the Scorecard JSON result; empty disables the upload
      retention-days:
        type: number
        default: 30
        description: Artifact retention in days
      min-score:
        type: string
        default: ""
        description: Optional minimum aggregate score (0-10) below which the job fails; empty never fails on score
    secrets:
      SCORECARD_TOKEN:
        required: false
        description: Optional token with read access for checks the default token cannot evaluate
jobs:
  scorecard:
    if: ${{ ! inputs.publish-results }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
        working-directory: .
    steps:
      - name: Validate inputs
        env:
          MIN_SCORE: ${{ inputs.min-score }}
        run: |
          if [[ -n "${MIN_SCORE}" ]] && ! [[ "${MIN_SCORE}" =~ ^([0-9](\.[0-9]+)?|10(\.0+)?)$ ]]; then
            echo "::error::min-score must be a number between 0 and 10."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: ${{ runner.temp }}/scorecard.json
          results_format: json
          publish_results: false
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
      - name: Upload Scorecard result
        if: ${{ !cancelled() && inputs.results-artifact-name != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.results-artifact-name }}
          path: ${{ runner.temp }}/scorecard.json
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn
      - name: Summarize findings
        id: summary
        env:
          RESULT_FILE: ${{ runner.temp }}/scorecard.json
          MIN_SCORE: ${{ inputs.min-score }}
        run: |
          score="$(jq -r '.score' "${RESULT_FILE}")"
          {
            echo "## OpenSSF Scorecard (private assessment, not published)"
            echo
            echo "Aggregate score: ${score} / 10 (a posture indicator, not a vulnerability count)."
            echo
            echo "| Check | Score | Reason |"
            echo "| --- | --- | --- |"
            jq -r '.checks | sort_by(.score) | map(select(.score < 10)) | .[] | "| [\(.name)](\(.documentation.url)) | \(if .score < 0 then "inconclusive" else (.score | tostring) end) | \(.reason | gsub("\\|"; "/") | gsub("\n"; " ")) |"' "${RESULT_FILE}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ -n "${MIN_SCORE}" ]] && awk -v s="${score}" -v m="${MIN_SCORE}" 'BEGIN { exit !(s < m) }'; then
            echo "::error::Scorecard score ${score} is below min-score ${MIN_SCORE}."
            exit 1
          fi
  analysis:
    if: inputs.publish-results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: results.sarif
