---
# Git-history secret scanning with TruffleHog.
#
# Trust model:
# - Read-only: only `contents: read`; no caller secrets are accepted or forwarded.
# - `pull_request_target` is rejected so untrusted fork code never meets a privileged token.
# - Raw secret values are never printed, annotated, or uploaded. TruffleHog JSON output stays in
#   RUNNER_TEMP and only redacted metadata (detector, status, file, line, short commit) is
#   written to the job summary.
# - With `verify: true` (default), TruffleHog sends candidate credentials to the issuing
#   service to check whether they are live. Set `verify: false` to run fully offline
#   (the scanner container then has no network access) and treat every finding as unverified.
# Trivy filesystem `secret` scanning stays in source-security-scan.yml; this workflow covers history.
name: Git history secret scan
on:
  workflow_call:
    inputs:
      scan-mode:
        type: string
        default: range
        description: >
          range scans commits between base-ref and head-ref (pull requests and pushes);
          full scans the complete history of all refs (scheduled or manual deep audits)
      base-ref:
        type: string
        default: ""
        description: Range start (exclusive); defaults to the pull request base SHA or the push before SHA
      head-ref:
        type: string
        default: ""
        description: Range end (inclusive); defaults to the pull request head SHA or the triggering SHA
      verify:
        type: boolean
        default: true
        description: Verify candidate secrets against their issuing services; false disables network access
      fail-on-findings:
        type: boolean
        default: true
        description: Fail when verified secrets are found
      fail-on-unverified:
        type: boolean
        default: false
        description: Also fail on unverified or unknown findings (otherwise they are reported as warnings)
      timeout-minutes:
        type: number
        default: 30
        description: Job timeout in minutes
permissions:
  contents: read
jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Plan checkout depth
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCAN_MODE: ${{ inputs.scan-mode }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == pull_request_target ]]; then
            echo "::error::pull_request_target is not supported; call this workflow from pull_request."
            exit 1
          fi
          # Full audits and non-PR ranges need the whole history; PR ranges need only their commits plus the base.
          depth=0
          if [[ "${SCAN_MODE}" == range && "${EVENT_NAME}" == pull_request && "${PR_COMMITS}" =~ ^[0-9]+$ ]]; then
            depth=$((PR_COMMITS + 1))
          fi
          echo "fetch-depth=${depth}" >> "${GITHUB_OUTPUT}"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.head-ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ steps.plan.outputs.fetch-depth }}
          persist-credentials: false
      - name: Resolve scan range
        id: range
        env:
          SCAN_MODE: ${{ inputs.scan-mode }}
          BASE_INPUT: ${{ inputs.base-ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          case "${SCAN_MODE}" in
            range | full) ;;
            *)
              echo "::error::scan-mode must be 'range' or 'full'."
              exit 1
              ;;
          esac
          head="$(git rev-parse --verify 'HEAD^{commit}')"
          base=""
          skip=false
          if [[ "${SCAN_MODE}" == range ]]; then
            base="${BASE_INPUT:-${PR_BASE:-${PUSH_BEFORE:-}}}"
            if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
              echo "::error::Range scans need a base: set base-ref, or call from a pull_request/push event with an existing base."
              exit 1
            fi
            if ! base="$(git rev-parse --verify "${base}^{commit}" 2>/dev/null)"; then
              echo "::error::Base commit is not in the checked-out history. Use scan-mode: full, or pass a base-ref reachable from head-ref."
              exit 1
            fi
            if [[ "$(git rev-list --count "${base}..${head}")" -eq 0 ]]; then
              echo "::notice::No commits between base and head; nothing to scan."
              skip=true
            fi
          fi
          {
            echo "base=${base}"
            echo "head=${head}"
            echo "skip=${skip}"
          } >> "${GITHUB_OUTPUT}"
      - name: Run TruffleHog
        id: trufflehog
        if: steps.range.outputs.skip != 'true'
        env:
          TRUFFLEHOG_IMAGE: trufflesecurity/trufflehog:3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a
          SCAN_MODE: ${{ inputs.scan-mode }}
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          VERIFY: ${{ inputs.verify }}
        shell: bash
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/trufflehog.jsonl"
          log="${RUNNER_TEMP}/trufflehog.log"
          (umask 077 && : > "${results}" && : > "${log}")
          args=(git file:///repo --no-update --json '--results=verified,unknown,unverified')
          docker_args=(--rm --mount "type=bind,source=${GITHUB_WORKSPACE},target=/repo,readonly"
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env 'GIT_CONFIG_VALUE_0=*')
          if [[ "${VERIFY}" != true ]]; then
            args+=(--no-verification)
            docker_args+=(--network none)
          fi
          if [[ "${SCAN_MODE}" == range ]]; then
            args+=(--since-commit "${BASE_SHA}" --branch "${HEAD_SHA}")
          fi
          status=0
          docker run "${docker_args[@]}" "${TRUFFLEHOG_IMAGE}" "${args[@]}" > "${results}" 2> "${log}" || status=$?
          if [[ "${status}" -ne 0 ]]; then
            echo "::error::TruffleHog failed with exit code ${status}. Scanner log follows (findings are never printed)."
            tail -n 20 "${log}" || true
            exit "${status}"
          fi
          echo "results=${results}" >> "${GITHUB_OUTPUT}"
      - name: Report and enforce results
        if: steps.trufflehog.outputs.results != ''
        env:
          RESULTS_FILE: ${{ steps.trufflehog.outputs.results }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
          FAIL_ON_UNVERIFIED: ${{ inputs.fail-on-unverified }}
        shell: bash
        run: |
          set -euo pipefail
          findings="$(jq -s '[.[] | select(type == "object" and .DetectorName != null)]' "${RESULTS_FILE}")"
          verified="$(jq '[.[] | select(.Verified == true)] | length' <<< "${findings}")"
          unverified="$(jq '[.[] | select(.Verified != true)] | length' <<< "${findings}")"
          {
            echo "## Git history secret scan"
            echo
            echo "- Verified secrets: ${verified}"
            echo "- Unverified or unknown findings: ${unverified}"
            if (( verified + unverified > 0 )); then
              echo
              echo "| Detector | Status | Location | Commit |"
              echo "| --- | --- | --- | --- |"
              # Redacted metadata only: raw secret fields are never emitted.
              jq -r '.[] | "| \(.DetectorName) | \(if .Verified == true then "verified" else "unverified" end) | `\(.SourceMetadata.Data.Git.file // "?"):\(.SourceMetadata.Data.Git.line // 0)` | `\((.SourceMetadata.Data.Git.commit // "?")[0:8])` |"' <<< "${findings}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if (( verified > 0 )); then
            if [[ "${FAIL_ON_FINDINGS}" == true ]]; then
              echo "::error::${verified} verified secret(s) found in Git history. Rotate them; see the job summary for locations."
              exit 1
            fi
            echo "::warning::${verified} verified secret(s) found in Git history (fail-on-findings is false)."
          fi
          if (( unverified > 0 )); then
            if [[ "${FAIL_ON_UNVERIFIED}" == true ]]; then
              echo "::error::${unverified} unverified or unknown finding(s) in Git history."
              exit 1
            fi
            echo "::warning::${unverified} unverified or unknown finding(s) in Git history; review the job summary."
          fi
