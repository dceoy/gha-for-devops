---
name: Lint and scan for HTML/CSS
on:
  workflow_call:
    inputs:
      package-path:
        required: false
        type: string
        description: Path to the frontend or static site project
        default: .
      node-version:
        required: false
        type: string
        description: Node.js version fallback (pnpm prefers package.json devEngines.runtime, then engines.node)
        default: latest
      pnpm-version:
        required: false
        type: string
        description: Optional pnpm version override
        default: ""
      enable-cache:
        required: false
        type: boolean
        description: Cache package-manager downloads
        default: true
      cache-dependency-path:
        required: false
        type: string
        description: Lockfile used to scope the package-manager cache
        default: null
      use-prettier:
        required: false
        type: boolean
        description: Check formatting with Prettier
        default: true
      use-htmlhint:
        required: false
        type: boolean
        description: Lint HTML files with HTMLHint
        default: true
      use-stylelint:
        required: false
        type: boolean
        description: Lint CSS (and related) files with stylelint
        default: true
      lint-html-embedded-css:
        required: false
        type: boolean
        description: Lint CSS inside HTML style tags with stylelint
        default: true
      htmlhint-config:
        required: false
        type: string
        description: Path to an HTMLHint configuration file
        default: null
      stylelint-config:
        required: false
        type: string
        description: Path to a stylelint configuration file
        default: null
      prettier-glob:
        required: false
        type: string
        description: Glob for files to check with Prettier
        default: '**/*.{html,htm,css,scss}'
      html-glob:
        required: false
        type: string
        description: Glob for HTML files to lint with HTMLHint
        default: '**/*.{html,htm}'
      css-glob:
        required: false
        type: string
        description: Glob for CSS files to lint with stylelint
        default: '**/*.{css,scss,sass,less}'
      additional-npm-packages:
        required: false
        type: string
        description: Additional NPM packages to install when package.json is present
        default: null
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-slim
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  lint-and-scan:
    runs-on: ${{ inputs.runs-on }}
    env:
      npm_config_min_release_age: '7'
      NPM_CONFIG_MINIMUM_RELEASE_AGE: '10080'
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: '10080'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Detect the package manager
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        working-directory: ${{ inputs.package-path }}
        run: |
          has_pnpm_version_source() {
            jq -e '
              def is_pnpm_manager: (type == "object") and (.name == "pnpm") and ((.version // "") != "");
              ((.packageManager // "") as $pm | if ($pm | type) == "string" then ($pm | test("^pnpm@.+")) else false end)
              or ((.devEngines.packageManager // null) | if type == "object" then is_pnpm_manager else false end)
            ' package.json > /dev/null 2>&1
          }
          {
            if [[ ! -f package.json ]]; then
              echo 'PACKAGE_LOCK_FILE='
              echo 'PACKAGE_MANAGER=standalone'
            elif [[ -f package-lock.json ]]; then
              echo 'PACKAGE_LOCK_FILE=package-lock.json'
              echo 'PACKAGE_MANAGER=npm'
            elif [[ -f pnpm-lock.yaml ]]; then
              echo 'PACKAGE_LOCK_FILE=pnpm-lock.yaml'
              echo 'PACKAGE_MANAGER=pnpm'
              if [[ -z "${PNPM_VERSION}" ]] && ! has_pnpm_version_source; then
                echo 'PNPM_VERSION=latest'
              fi
            elif [[ -f yarn.lock ]]; then
              echo 'yarn.lock is not supported. Use package-lock.json or pnpm-lock.yaml.' >&2
              exit 1
            else
              echo 'PACKAGE_LOCK_FILE='
              echo 'PACKAGE_MANAGER=npm'
            fi
          } | tee -a "${GITHUB_ENV}"
      - name: Select pnpm setup and Node.js version
        id: pnpm-config
        if: env.PACKAGE_MANAGER == 'pnpm'
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version || env.PNPM_VERSION }}
          NODE_VERSION: ${{ inputs.node-version }}
        working-directory: ${{ inputs.package-path }}
        run: |
          selected="${PNPM_VERSION}"
          if [[ -z "${selected}" ]]; then
            selected="$(jq -r '
              if .devEngines.packageManager.name == "pnpm" then .devEngines.packageManager.version // ""
              else .packageManager // "" end
            ' package.json)"
          fi
          selected="${selected#pnpm@}"
          major=''
          if [[ "${selected}" =~ ([0-9]+) ]]; then
            major="${BASH_REMATCH[1]}"
          fi
          legacy=false
          if [[ -n "${major}" ]] && (( 10#${major} < 11 )); then
            legacy=true
          elif [[ "${major}" == 11 && "${RUNNER_OS}-${RUNNER_ARCH}" == macOS-X64 ]]; then
            legacy=true
          fi
          node_version="$(jq -r '
            . as $manifest
            | (.devEngines.runtime // [])
            | if type == "array" then . else [.] end
            | map(select(.name == "node"))
            | if length > 1 then error("Multiple Node.js runtime declarations")
              elif length == 1 then
                .[0].version | if type == "string" and length > 0 then .
                  else error("Node.js runtime.version must be a nonempty string") end
              else $manifest.engines.node // "" end
            | if type == "string" then . else error("engines.node must be a string") end
          ' package.json)"
          node_version="${node_version:-${NODE_VERSION}}"
          case "${node_version}" in
            node|stable|current|\*) node_version=latest ;;
            lts/\*) node_version=lts ;;
            lts/-*)
              offset="${node_version#lts/-}"
              if [[ ! "${offset}" =~ ^[0-9]+$ ]]; then
                echo "Invalid Node.js LTS offset: ${node_version}" >&2
                exit 1
              fi
              node_version="$(curl -fsSL https://nodejs.org/dist/index.json | jq -r --argjson offset "$((10#${offset}))" '[.[] | select(.lts) | .version | capture("^v(?<major>[0-9]+)\\.").major | tonumber] | unique | sort | reverse | .[$offset] // empty')"
              if [[ -z "${node_version}" ]]; then
                echo "Unable to resolve Node.js LTS selector: ${NODE_VERSION}" >&2
                exit 1
              fi
              ;;
            lts/*) node_version="${node_version#lts/}" ;;
          esac
          {
            echo "legacy=${legacy}"
            echo "node-version=${node_version}"
          } >> "${GITHUB_OUTPUT}"
      - name: Bootstrap Node.js for legacy pnpm on Intel macOS
        if: env.PACKAGE_MANAGER == 'pnpm' && steps.pnpm-config.outputs.legacy == 'true' && runner.os == 'macOS' && runner.arch == 'X64'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: latest
      - name: Setup pnpm and Node.js
        if: env.PACKAGE_MANAGER == 'pnpm' && steps.pnpm-config.outputs.legacy != 'true'
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024  # v3
        with:
          version: ${{ inputs.pnpm-version || env.PNPM_VERSION }}
          runtime: node@${{ steps.pnpm-config.outputs.node-version }}
          working-directory: ${{ inputs.package-path }}
          install: false
          cache: ${{ inputs.enable-cache }}
          cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/pnpm-lock.yaml', inputs.package-path) }}
      - name: Setup legacy pnpm
        if: env.PACKAGE_MANAGER == 'pnpm' && steps.pnpm-config.outputs.legacy == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: ${{ inputs.pnpm-version || env.PNPM_VERSION }}
          package_json_file: ${{ format('{0}/package.json', inputs.package-path) }}
          standalone: ${{ runner.os != 'macOS' || runner.arch != 'X64' }}
      - name: Setup Node.js for legacy pnpm
        if: env.PACKAGE_MANAGER == 'pnpm' && steps.pnpm-config.outputs.legacy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ steps.pnpm-config.outputs.node-version }}
          cache: ${{ inputs.enable-cache && 'pnpm' || '' }}
          cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/pnpm-lock.yaml', inputs.package-path) }}
      - name: Setup Node.js
        if: env.PACKAGE_MANAGER != 'pnpm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.enable-cache && env.PACKAGE_MANAGER == 'npm' && env.PACKAGE_LOCK_FILE != '' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/{1}', inputs.package-path, env.PACKAGE_LOCK_FILE) }}
      - name: Install dependencies or provide standalone wrappers
        env:
          ADDITIONAL_NPM_PACKAGES: ${{ inputs.additional-npm-packages }}
        working-directory: ${{ inputs.package-path }}
        run: | # zizmor: ignore[adhoc-packages] installs project packages or provides npm-exec wrappers
          case "${PACKAGE_MANAGER}" in
            pnpm )
              pnpm install --frozen-lockfile
              pnpm add --save-dev \
                ${{ inputs.use-prettier && 'prettier' || '' }} \
                ${{ inputs.use-htmlhint && 'htmlhint' || '' }} \
                ${{ inputs.use-stylelint && 'stylelint stylelint-config-standard' || '' }} \
                ${{ inputs.lint-html-embedded-css && 'postcss-html' || '' }}
              ;;
            npm )
              if [[ -f package-lock.json ]]; then
                npm ci
              else
                npm install
              fi
              npm install --save-dev \
                ${{ inputs.use-prettier && 'prettier' || '' }} \
                ${{ inputs.use-htmlhint && 'htmlhint' || '' }} \
                ${{ inputs.use-stylelint && 'stylelint stylelint-config-standard' || '' }} \
                ${{ inputs.lint-html-embedded-css && 'postcss-html' || '' }}
              ;;
            standalone )
              if [[ -n "${ADDITIONAL_NPM_PACKAGES}" ]]; then
                echo 'additional-npm-packages requires package.json.' >&2
                exit 1
              fi
              NPM_PREFIX="${RUNNER_TEMP}/html-lint"
              packages=()
              [[ "${{ inputs.use-prettier }}" == 'true' ]] && packages+=(prettier)
              [[ "${{ inputs.use-htmlhint }}" == 'true' ]] && packages+=(htmlhint)
              [[ "${{ inputs.use-stylelint }}" == 'true' ]] && packages+=(stylelint stylelint-config-standard)
              [[ "${{ inputs.lint-html-embedded-css }}" == 'true' ]] && packages+=(postcss-html)
              if [[ "${#packages[@]}" -gt 0 ]]; then
                npm install --prefix "${NPM_PREFIX}" --no-package-lock --no-save "${packages[@]}"
              fi
              mkdir -p "${HOME}/.local/bin"
              cat > "${HOME}/.local/bin/htmlhint" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec "${NPM_PREFIX}/node_modules/.bin/htmlhint" "\$@"
          EOF
              cat > "${HOME}/.local/bin/stylelint" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec "${NPM_PREFIX}/node_modules/.bin/stylelint" --config-basedir "${NPM_PREFIX}/node_modules" "\$@"
          EOF
              cat > "${HOME}/.local/bin/prettier" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec "${NPM_PREFIX}/node_modules/.bin/prettier" "\$@"
          EOF
              chmod 0755 "${HOME}/.local/bin/htmlhint" "${HOME}/.local/bin/stylelint" "${HOME}/.local/bin/prettier"
              echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
              ;;
          esac
          if [[ "${PACKAGE_MANAGER}" != 'standalone' ]]; then
            for p in $(tr ' ' '\n' <<< "${ADDITIONAL_NPM_PACKAGES}"); do
              if [[ -n "${p}" ]]; then
                case "${PACKAGE_MANAGER}" in
                  pnpm ) pnpm add --save-dev "${p}" ;;
                  npm ) npm install --save-dev "${p}" ;;
                esac
              fi
            done
            echo "PATH=${PWD}/node_modules/.bin:${PATH}" >> "${GITHUB_ENV}"
          fi
      - name: Run HTMLHint on HTML files
        if: inputs.use-htmlhint
        env:
          HTMLHINT_CONFIG: ${{ inputs.htmlhint-config }}
          HTML_GLOB: ${{ inputs.html-glob }}
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ -n "${HTMLHINT_CONFIG}" ]]; then
            htmlhint --config "${HTMLHINT_CONFIG}" "${HTML_GLOB}"
          else
            htmlhint "${HTML_GLOB}"
          fi
      - name: Run stylelint on CSS files
        if: inputs.use-stylelint
        env:
          STYLELINT_CONFIG: ${{ inputs.stylelint-config }}
          CSS_GLOB: ${{ inputs.css-glob }}
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ -n "${STYLELINT_CONFIG}" ]]; then
            stylelint --config "${STYLELINT_CONFIG}" "${CSS_GLOB}"
          else
            stylelint "${CSS_GLOB}"
          fi
      - name: Run stylelint on embedded CSS in HTML files
        if: inputs.use-stylelint && inputs.lint-html-embedded-css
        env:
          STYLELINT_CONFIG: ${{ inputs.stylelint-config }}
          HTML_GLOB: ${{ inputs.html-glob }}
        working-directory: ${{ inputs.package-path }}
        run: |
          if [[ -n "${STYLELINT_CONFIG}" ]]; then
            stylelint --config "${STYLELINT_CONFIG}" --custom-syntax postcss-html "${HTML_GLOB}"
          else
            stylelint --custom-syntax postcss-html "${HTML_GLOB}"
          fi
      - name: Check formatting with Prettier
        if: inputs.use-prettier
        env:
          PRETTIER_GLOB: ${{ inputs.prettier-glob }}
        working-directory: ${{ inputs.package-path }}
        run: >
          prettier --check "${PRETTIER_GLOB}"
