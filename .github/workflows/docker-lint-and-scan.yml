---
name: Lint and security scan for Dockerfile
on:
  workflow_call:
    inputs:
      hadolint-dockerfile:
        required: false
        type: string
        description: Dockerfile name to lint
        default: Dockerfile
      hadolint-failure-threshold:
        required: false
        type: string
        description: Hadolint failure threshold
        default: error
      hadolint-recursive:
        required: false
        type: boolean
        description: Search for Dockerfile recursively from the project root
        default: true
      trivy-scan-ref:
        required: false
        type: string
        description: Scan reference
        default: .
      use-trivy:
        required: false
        type: boolean
        description: Run Trivy source scanning
        default: true
      submit-dependencies:
        required: false
        type: boolean
        default: false
        description: Publish dependency snapshots from the existing source scan on trusted default-branch events
      snapshot-correlator:
        required: false
        type: string
        default: source-root
      use-syft-grype:
        type: boolean
        default: false
        description: Enable optional Syft SBOM generation and Grype scanning
      grype-fail-on:
        type: string
        default: high
        description: Minimum vulnerability severity that fails the scan; empty disables the severity threshold
      grype-only-fixed:
        type: boolean
        default: true
        description: Report only vulnerabilities with an available fix
      sbom-artifact-name:
        type: string
        default: null
        description: Optional artifact name prefix for Syft SBOMs and Grype JSON; empty disables report upload
      trivy-scanners:
        required: false
        type: string
        description: List of scanners to use
        default: vuln,secret,misconfig
      trivy-severity:
        required: false
        type: string
        description: Severity levels to fail the scan
        default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      trivy-ignore-unfixed:
        required: false
        type: boolean
        description: Ignore unpatched/unfixed vulnerabilities
        default: true
      trivy-exit-code:
        required: false
        type: number
        description: Exit code for pre-build scan
        default: 1
      trivy-config:
        required: false
        type: string
        description: Path to a Trivy config file
        default: null
      trivy-timeout:
        required: false
        type: string
        description: Timeout for the Trivy scan
        default: 5m0s
      trivy-report-artifact-name:
        required: false
        type: string
        description: Unique name for the Trivy report artifact; omit to skip the report upload
        default: null
      use-checkov:
        required: false
        type: boolean
        description: Use Checkov to scan Dockerfiles
        default: true
      checkov-framework:
        required: false
        type: string
        description: Checkov frameworks to scan
        default: dockerfile
      checkov-skip-framework:
        required: false
        type: string
        description: Checkov frameworks to skip
        default: null
      checkov-check:
        required: false
        type: string
        description: Checkov checks to include
        default: null
      checkov-skip-check:
        required: false
        type: string
        description: Checkov checks to skip
        default: null
      checkov-config-file:
        required: false
        type: string
        description: Path to a Checkov config file
        default: null
      checkov-output-format:
        required: false
        type: string
        description: Checkov output formats
        default: github_failed_only
      checkov-output-file-path:
        required: false
        type: string
        description: Checkov output file path(s)
        default: null
      checkov-soft-fail:
        required: false
        type: boolean
        description: Always return exit code 0 from Checkov
        default: false
      use-semgrep:
        required: false
        type: boolean
        description: Run Semgrep OSS SAST scan using p/default rules
        default: true
      runs-on:
        required: false
        type: string
        description: GitHub Actions runner to use
        default: ubuntu-latest
      security-runs-on:
        required: false
        type: string
        description: Runner for Docker-free source security scans (Trivy and Semgrep)
        default: ubuntu-slim
    secrets:
      GH_TOKEN:
        required: false
        description: Deprecated and unused; retained for caller compatibility
      BC_API_KEY:
        required: false
        description: Bridgecrew or Prisma Cloud API key
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
permissions:
  contents: read
jobs:
  docker-security-scan:
    permissions:
      contents: read
    uses: $/.github/workflows/source-security-scan.yml
    with:
      runs-on: ${{ inputs.security-runs-on }}
      use-osv-scanner: false
      use-semgrep: ${{ inputs.use-semgrep }}
      package-path: ${{ inputs.trivy-scan-ref }}
      submit-dependencies: ${{ inputs.submit-dependencies }}
      snapshot-correlator: ${{ inputs.snapshot-correlator }}
      use-trivy: ${{ inputs.use-trivy }}
      use-syft-grype: ${{ inputs.use-syft-grype }}
      grype-fail-on: ${{ inputs.grype-fail-on }}
      grype-only-fixed: ${{ inputs.grype-only-fixed }}
      sbom-artifact-name: ${{ inputs.sbom-artifact-name }}
      trivy-scanners: ${{ inputs.trivy-scanners }}
      trivy-severity: ${{ inputs.trivy-severity }}
      trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
      trivy-config: ${{ inputs.trivy-config }}
      trivy-exit-code: ${{ inputs.trivy-exit-code }}
      trivy-timeout: ${{ inputs.trivy-timeout }}
      trivy-report-artifact-name: ${{ inputs.trivy-report-artifact-name }}
      use-checkov: ${{ inputs.use-checkov }}
      checkov-framework: ${{ inputs.checkov-framework }}
      checkov-skip-framework: ${{ inputs.checkov-skip-framework }}
      checkov-check: ${{ inputs.checkov-check }}
      checkov-skip-check: ${{ inputs.checkov-skip-check }}
      checkov-config-file: ${{ inputs.checkov-config-file }}
      checkov-output-format: ${{ inputs.checkov-output-format }}
      checkov-output-file-path: ${{ inputs.checkov-output-file-path }}
      checkov-soft-fail: ${{ inputs.checkov-soft-fail }}
      semgrep-target: ${{ inputs.trivy-scan-ref }}
      semgrep-includes: |
        Dockerfile*
        *.dockerfile
    secrets:
      BC_API_KEY: ${{ secrets.BC_API_KEY }}
  docker-lint-and-scan:
    permissions:
      contents: read
    runs-on: ${{ inputs.runs-on }}
    env:
      UV_EXCLUDE_NEWER: 1 day
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Lint the code using hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: ${{ inputs.hadolint-dockerfile }}
          failure-threshold: ${{ inputs.hadolint-failure-threshold }}
          recursive: ${{ inputs.hadolint-recursive }}
