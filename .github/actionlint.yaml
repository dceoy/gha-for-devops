---
self-hosted-runner:
  labels:
    - ubuntu-slim
# GitHub supports concurrency.queue; rhysd/actionlint v1.7.12 does not (rhysd/actionlint#657).
# Keep narrow suppressions until actionlint recognizes this field.
paths:
  .github/workflows/python-package-format-and-pr.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/typescript-package-format-and-pr.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/r-package-format-and-pr.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/markdown-format-and-pr.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/terraform-format-and-pr.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  # GitHub.com supports $/ self-repository calls; keep parity with CI compatibility mode.
  .github/workflows/ci.yml:
    ignore:
      - 'reusable workflow call "\$/.+" at "uses" is not following the format'
  .github/workflows/maintenance.yml:
    ignore:
      - 'reusable workflow call "\$/.+" at "uses" is not following the format'
  .github/workflows/hugo-deploy-to-gh-pages.yml:
