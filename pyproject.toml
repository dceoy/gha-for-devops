[project]
name = "local-qa"
version = "0.1.0"
description = "Local QA tooling for gha-for-devops"
authors = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
maintainers = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/dceoy/gha-for-devops.git"

[tool.uv]
package = false
exclude-newer = "7 days"
# Upstream QA tools pin older versions; keep the compatible patched releases.
override-dependencies = ["asteval>=1.0.9,<2", "mcp>=1.30.0,<2"]

[dependency-groups]
dev = [
    "checkov",
    "pyright",
    "ruff",
    "semgrep",
    "yamllint",
    "zizmor",
]
